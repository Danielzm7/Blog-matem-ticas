<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Dirigible: compara dos números decimales y elige el signo mayor, menor o igual. Para niños de 8 a 10 años.">
<title>Dirigible: compara decimales</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#12082e;color:var(--ink);
  font-family:'Fredoka','Nunito','Baloo 2','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;font-weight:700}
button{font:inherit;color:inherit}
#wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:6px}
.volver{align-self:center;color:#cfe3fb;text-decoration:none;font-size:15px;min-height:28px;display:inline-flex;align-items:center;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.08)}
.volver:hover{background:rgba(255,255,255,.18);color:#fff}
#stage{position:relative;width:var(--W);aspect-ratio:16/10;container-type:inline-size;overflow:hidden;
  border-radius:calc(var(--W)*.022);background:#2b1456;isolation:isolate;
  box-shadow:0 calc(var(--W)*.015) calc(var(--W)*.05) rgba(0,0,0,.55);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#world{position:absolute;inset:0}
#scene{position:absolute;left:0;top:0;width:100%;height:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:max(3px,.4cqw) solid #fff;outline-offset:max(2px,.3cqw)}

/* ---------- Marcos hexagonales con borde doble ---------- */
.hex{--c1:#2a7de1;--c2:#4fc3ff;position:relative;display:block;width:var(--w,7cqw);aspect-ratio:1/.866;
  filter:drop-shadow(0 0 .55cqw rgba(79,195,255,.65));border:0;background:none;padding:0;margin:0}
.hex>i,.hex>i>i,.hex>i>i>i{position:absolute;display:block;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.hex>i{inset:0;background:linear-gradient(160deg,var(--c2),var(--c1))}
.hex>i>i{inset:7%;background:#fff}
.hex>i>i>i{inset:7%;background:linear-gradient(180deg,#f6faff,#c9defa);display:grid;place-items:center;overflow:hidden}
.hex svg{width:78%;height:78%;display:block}
button.hex{cursor:pointer;transition:transform .15s,filter .15s}
button.hex:hover{transform:translateY(-.3cqw) scale(1.05);filter:drop-shadow(0 0 .9cqw rgba(255,255,255,.9))}
button.hex:active{transform:scale(.96)}
.hexw{--c1:#2a7de1;--c2:#4fc3ff;position:relative;display:block;height:6.4cqw;min-width:14.5cqw;
  filter:drop-shadow(0 0 .55cqw rgba(79,195,255,.65))}
.hexw>i,.hexw>i>i,.hexw>i>i>i{position:absolute;display:block;clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%)}
.hexw>i{inset:0;background:linear-gradient(160deg,var(--c2),var(--c1))}
.hexw>i>i{inset:7%;background:#fff}
.hexw>i>i>i{inset:7%;background:linear-gradient(180deg,#f6faff,#c9defa);display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.05;padding:0 .6cqw}
.hexw small{font-size:max(10px,1.3cqw);color:#4a5a8c;letter-spacing:.02em;font-weight:700}
.hexw b{font-size:max(13px,1.95cqw);color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}


/* ---------- Modales ---------- */
.overlay{position:absolute;inset:0;z-index:20;display:none;place-items:center;background:rgba(14,6,40,.62)}
.overlay.on{display:grid}
.modal{position:relative;width:62cqw;border-radius:2.4cqw;padding:5cqw 3cqw 2.6cqw;text-align:center;
  background:linear-gradient(180deg,#f8fcff,#c9e0fb);border:max(3px,.45cqw) solid #fff;box-shadow:0 0 0 max(3px,.5cqw) #2a7de1,0 1cqw 3cqw rgba(0,0,0,.55)}
.modal .pill{position:absolute;left:50%;top:0;transform:translate(-50%,-50%)}
.modal p{margin:.6cqw 0;font-size:max(14px,2.3cqw);line-height:1.3;color:var(--ink)}
.ej{margin:1.4cqw auto 1.8cqw;padding:1.2cqw 2cqw;border-radius:1.6cqw;background:#fff;border:.35cqw dashed #5b2bb5;display:inline-block}
.ej b{color:#5b2bb5}
#dim{position:absolute;inset:0;z-index:12;background:rgba(10,4,30,.74);opacity:0;pointer-events:none;transition:opacity .6s}
#dim.on{opacity:1}
#fin{z-index:15;background:transparent}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqw;margin:1.4cqw 0 2cqw}
.mini{display:flex;flex-direction:column;align-items:center;gap:.8cqw}
.mini .hex{--w:72%}
.mini .hex svg{width:80%;height:80%}
.mini span{font-size:max(12px,1.9cqw);line-height:1.15;color:var(--ink)}
.mini b{display:block;font-size:max(16px,3cqw);color:var(--p2)}
#cuenta{position:absolute;inset:0;z-index:11;display:none;place-items:center;pointer-events:none}
#cuenta.on{display:grid}
#cuenta span{font-size:24cqw;color:#fff;text-shadow:0 1cqw 0 #5b2bb5,0 0 4cqw rgba(79,195,255,.9);animation:cnt .9s ease-out both}
@keyframes cnt{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(.9);opacity:.9}}
.rays{animation:spin 12s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}


.pill{background:linear-gradient(180deg,#8a55ea,#4a1fa0);color:#fff;border-radius:99px;padding:.6cqw 3.2cqw;font-size:max(15px,2.5cqw);
  box-shadow:0 .4cqw 0 #2b1456,inset 0 .2cqw 0 rgba(255,255,255,.35);text-shadow:0 .2cqw 0 rgba(0,0,0,.35);display:inline-block;white-space:nowrap}
.btn{border:0;border-radius:99px;cursor:pointer;min-height:48px;padding:1cqw 6cqw;color:#fff;font-size:max(17px,2.8cqw);letter-spacing:.06em;
  background:linear-gradient(90deg,#2a7de1,#7a3be0);box-shadow:0 .5cqw 0 #1b2f84,0 1cqw 2cqw rgba(0,0,0,.35),inset 0 .2cqw 0 rgba(255,255,255,.35);
  text-shadow:0 .2cqw 0 rgba(0,0,0,.3);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.12);transform:translateY(-.3cqw)}
.btn:active{transform:translateY(.3cqw)}


#stage{background:#0b1a3a}
:root{--W:min(100vw - 16px,(100dvh - 52px)*1.6)}
#scene{position:absolute;left:0;top:0;width:100%;height:100%}
.volver{align-self:center;color:#cfe3fb;text-decoration:none;font-size:15px;min-height:28px;display:inline-flex;align-items:center;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.08)}
.volver:hover{background:rgba(255,255,255,.18);color:#fff}
#wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:6px}
:focus-visible{outline:max(3px,.4cqw) solid #fff;outline-offset:max(2px,.3cqw)}
.tw{animation:tw 3.2s ease-in-out infinite}@keyframes tw{50%{opacity:.25}}
#hudR{position:absolute;right:2cqw;top:2cqw;display:flex;align-items:center;gap:1.4cqw;z-index:8}
#hudR .hex{--w:max(56px,7cqw)}#hudR .hex svg{width:62%;height:62%}
#mudoX{opacity:1}#btnSonido[aria-pressed=false] #mudoX{opacity:0}
.paused *{animation-play-state:paused!important}
#msg{position:absolute;left:0;right:0;top:34%;text-align:center;z-index:9;font-size:max(26px,6cqw);color:#fff;text-shadow:0 .5cqw 0 rgba(0,0,0,.45),0 0 2cqw rgba(0,0,0,.5);pointer-events:none;opacity:0}
#msg.ok{color:#9dff6b}#msg.bad{color:#ff9a9a}
.cards{display:grid;gap:1cqw;margin:1.4cqw 0 2.4cqw}
.mini{display:flex;align-items:center;gap:1.4cqw;background:#fff;border-radius:99px;padding:.5cqw 2cqw .5cqw .6cqw;color:#1d1a4d;font-size:max(14px,2.3cqw);box-shadow:0 .3cqw 0 rgba(0,0,0,.12)}
.mini .hex{--w:max(46px,6.2cqw);flex:none}.mini span:last-child{flex:1;text-align:left;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.mode-titulo :is(#hudL4,#ruta,#pregunta,#cartas,#opts,#expl,#msg,#btnPausa){display:none}
.mode-juego #titulo{display:none}
.hex,.hexw{--c1:#8A4BE0;--c2:#FFC928;filter:drop-shadow(0 0 .55cqw rgba(255,201,40,.7))}
.btn{background:linear-gradient(90deg,#F07A1A,#FFB347)}
#titulo{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;padding-top:6cqw;text-align:center}
#titulo h1{margin:0;font-size:9cqw;line-height:1;color:#FFE08A;letter-spacing:.02em;text-shadow:0 .6cqw 0 #8A4BE0,0 1.2cqw 0 #34127A,0 2cqw 2cqw rgba(0,0,0,.35)}
#titulo .sub{margin:.8cqw 0 1.4cqw;font-size:max(16px,3.2cqw);color:#fff;letter-spacing:.14em;text-shadow:0 .2cqw 0 #34127A}
#dirT{width:34cqw;margin-bottom:3cqw;animation:flota 3s ease-in-out infinite alternate}#dirT svg,#dir svg{width:100%;display:block;filter:drop-shadow(0 1cqw .8cqw rgba(0,0,0,.3))}
@keyframes flota{to{transform:translateY(-1.4cqw)}}
.nube{animation:nubes 18s linear infinite alternate}@keyframes nubes{to{transform:translate(120px,0)}}
#hudL4{position:absolute;left:2cqw;top:2cqw;z-index:6;display:flex;flex-direction:column;gap:.8cqw}
#vidas{display:flex;gap:.6cqw;background:#34127Acc;padding:.6cqw 1.2cqw;border-radius:1.2cqw;border:max(2px,.35cqw) solid #FFC928}
#vidas i{width:3.6cqw;min-width:20px;display:block;transition:transform .3s}#vidas i.off{transform:scale(.8);opacity:.7}#vidas svg{width:100%;display:block}
#prog{align-self:flex-start;font-size:max(13px,2.2cqw);color:#fff;background:#34127Acc;padding:.3cqw 1.4cqw;border-radius:1cqw}
#ruta{position:absolute;left:12cqw;right:12cqw;top:11cqw;height:9cqw;z-index:3}
#ruta::after{content:"";position:absolute;left:0;right:0;top:8cqw;height:.5cqw;border-radius:1cqw;background:repeating-linear-gradient(90deg,#fff 0 2cqw,transparent 2cqw 3.4cqw);opacity:.6}
#dir{position:absolute;top:0;left:calc(var(--p,0) * 78%);width:10cqw;transition:left .8s ease}
#pregunta{position:absolute;left:0;right:0;top:22cqw;z-index:6;text-align:center;font-size:max(16px,3.4cqw);color:#fff;text-shadow:0 .3cqw 0 #34127A}
#cartas{position:absolute;left:0;right:0;top:28cqw;z-index:6;display:flex;justify-content:center;align-items:center;gap:3cqw}
.carta{min-width:24cqw;text-align:center;font-size:max(24px,6.4cqw);padding:1cqw 2cqw;border-radius:2cqw;background:#fff;color:#34127A;border:max(3px,.5cqw) solid #8A4BE0;box-shadow:0 .8cqw 0 #5A2AB0;font-variant-numeric:tabular-nums}
.vs{font-size:max(22px,5cqw);color:#FFE08A;text-shadow:0 .3cqw 0 #34127A}
#opts{position:absolute;left:0;right:0;top:45cqw;z-index:6;display:flex;justify-content:center;gap:3cqw}
.op{position:relative;width:16cqw;min-width:64px;height:9.5cqw;min-height:56px;border:max(3px,.5cqw) solid #34127A;border-radius:2cqw;background:linear-gradient(180deg,#FFD35A,#F5A623);color:#34127A;font-size:max(26px,6.4cqw);cursor:pointer;box-shadow:0 .8cqw 0 #A8650A}
.op .k{position:absolute;right:1cqw;bottom:.2cqw;font-size:max(11px,1.8cqw);opacity:.7}
.op:hover:not(:disabled){transform:translateY(-.3cqw)}.op:active:not(:disabled){transform:translateY(.4cqw)}
.op.ok{background:linear-gradient(180deg,#5CE08A,#1E8A44);color:#fff}.op.mal{background:linear-gradient(180deg,#FF7A6A,#C2330A);color:#fff}
#expl{position:absolute;left:0;right:0;top:57cqw;z-index:6;text-align:center;font-size:max(15px,3.2cqw);color:#fff;text-shadow:0 .3cqw 0 #34127A}
#msg{position:absolute;right:auto;width:max-content;left:50%;top:5cqw;transform:translateX(-50%);z-index:8;opacity:0;pointer-events:none;font-size:max(18px,3.8cqw);padding:.4cqw 3cqw;border-radius:2cqw;color:#fff;transition:opacity .2s}#msg.ok{background:#1E8A44;color:#fff}#msg.bad{background:#C2330A;color:#fff}
#stage.tiembla{animation:trem .4s}@keyframes trem{25%{transform:translateX(-1cqw)}75%{transform:translateX(1cqw)}}
@media (prefers-reduced-motion:reduce){.nube,#dirT{animation:none}}
@media (max-width:700px) and (orientation:portrait){
  :root{--W:min(100vw - 16px,(100dvh - 52px)*.6)}
  #stage{aspect-ratio:3/5}
  #titulo{padding-top:16cqw}#titulo h1{font-size:14cqw}#titulo .sub{font-size:max(15px,5cqw)}#dirT{width:70cqw}
  #vidas i{width:7cqw}#prog{font-size:max(13px,4cqw)}
  #ruta{left:6cqw;right:6cqw;top:24cqw;height:24cqw}#ruta::after{top:20cqw}#dir{width:24cqw}
  #pregunta{top:52cqw;font-size:max(16px,5.2cqw)}
  #cartas{top:62cqw;gap:2cqw}.carta{min-width:38cqw;font-size:max(24px,9.4cqw)}.vs{font-size:max(20px,7cqw)}
  #cartas{flex-wrap:wrap}
  #opts{top:86cqw;gap:4cqw}.op{width:24cqw;height:18cqw;font-size:max(28px,10cqw)}
  #expl{top:110cqw;font-size:max(15px,4.6cqw);padding:0 4cqw}
  #msg{top:48cqw;font-size:max(18px,6cqw)}
}

</style>
</head>

  <div id="world">
    <svg id="scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    
    <section id="titulo" aria-label="Título"><h1>DIRIGIBLE</h1><p class="sub">compara decimales</p><div id="dirT" aria-hidden="true"></div><button class="btn" id="btnEmpezar" type="button">JUGAR</button></section>
    <div id="hudL4"><div id="vidas" role="img" aria-label="Vidas"></div><div id="prog" aria-live="polite"></div></div>

    <div id="cartas"><div class="carta" id="numA" aria-label="Primer número"></div><div class="vs" aria-hidden="true">?</div><div class="carta" id="numB" aria-label="Segundo número"></div></div>
    <div id="opts" role="group" aria-label="Elige el signo"><button class="op" type="button" data-s="&lt;" aria-label="Menor que">&lt;<span class="k" aria-hidden="true">1</span></button><button class="op" type="button" data-s="=" aria-label="Igual a">=<span class="k" aria-hidden="true">2</span></button><button class="op" type="button" data-s="&gt;" aria-label="Mayor que">&gt;<span class="k" aria-hidden="true">3</span></button></div>
    <div id="expl" aria-live="polite"></div>
    <div id="msg" role="status" aria-live="assertive"></div>
    <div id="hudR"><button class="hex" id="btnPausa" type="button" aria-label="Pausa"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="16" y="14" width="12" height="36" rx="4" fill="#5b2bb5"/><rect x="36" y="14" width="12" height="36" rx="4" fill="#5b2bb5"/></svg></i></i></i></button><button class="hex" id="btnSonido" type="button" aria-label="Sonido" aria-pressed="false"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M10 25h10l14-11v36L20 39H10z" fill="#2a7de1"/><path d="M41 23c5 5 5 13 0 18M47 16c9 9 9 23 0 32" stroke="#2a7de1" stroke-width="4" fill="none" stroke-linecap="round"/><path id="mudoX" d="M14 50 52 12" stroke="#e02020" stroke-width="6" stroke-linecap="round"/></svg></i></i></i></button></div>
    <div id="msg" role="status" aria-live="polite"></div>

  <div class="overlay" id="ovPausa">

</div>

<script>
'use strict';
const CANCEL = { cancelado: true };
const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } }
};
const mezclar = (a, azar = Math.random) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(azar() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ent = (azar, lo, hi) => lo + Math.floor(azar() * (hi - lo + 1));
const elige = (a, azar = Math.random) => a[Math.floor(azar() * a.length)];
/* ============================================================
   DIRIGIBLE DE DECIMALES: compara dos decimales con <, = o >  (juego "inspirado": reglas propias)
   Estructura: 1 config · 2 estado · 3 motor · 4 arte · 5 render · 6 flujo · 7 eventos
   ============================================================ */
/* ====================== 1. CONFIG ====================== */
const CFG = {
  INSPIRADO: true,        // la mecánica exacta del juego de referencia no se pudo confirmar: esta es una versión propia
  PREGUNTAS: 15, VIDAS: 3,
  TRAMOS: [{ hasta: 5, cifras: 1 }, { hasta: 10, cifras: 2 }, { hasta: 15, cifras: 3 }],   // índice de pregunta → cifras decimales máximas
  PAUSA_ACIERTO: 1500, PAUSA_ERROR: 2300,
  VEL: [{ x: 1, f: 1, ritmo: 1 }], K_REC: 'dir_mejor', K_MUDO: 'sc_mute'
};
/* ====================== 2. ESTADO ====================== */
const S = { pantalla: 'titulo', corrida: 0, pausas: new Set(), vel: 0, fin: false, n: 0, vidas: CFG.VIDAS, aciertos: 0, q: null, esperando: false, usados: new Set(), resolver: null };

const vivas = new Set();
const D = ms => RM ? ms * 0.3 : ms * CFG.VEL[S.vel].f;     // duración según velocidad visual
function limpia(el) { el.getAnimations().forEach(a => a.cancel()); }
function anima(el, kf, op = {}) {
  const c = S.corrida;
  const a = el.animate(kf, Object.assign({ fill: 'forwards', easing: 'ease-out' }, op));
  vivas.add(a); if (S.pausas.size) a.pause();
  return a.finished.then(() => 0, () => 0).then(() => { vivas.delete(a); if (c !== S.corrida) throw CANCEL; });
}
/* Espera que se detiene mientras el juego está en pausa y se cancela al reiniciar */
function esperar(ms) {
  const c = S.corrida;
  return new Promise((res, rej) => {
    let acum = 0, ult = performance.now();
    (function f(t) {
      if (c !== S.corrida) return rej(CANCEL);
      const dt = Math.min(100, t - ult); ult = t; if (!S.pausas.size) acum += dt;
      if (acum >= ms) res(); else requestAnimationFrame(f);
    })(ult);
  });
}

/* ============================ 7. AUDIO (Web Audio, sin archivos) ============================ */
const Snd = (() => {
  let ctx = null, master = null, mus = null, mudo = store.get(CFG.K_MUDO) === '1', timer = null, paso = 0, prox = 0;
  const ACORDES = [[220, 261.63, 329.63], [174.61, 220, 261.63], [261.63, 329.63, 392], [196, 246.94, 293.66]]; // La m, Fa, Do, Sol
  const NEG = 60 / 92 / 2;                                         // corchea a 92 bpm
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC(); master = ctx.createGain(); master.gain.value = mudo ? 0 : .7; master.connect(ctx.destination);
    mus = ctx.createGain(); mus.gain.value = .55; mus.connect(master);
    if (!mudo) iniciaMusica();
  }
  function tono(f, t, d, tipo = 'sine', v = .2, f2 = null, dest = master) {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = tipo; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + d + .03);
  }
  function ruido(t, d, v = .25) {
    const n = Math.floor(ctx.sampleRate * d), b = ctx.createBuffer(1, n, ctx.sampleRate), x = b.getChannelData(0);
    for (let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = b; f.type = 'bandpass'; f.frequency.value = 900;
    g.gain.value = v; s.connect(f); f.connect(g); g.connect(master); s.start(t);
  }
  function sfx(n) {
    if (!ctx || mudo || ctx.state !== 'running') return; const t = ctx.currentTime;
    switch (n) {
      case 'clic': tono(660, t, .08, 'triangle', .18, 880); break;
      case 'acierto': [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tono(f, t + i * .07, .18, 'triangle', .2)); break;
      case 'error': tono(190, t, .32, 'sawtooth', .16, 90); tono(140, t + .02, .32, 'square', .08, 70); break;
      case 'tic': tono(1250, t, .04, 'sine', .12); break;
      case 'vida': tono(440, t, .14, 'triangle', .2, 330); tono(330, t + .13, .14, 'triangle', .2, 247); tono(220, t + .26, .3, 'triangle', .22, 147); break;
      case 'moneda': tono(1318.5, t, .09, 'square', .09); tono(1760, t + .07, .22, 'square', .09); break;
      case 'golpe': ruido(t, .18, .35); tono(120, t, .16, 'sine', .3, 50); break;
      case 'victoria': [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5].forEach((f, i) => tono(f, t + i * .13, .3, 'triangle', .22)); break;
      case 'derrota': [392, 349.23, 329.63, 261.63].forEach((f, i) => tono(f, t + i * .2, .38, 'triangle', .2)); break;
    }
  }
  function agenda() {
    if (!ctx || mudo) return;
    while (prox < ctx.currentTime + .25) {
      if (prox < ctx.currentTime) prox = ctx.currentTime + .05;
      const a = ACORDES[Math.floor(paso / 8) % 4], i = paso % 8;
      if (i === 0) a.forEach(f => tono(f, prox, NEG * 8, 'triangle', .045, null, mus));
      if (i % 4 === 0) tono(a[0] / 2, prox, NEG * 3, 'sine', .08, null, mus);
      tono(a[[0, 1, 2, 1, 2, 1, 0, 1][i]] * 2, prox, NEG * 1.6, 'sine', .04, null, mus);
      prox += NEG; paso++;
    }
  }
  function iniciaMusica() { if (timer || !ctx) return; prox = ctx.currentTime + .1; timer = setInterval(agenda, 60); }
  function paraMusica() { clearInterval(timer); timer = null; }
  function setMudo(m) {
    mudo = m; store.set(CFG.K_MUDO, m ? '1' : '0');
    if (ctx) { master.gain.setTargetAtTime(m ? 0 : .7, ctx.currentTime, .03); if (m) paraMusica(); else iniciaMusica(); }
    pintaMudo();
  }
  return { init, sfx, setMudo, esMudo: () => mudo, suspende: () => ctx && ctx.suspend(), reanuda: () => ctx && ctx.resume() };
})();
function pintaMudo() {
  const m = Snd.esMudo(); $('btnSonido').setAttribute('aria-pressed', m);
  $('btnSonido').setAttribute('aria-label', m ? 'Sonido desactivado. Toca para activar' : 'Sonido activado. Toca para silenciar');
}


/* ====================== COMÚN: pausa, sonido, voz ====================== */
function pausar(m) {
  if (S.pantalla !== 'juego' || S.fin) return;
  S.pausas.add(m); $('stage').classList.add('paused'); $('ovPausa').classList.add('on');
  vivas.forEach(a => { try { a.pause(); } catch (e) { /* ya terminó */ } }); setTimeout(() => $('btnContinuar').focus(), 30);
}
function reanudar() {
  S.pausas.clear(); $('ovPausa').classList.remove('on'); $('stage').classList.remove('paused');
  vivas.forEach(a => { try { a.play(); } catch (e) { /* ya terminó */ } }); Snd.reanuda();
}
function irA(p) { S.pantalla = p; $('stage').className = 'mode-' + p; }
function pintaMudo() {
  const m = Snd.esMudo(); $('btnSonido').setAttribute('aria-pressed', m);
  $('btnSonido').setAttribute('aria-label', m ? 'Sonido desactivado. Toca para activar' : 'Sonido activado. Toca para silenciar');
  if (m && 'speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch (e) { /* sin voz */ } }
}
function decir(t) {   // voz en español con la síntesis del navegador (si existe y no está en silencio)
  if (Snd.esMudo() || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'es-ES'; u.rate = .9; speechSynthesis.speak(u); } catch (e) { /* sin voz */ }
}
function mostrarFin(titulo, a, b, c, victoria) {
  $('tFin').textContent = titulo; $('fA').textContent = a; $('fB').textContent = b; $('fC').textContent = c;
  $('fin').classList.add('on'); Snd.sfx(victoria ? 'victoria' : 'derrota'); setTimeout(() => $('btnOtra').focus(), 50);
}
function iniciaComun(alTecla) {
  const primero = () => { Snd.init(); window.removeEventListener('pointerdown', primero, true); window.removeEventListener('keydown', primero, true); };
  window.addEventListener('pointerdown', primero, true); window.addEventListener('keydown', primero, true);
  $('btnSonido').addEventListener('click', () => { Snd.setMudo(!Snd.esMudo()); Snd.sfx('clic'); });
  $('btnContinuar').addEventListener('click', () => { Snd.sfx('clic'); reanudar(); });
  const bp = $('btnPausa'); if (bp) bp.addEventListener('click', () => { Snd.sfx('clic'); if (S.pantalla === 'juego') (S.pausas.size ? reanudar() : pausar('manual')); });
  window.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'm') { Snd.setMudo(!Snd.esMudo()); return; }
    if (S.pantalla === 'juego' && k === 'p') { if (S.pausas.size) reanudar(); else pausar('manual'); return; }
    if (alTecla) alTecla(e, k);
  });
  const sinFoco = () => { if (S.pantalla === 'juego' && !S.pausas.size && !S.fin) { pausar('foco'); Snd.suspende(); } };
  document.addEventListener('visibilitychange', () => { if (document.hidden) sinFoco(); else Snd.reanuda(); });
  window.addEventListener('blur', sinFoco);
}

/* ====================== 3. MOTOR ====================== */
/* Un número se guarda como entero en milésimas (v) y con la cantidad de cifras decimales que se muestran (c). */
const txt = (v, c) => { const e = Math.floor(v / 1000), d = String(v % 1000).padStart(3, '0').slice(0, c); return c ? `${e},${d}` : String(e); };
const Motor = {
  /* crearPregunta({n, usados, azar}) -> {a, b, ok:'<'|'='|'>', expl, voz}; a y b son textos con coma decimal */
  crearPregunta({ n = 0, usados = new Set(), azar = Math.random } = {}) {
    const nivel = CFG.TRAMOS.findIndex(t => n < t.hasta), L = nivel < 0 ? CFG.TRAMOS.length - 1 : nivel;
    const R = k => Math.floor(azar() * k);
    const tipos = [['dec', 'dec', 'mismaEntera'], ['mas1', 'mas1', 'ceros', 'cent', 'mismaCent'], ['mil', 'ceros3', 'mas2', 'mas2', 'mismaCent']][L];
    for (let i = 0; i < 600; i++) {
      const ent = R(3) === 0 ? (R(8) + 1) * 1000 : 0, t = elige(tipos, azar); let A, B, ca, cb;
      if (t === 'dec') { A = ent + R(10) * 100; B = (R(3) ? ent : (R(8) + 1) * 1000) + R(10) * 100; ca = cb = 1; }
      else if (t === 'mismaEntera') { A = ent + R(10) * 100; B = ent + R(10) * 100; ca = cb = 1; }
      else if (t === 'mas1') { const d = R(9) + 1; A = ent + d * 100; B = ent + (R(2) ? d - 1 : d + 1) * 100 + (R(9) + 1) * 10; ca = 1; cb = 2; }     // 0,5 contra 0,45
      else if (t === 'ceros') { const d = R(9) + 1; A = ent + d * 100; B = A; ca = 1; cb = 2; }                                                         // 0,5 y 0,50
      else if (t === 'cent') { A = ent + R(100) * 10; B = ent + R(100) * 10; ca = cb = 2; }
      else if (t === 'mismaCent') { const d = R(10) * 100; A = ent + d + R(10) * 10; B = ent + d + R(10) * 10; ca = cb = 2; }
      else if (t === 'mil') { A = ent + R(1000); B = ent + R(1000); ca = cb = 3; }
      else if (t === 'ceros3') { A = ent + (R(99) + 1) * 10; B = A; ca = 2; cb = 3; }                                                                  // 0,25 y 0,250
      else { const d = R(9) + 1; A = ent + d * 10; B = ent + d * 100; ca = 2; cb = 1; }                                                                  // 0,05 contra 0,5 (cuenta con 2 y 1 cifras)
      if (A === B && ca === cb) continue;
      if (R(2)) { [A, B] = [B, A]; [ca, cb] = [cb, ca]; }
      const sa = txt(A, ca), sb = txt(B, cb), clave = sa + '|' + sb;
      if (sa === sb || usados.has(clave) || usados.has(sb + '|' + sa)) continue;
      const ok = A < B ? '<' : A > B ? '>' : '=';
      if (ok === '=' && R(3)) continue;
      usados.add(clave); return Motor._fin(sa, sb, ok);
    }
    throw new Error('Sin preguntas nuevas');
  },
  _fin(a, b, ok) {
    const rel = ok === '<' ? 'menor que' : ok === '>' ? 'mayor que' : 'igual a';
    return { a, b, ok, expl: `${a} es ${rel} ${b}`, voz: `${a.replace(',', ' coma ')} es ${rel} ${b.replace(',', ' coma ')}` };
  }
};

/* ====================== 4. ARTE ====================== */
function cieloSVG() {
  let est = '', nube = '';
  [[200, 160, 1], [620, 90, 1.3], [1100, 190, .9], [1420, 110, 1.2]].forEach(([x, y, k], i) => nube += `<g class="nube" style="animation-delay:${-i * 3}s" transform="translate(${x} ${y}) scale(${k})"><ellipse rx="80" ry="26" fill="#fff" opacity=".9"/><ellipse cx="-34" cy="-14" rx="40" ry="24" fill="#fff" opacity=".9"/><ellipse cx="30" cy="-18" rx="46" ry="26" fill="#fff" opacity=".9"/></g>`);
  return `<defs><linearGradient id="cdl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A8FE0"/><stop offset="1" stop-color="#FFD9A0"/></linearGradient></defs>
  <rect width="1600" height="1000" fill="url(#cdl)"/>${nube}
  <path d="M0 820Q200 720 420 800T860 780T1300 810T1600 770V1000H0z" fill="#E08A4A"/><path d="M0 900Q300 820 640 890T1280 870T1600 900V1000H0z" fill="#C2622E"/>
  <path d="M1100 800l60-150 60 150z" fill="#B8501E"/><path d="M330 810l50-110 50 110z" fill="#B8501E"/>`;
}
function dirigibleSVG() {
  return `<svg viewBox="0 0 220 120" aria-hidden="true"><g stroke="#3A1A5A" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">
   <path d="M30 60l-20-24v48z" fill="#8A4BE0"/><path d="M40 40l-8-20 22 10zM40 80l-8 20 22-10z" fill="#8A4BE0"/>
   <ellipse cx="116" cy="54" rx="86" ry="38" fill="#FFC928"/><path d="M60 30q56-14 112 0" fill="none" stroke="#fff" stroke-width="5" opacity=".5"/>
   <path d="M62 54h110M84 24q-18 30 0 60M116 18q-12 36 0 72M150 24q18 30 0 60" fill="none" stroke="#C2870A" stroke-width="2.6"/>
   <rect x="86" y="92" width="64" height="20" rx="8" fill="#8A4BE0"/><circle cx="104" cy="102" r="5" fill="#CFEFFF"/><circle cx="132" cy="102" r="5" fill="#CFEFFF"/>
   <path d="M98 90v4M138 90v4" fill="none"/><circle cx="184" cy="64" r="8" fill="#8A4BE0"/><path d="M190 58l14-6" fill="none" stroke-width="5"/></g></svg>`;
}
function corazonSVG(on) { return `<svg viewBox="0 0 40 36" aria-hidden="true"><path d="M20 33C6 22 2 15 2 10a9 9 0 0 1 18-3 9 9 0 0 1 18 3c0 5-4 12-18 23z" fill="${on ? '#FF4A6A' : '#6a6a7a'}" stroke="#4A0A1A" stroke-width="3" stroke-linejoin="round"/></svg>`; }

/* ====================== 5. RENDER ====================== */
function pintaVidas() { $('vidas').innerHTML = Array.from({ length: CFG.VIDAS }, (_, i) => `<i class="${i < S.vidas ? '' : 'off'}">${corazonSVG(i < S.vidas)}</i>`).join(''); $('vidas').setAttribute('aria-label', 'Vidas: ' + S.vidas); }
function pintaProg() { $('prog').textContent = 'Pregunta ' + Math.min(S.n + 1, CFG.PREGUNTAS) + ' de ' + CFG.PREGUNTAS; pintaAvion(); }
function pintaAvion() { $('dir').style.setProperty('--p', S.n / CFG.PREGUNTAS); }
function pintaPregunta(q) {
  $('numA').textContent = q.a; $('numB').textContent = q.b; $('pregunta').textContent = '¿Cuál signo va en medio?';
  $('opts').querySelectorAll('button').forEach(b => { b.disabled = false; b.className = 'op'; });
  $('expl').textContent = '';
}
function mensaje(txt, tipo) { const m = $('msg'); m.className = tipo; m.textContent = txt; m.style.opacity = 1; }

/* ====================== 6. FLUJO ====================== */
async function ronda() {
  const q = Motor.crearPregunta({ n: S.n, usados: S.usados }); S.q = q; pintaProg(); pintaPregunta(q); setTimeout(() => decir(`${q.a.replace(',', ' coma ')} y ${q.b.replace(',', ' coma ')}`), 200);
  const r = await new Promise(res => { S.esperando = true; S.resolver = res; });
  S.esperando = false; const bs = [...$('opts').querySelectorAll('button')]; bs.forEach(b => { b.disabled = true; });
  const bien = r === q.ok, bOk = bs.find(b => b.dataset.s === q.ok);
  bOk.classList.add('ok'); if (!bien) bs.find(b => b.dataset.s === r).classList.add('mal');
  $('expl').textContent = q.expl;
  if (bien) { S.aciertos++; Snd.sfx('acierto'); mensaje('¡Correcto!', 'ok'); }
  else { S.vidas--; Snd.sfx('error'); mensaje('Casi', 'bad'); pintaVidas(); $('stage').classList.add('tiembla'); setTimeout(() => $('stage').classList.remove('tiembla'), 400); }
  S.n++; pintaAvion();
  await esperar(bien ? CFG.PAUSA_ACIERTO : CFG.PAUSA_ERROR); $('msg').style.opacity = 0;
  if (S.vidas <= 0) { S.fin = true; return termina(false); }
  if (S.n >= CFG.PREGUNTAS) { S.fin = true; return termina(true); }
}
function termina(gano) {
  S.fin = true; const mej = parseInt(store.get(CFG.K_REC) || '0', 10) || 0;
  if (S.aciertos > mej) store.set(CFG.K_REC, String(S.aciertos));
  mostrarFin(gano ? '¡Aterrizaste!' : 'Se acabó el combustible', 'Aciertos: ' + S.aciertos, 'Récord: ' + Math.max(mej, S.aciertos) + (S.aciertos > mej ? ' ¡Nuevo!' : ''), S.n + ' de ' + CFG.PREGUNTAS, gano);
}
async function nuevaPartida() {
  S.corrida++; vivas.forEach(a => a.cancel()); vivas.clear(); S.pausas.clear(); S.fin = false; S.n = 0; S.vidas = CFG.VIDAS; S.aciertos = 0; S.usados = new Set(); S.esperando = false; S.resolver = null;
  $('fin').classList.remove('on'); $('ovPausa').classList.remove('on'); $('stage').classList.remove('paused'); $('msg').style.opacity = 0;
  irA('juego'); pintaVidas(); pintaProg();
  try { while (!S.fin) await ronda(); } catch (e) { if (e !== CANCEL) throw e; }
}
function aTitulo() { S.corrida++; S.fin = false; S.esperando = false; irA('titulo'); $('fin').classList.remove('on'); setTimeout(() => $('btnEmpezar').focus(), 30); }
const SIG = { '1': '<', '2': '=', '3': '>' };
function elegir(s) { if (S.pantalla === 'juego' && S.esperando && !S.pausas.size && S.resolver) { const f = S.resolver; S.resolver = null; f(s); } }

/* ====================== 7. EVENTOS ====================== */
(function iniciar() {
  $('dir').innerHTML = dirigibleSVG(); $('dirT').innerHTML = dirigibleSVG(); $('scene').innerHTML = cieloSVG(); pintaMudo();
  $('btnEmpezar').addEventListener('click', () => { Snd.sfx('clic'); nuevaPartida(); });
  $('btnOtra').addEventListener('click', () => { Snd.sfx('clic'); aTitulo(); });
  $('opts').addEventListener('click', e => { const b = e.target.closest('button'); if (b && !b.disabled) elegir(b.dataset.s); });
  iniciaComun((e, k) => {
    if (S.pantalla === 'titulo' && k === 'enter') { e.preventDefault(); Snd.sfx('clic'); nuevaPartida(); }
    else if (S.pantalla === 'juego' && SIG[k]) { elegir(SIG[k]); e.preventDefault(); }
  });
  window.__dir = { S, CFG, Motor };   // gancho de pruebas
})();

</script>
