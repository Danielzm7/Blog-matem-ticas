<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Batalla de números: derrota enemigos resolviendo operaciones. Un error termina la partida. Para niños de 7 a 10 años.">
<title>Batalla de números</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#12082e;color:var(--ink);
  font-family:'Fredoka','Nunito','Baloo 2','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;font-weight:700}
button{font:inherit;color:inherit}
#wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:6px}
.volver{align-self:center;color:#cfe3fb;text-decoration:none;font-size:15px;min-height:28px;display:inline-flex;align-items:center;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.08)}
.volver:hover{background:rgba(255,255,255,.18);color:#fff}
#stage{position:relative;width:var(--W);aspect-ratio:16/10;container-type:inline-size;overflow:hidden;
  border-radius:calc(var(--W)*.022);background:#2b1456;isolation:isolate;
  box-shadow:0 calc(var(--W)*.015) calc(var(--W)*.05) rgba(0,0,0,.55);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#world{position:absolute;inset:0}
#scene{position:absolute;left:0;top:0;width:100%;height:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:max(3px,.4cqw) solid #fff;outline-offset:max(2px,.3cqw)}

/* ---------- Marcos hexagonales con borde doble ---------- */
.hex{--c1:#2a7de1;--c2:#4fc3ff;position:relative;display:block;width:var(--w,7cqw);aspect-ratio:1/.866;
  filter:drop-shadow(0 0 .55cqw rgba(79,195,255,.65));border:0;background:none;padding:0;margin:0}
.hex>i,.hex>i>i,.hex>i>i>i{position:absolute;display:block;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.hex>i{inset:0;background:linear-gradient(160deg,var(--c2),var(--c1))}
.hex>i>i{inset:7%;background:#fff}
.hex>i>i>i{inset:7%;background:linear-gradient(180deg,#f6faff,#c9defa);display:grid;place-items:center;overflow:hidden}
.hex svg{width:78%;height:78%;display:block}
button.hex{cursor:pointer;transition:transform .15s,filter .15s}
button.hex:hover{transform:translateY(-.3cqw) scale(1.05);filter:drop-shadow(0 0 .9cqw rgba(255,255,255,.9))}
button.hex:active{transform:scale(.96)}
.hexw{--c1:#2a7de1;--c2:#4fc3ff;position:relative;display:block;height:6.4cqw;min-width:14.5cqw;
  filter:drop-shadow(0 0 .55cqw rgba(79,195,255,.65))}
.hexw>i,.hexw>i>i,.hexw>i>i>i{position:absolute;display:block;clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%)}
.hexw>i{inset:0;background:linear-gradient(160deg,var(--c2),var(--c1))}
.hexw>i>i{inset:7%;background:#fff}
.hexw>i>i>i{inset:7%;background:linear-gradient(180deg,#f6faff,#c9defa);display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.05;padding:0 .6cqw}
.hexw small{font-size:max(10px,1.3cqw);color:#4a5a8c;letter-spacing:.02em;font-weight:700}
.hexw b{font-size:max(13px,1.95cqw);color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}


/* ---------- Modales ---------- */
.overlay{position:absolute;inset:0;z-index:20;display:none;place-items:center;background:rgba(14,6,40,.62)}
.overlay.on{display:grid}
.modal{position:relative;width:62cqw;border-radius:2.4cqw;padding:5cqw 3cqw 2.6cqw;text-align:center;
  background:linear-gradient(180deg,#f8fcff,#c9e0fb);border:max(3px,.45cqw) solid #fff;box-shadow:0 0 0 max(3px,.5cqw) #2a7de1,0 1cqw 3cqw rgba(0,0,0,.55)}
.modal .pill{position:absolute;left:50%;top:0;transform:translate(-50%,-50%)}
.modal p{margin:.6cqw 0;font-size:max(14px,2.3cqw);line-height:1.3;color:var(--ink)}
.ej{margin:1.4cqw auto 1.8cqw;padding:1.2cqw 2cqw;border-radius:1.6cqw;background:#fff;border:.35cqw dashed #5b2bb5;display:inline-block}
.ej b{color:#5b2bb5}
#dim{position:absolute;inset:0;z-index:12;background:rgba(10,4,30,.74);opacity:0;pointer-events:none;transition:opacity .6s}
#dim.on{opacity:1}
#fin{z-index:15;background:transparent}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqw;margin:1.4cqw 0 2cqw}
.mini{display:flex;flex-direction:column;align-items:center;gap:.8cqw}
.mini .hex{--w:72%}
.mini .hex svg{width:80%;height:80%}
.mini span{font-size:max(12px,1.9cqw);line-height:1.15;color:var(--ink)}
.mini b{display:block;font-size:max(16px,3cqw);color:var(--p2)}
#cuenta{position:absolute;inset:0;z-index:11;display:none;place-items:center;pointer-events:none}
#cuenta.on{display:grid}
#cuenta span{font-size:24cqw;color:#fff;text-shadow:0 1cqw 0 #5b2bb5,0 0 4cqw rgba(79,195,255,.9);animation:cnt .9s ease-out both}
@keyframes cnt{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(.9);opacity:.9}}
.rays{animation:spin 12s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}


.pill{background:linear-gradient(180deg,#8a55ea,#4a1fa0);color:#fff;border-radius:99px;padding:.6cqw 3.2cqw;font-size:max(15px,2.5cqw);
  box-shadow:0 .4cqw 0 #2b1456,inset 0 .2cqw 0 rgba(255,255,255,.35);text-shadow:0 .2cqw 0 rgba(0,0,0,.35);display:inline-block;white-space:nowrap}
.btn{border:0;border-radius:99px;cursor:pointer;min-height:48px;padding:1cqw 6cqw;color:#fff;font-size:max(17px,2.8cqw);letter-spacing:.06em;
  background:linear-gradient(90deg,#2a7de1,#7a3be0);box-shadow:0 .5cqw 0 #1b2f84,0 1cqw 2cqw rgba(0,0,0,.35),inset 0 .2cqw 0 rgba(255,255,255,.35);
  text-shadow:0 .2cqw 0 rgba(0,0,0,.3);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.12);transform:translateY(-.3cqw)}
.btn:active{transform:translateY(.3cqw)}


#stage{background:#0b1a3a}
:root{--W:min(100vw - 16px,(100dvh - 52px)*1.6)}
#scene{position:absolute;left:0;top:0;width:100%;height:100%}
.volver{align-self:center;color:#cfe3fb;text-decoration:none;font-size:15px;min-height:28px;display:inline-flex;align-items:center;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.08)}
.volver:hover{background:rgba(255,255,255,.18);color:#fff}
#wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:6px}
:focus-visible{outline:max(3px,.4cqw) solid #fff;outline-offset:max(2px,.3cqw)}
.tw{animation:tw 3.2s ease-in-out infinite}@keyframes tw{50%{opacity:.25}}
#hudR{position:absolute;right:2cqw;top:2cqw;display:flex;align-items:center;gap:1.4cqw;z-index:8}
#hudR .hex{--w:max(56px,7cqw)}#hudR .hex svg{width:62%;height:62%}
#mudoX{opacity:1}#btnSonido[aria-pressed=false] #mudoX{opacity:0}
.paused *{animation-play-state:paused!important}
#msg{position:absolute;left:0;right:0;top:34%;text-align:center;z-index:9;font-size:max(26px,6cqw);color:#fff;text-shadow:0 .5cqw 0 rgba(0,0,0,.45),0 0 2cqw rgba(0,0,0,.5);pointer-events:none;opacity:0}
#msg.ok{color:#9dff6b}#msg.bad{color:#ff9a9a}
.cards{display:grid;gap:1cqw;margin:1.4cqw 0 2.4cqw}
.mini{display:flex;align-items:center;gap:1.4cqw;background:#fff;border-radius:99px;padding:.5cqw 2cqw .5cqw .6cqw;color:#1d1a4d;font-size:max(14px,2.3cqw);box-shadow:0 .3cqw 0 rgba(0,0,0,.12)}
.mini .hex{--w:max(46px,6.2cqw);flex:none}.mini span:last-child{flex:1;text-align:left;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.mode-titulo :is(#menu,#hudL5,#cartel,#heroe,#enemigo,#opts,#btnPausa){display:none}
.mode-menu :is(#titulo,#hudL5,#cartel,#heroe,#enemigo,#opts,#btnPausa){display:none}
.mode-juego :is(#titulo,#menu){display:none}
.hex,.hexw{--c1:#8A4BE0;--c2:#FFC928;filter:drop-shadow(0 0 .55cqw rgba(255,201,40,.7))}
.btn{background:linear-gradient(90deg,#2FA65A,#27C6D9)}
#titulo,#menu{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;text-align:center}
#titulo{padding-top:4cqw}
#titulo h1{margin:0;font-size:9cqw;line-height:.95;color:#7CFF9B;letter-spacing:.02em;text-shadow:0 .6cqw 0 #1E7A44,0 1.2cqw 0 #0F3A2A,0 2cqw 2cqw rgba(0,0,0,.4)}
#titulo h1 small{display:block;font-size:5.4cqw;color:#7BD8FF;text-shadow:0 .5cqw 0 #1A5A8A,0 1cqw 0 #0F2A4A;letter-spacing:.04em}
#elenco{display:flex;align-items:flex-end;justify-content:center;gap:12cqw;margin:1.2cqw 0 1.6cqw}
#heroeT svg{width:14cqw;display:block;filter:drop-shadow(0 .6cqw .6cqw rgba(0,0,0,.4))}#enemT svg{width:13cqw;display:block;filter:drop-shadow(0 .6cqw .6cqw rgba(0,0,0,.4))}
#menu{padding-top:5cqw}
#menu .pill{font-size:max(15px,3cqw)}
#menuOps{display:flex;gap:2cqw;margin-top:4cqw;justify-content:center}
.opbtn{position:relative;width:15cqw;min-width:72px;aspect-ratio:1;border:max(3px,.5cqw) solid #FFC928;border-radius:2cqw;background:linear-gradient(180deg,#8A4BE0,#5A2AB0);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4cqw;box-shadow:0 .8cqw 0 #34127A;padding:0}
.opbtn .sim{font-size:max(28px,7cqw);line-height:1}.opbtn .sim.mix{font-size:max(16px,3.6cqw);letter-spacing:.05em}
.opbtn .nom{font-size:max(11px,1.7cqw);position:relative;max-width:96%;white-space:nowrap}
.opbtn .k{position:absolute;right:.6cqw;top:.6cqw;font-size:max(11px,1.7cqw);opacity:.7}
.opbtn .nom .k{display:none}.opbtn:hover,.opbtn:focus-visible{transform:translateY(-.5cqw)}.opbtn:active{transform:translateY(.4cqw)}
#heroeM{position:absolute;left:6cqw;bottom:9cqw;width:13cqw}#heroeM svg{width:100%;display:block}
#hudL5{position:absolute;left:2cqw;top:2cqw;z-index:6;color:#fff;font-size:max(13px,2cqw);background:#34127Acc;border:max(2px,.35cqw) solid #FFC928;border-radius:1.2cqw;padding:.4cqw 1.6cqw;display:flex;flex-direction:column;align-items:center;line-height:1.1}
#hudL5 b{font-size:max(22px,4.4cqw)}
#cartel{position:absolute;left:50%;top:3cqw;transform:translateX(-50%);z-index:6;min-width:34cqw;text-align:center;font-size:max(22px,6cqw);color:#fff;background:linear-gradient(180deg,#2FA65A,#1E7A44);border:max(3px,.5cqw) solid #FFC928;border-radius:2cqw;padding:.6cqw 3cqw;box-shadow:0 .8cqw 0 #0F3A2A;white-space:nowrap}
#heroe{position:absolute;left:12cqw;top:22cqw;width:15cqw;z-index:4}#heroe svg{width:100%;display:block;filter:drop-shadow(0 .8cqw .6cqw rgba(0,0,0,.4))}
#enemigo{position:absolute;right:14cqw;top:22cqw;width:16cqw;z-index:4}#enemigo svg{width:100%;display:block;filter:drop-shadow(0 .8cqw .6cqw rgba(0,0,0,.4))}
#opts{position:absolute;left:0;right:0;top:47cqw;z-index:6;display:flex;justify-content:center;gap:3cqw}
.op{position:relative;width:12cqw;min-width:60px;aspect-ratio:1;border:max(3px,.5cqw) solid #FFC928;border-radius:2cqw;background:linear-gradient(180deg,#2FA65A,#1E7A44);color:#fff;font-size:max(22px,4.8cqw);cursor:pointer;box-shadow:0 .8cqw 0 #0F3A2A;padding:0}
.op .k{position:absolute;right:.8cqw;top:.4cqw;font-size:max(11px,1.6cqw);opacity:.7}
.op:hover:not(:disabled){transform:translateY(-.4cqw)}.op:active:not(:disabled){transform:translateY(.4cqw)}
.op.ok{background:linear-gradient(180deg,#5CE08A,#1E8A44)}.op.mal{background:linear-gradient(180deg,#FF7A6A,#C2330A)}
#stage.tiembla{animation:trem .4s}@keyframes trem{25%{transform:translateX(-1cqw)}75%{transform:translateX(1cqw)}}
@media (max-width:700px) and (orientation:portrait){
  :root{--W:min(100vw - 16px,(100dvh - 52px)*.6)}
  #stage{aspect-ratio:3/5}
  #titulo{padding-top:12cqw}#titulo h1{font-size:15cqw}#titulo h1 small{font-size:9cqw}#elenco{gap:14cqw;margin:6cqw 0 8cqw}#heroeT svg{width:30cqw}#enemT svg{width:28cqw}
  #menu{padding-top:16cqw}#menu .pill{font-size:max(14px,4.4cqw);white-space:normal;max-width:90%}#menuOps{flex-wrap:wrap;width:92%;gap:4cqw;margin-top:8cqw}.opbtn{width:28cqw}
  #heroeM{left:50%;transform:translateX(-50%);bottom:12cqw;width:30cqw}
  #cartel{top:20cqw;font-size:max(22px,10cqw);min-width:70cqw}#hudL5{top:2cqw}
  #heroe{left:6cqw;top:42cqw;width:30cqw}#enemigo{right:6cqw;top:42cqw;width:32cqw}
  #opts{top:90cqw;flex-wrap:wrap;width:68cqw;left:16cqw;right:auto;gap:4cqw}.op{width:32cqw;font-size:max(26px,10cqw)}
}

</style>

<div id="wrap">

<div id="stage" class="mode-titulo">
  <div id="world">
    <svg id="scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    
    <section id="titulo" aria-label="Título"><h1>BATALLA<small>de números</small></h1><div id="elenco" aria-hidden="true"><div id="heroeT"></div><div id="enemT"></div></div><button class="btn" id="btnEmpezar" type="button">JUGAR</button></section>
    <section id="menu" aria-label="Escoge una operación"><span class="pill">ESCOGE UNA OPERACIÓN</span><div id="menuOps"></div><div id="heroeM" aria-hidden="true"></div></section>
    <div id="hudL5" aria-live="polite"><span>Enemigos</span><b id="puntos">0</b></div>

    <div id="enemigo" aria-hidden="true"></div>

      <button class="btn" id="btnOtra" type="button">Jugar de nuevo</button>

</div>

<script>
'use strict';
const CANCEL = { cancelado: true };
const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } }
};
const mezclar = (a, azar = Math.random) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(azar() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ent = (azar, lo, hi) => lo + Math.floor(azar() * (hi - lo + 1));
const elige = (a, azar = Math.random) => a[Math.floor(azar() * a.length)];
/* ============================================================
   BATALLA DE NÚMEROS: muerte súbita (un error termina la partida)
   Estructura: 1 config · 2 estado · 3 motor · 4 arte · 5 render · 6 flujo · 7 eventos
   ============================================================ */
/* ====================== 1. CONFIG ====================== */
const CFG = {

const Motor = {
  /* crearPregunta({op, puntos, usados, azar}) -> {a, b, sim, res, texto, opciones[4], ok(índice)} */
  crearPregunta({ op = 'suma', puntos = 0, usados = new Set(), azar = Math.random } = {}) {
    const R = (lo, hi) => lo + Math.floor(azar() * (hi - lo + 1));
    const k = CFG.PROGRESIVO ? Math.min(1, .5 + puntos / 40) : 1;
    for (let i = 0; i < 300; i++) {
      const o = op === 'mixta' ? elige(['suma', 'resta', 'mult', 'div'], azar) : op;
      let a, b, sim, res, otros;
      if (o === 'suma') { const m = Math.round(CFG.RANGOS.suma.max * k); a = R(2, m - 2); b = R(2, m - a); sim = '+'; res = a + b; otros = [a * b, Math.abs(a - b)]; }
      else if (o === 'resta') { const m = Math.round(CFG.RANGOS.resta.max * k); a = R(10, m); b = R(1, a - 1); sim = '−'; res = a - b; otros = [a + b, a * b]; }
      else if (o === 'mult') { const m = Math.max(5, Math.round(CFG.RANGOS.mult.max * k)); a = R(2, m); b = R(2, m); sim = '×'; res = a * b; otros = [a + b, a * (b + 1), (a + 1) * b]; }
      else { const m = Math.max(5, Math.round(CFG.RANGOS.div.max * k)); b = R(2, m); res = R(2, m); a = b * res; sim = '÷'; otros = [a - b, b + res, a / b + 1 + b]; }
      const clave = o + a + sim + b; if (usados.has(clave)) continue; usados.add(clave);
      const cand = new Set(); [res + 1, res - 1, res + 10, res - 10, res + 2, res - 2, ...otros, 2, Math.max(1, res - 3)].forEach(v => { if (Number.isInteger(v) && v >= 0 && v !== res) cand.add(v); });
      const dis = mezclar([...cand], azar).slice(0, CFG.OPCIONES - 1);
      const opciones = mezclar([res, ...dis], azar);
      return { a, b, sim, res, texto: `${a} ${sim} ${b} =`, opciones, ok: opciones.indexOf(res) };
    }
    throw new Error('Sin preguntas nuevas');
  }
};

}
function aMenu() { S.corrida++; S.fin = false; S.esperando = false; vivas.forEach(a => a.cancel()); vivas.clear(); irA('menu'); $('fin').classList.remove('on'); setTimeout(() => { const b = document.querySelector('.opbtn'); if (b) b.focus(); }, 30); }
function elegir(i) { if (S.pantalla === 'juego' && S.esperando && !S.pausas.size && S.resolver) { const f = S.resolver; S.resolver = null; f(i); } }

/* ====================== 7. EVENTOS ====================== */
(function iniciar() {
  $('scene').innerHTML = callesSVG(); $('heroe').innerHTML = heroeSVG(); $('heroeT').innerHTML = heroeSVG(); $('heroeM').innerHTML = heroeSVG(); $('enemT').innerHTML = ENEMIGOS[2]; pintaMudo();
  $('menuOps').innerHTML = CFG.OPS.map((o, i) => `<button class="opbtn" type="button" data-i="${i}" aria-label="${o.nombre}"><span class="sim${o.sim.length > 1 ? ' mix' : ''}">${o.sim}</span><span class="nom">${o.nombre}<span class="k" aria-hidden="true">${i + 1}</span></span></button>`).join('');
  $('btnEmpezar').addEventListener('click', () => { Snd.sfx('clic'); aMenu(); });
  $('menuOps').addEventListener('click', e => { const b = e.target.closest('.opbtn'); if (b) { Snd.sfx('clic'); nuevaPartida(+b.dataset.i); } });
  $('btnOtra').addEventListener('click', () => { Snd.sfx('clic'); aMenu(); });
  $('opts').addEventListener('click', e => { const b = e.target.closest('.op'); if (b && !b.disabled) elegir(+b.dataset.i); });
  iniciaComun((e, k) => {
    if (S.pantalla === 'titulo' && k === 'enter') { e.preventDefault(); Snd.sfx('clic'); aMenu(); }
    else if (S.pantalla === 'menu' && /^[1-5]$/.test(k)) { Snd.sfx('clic'); nuevaPartida(+k - 1); }
    else if (S.pantalla === 'juego' && /^[1-4]$/.test(k)) { elegir(+k - 1); e.preventDefault(); }
  });
  window.__bat = { S, CFG, Motor };   // gancho de pruebas
})();

</script>
