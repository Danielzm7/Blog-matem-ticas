<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Sapo saltarín: completa la hilera de nenúfares contando de 2 en 2, de 5 en 5 o de 10 en 10. Para niños de 5 a 8 años.">
<title>Sapo saltarín: cuenta de 2 en 2, 5 y 10</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#12082e;color:var(--ink);
  font-family:'Fredoka','Nunito','Baloo 2','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;font-weight:700}
button{font:inherit;color:inherit}
#wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:6px}
.volver{align-self:center;color:#cfe3fb;text-decoration:none;font-size:15px;min-height:28px;display:inline-flex;align-items:center;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.08)}
.volver:hover{background:rgba(255,255,255,.18);color:#fff}
#stage{position:relative;width:var(--W);aspect-ratio:16/10;container-type:inline-size;overflow:hidden;
  border-radius:calc(var(--W)*.022);background:#2b1456;isolation:isolate;
  box-shadow:0 calc(var(--W)*.015) calc(var(--W)*.05) rgba(0,0,0,.55);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#world{position:absolute;inset:0}
#scene{position:absolute;left:0;top:0;width:100%;height:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:max(3px,.4cqw) solid #fff;outline-offset:max(2px,.3cqw)}

/* ---------- Marcos hexagonales con borde doble ---------- */
.hex{--c1:#2a7de1;--c2:#4fc3ff;position:relative;display:block;width:var(--w,7cqw);aspect-ratio:1/.866;
  filter:drop-shadow(0 0 .55cqw rgba(79,195,255,.65));border:0;background:none;padding:0;margin:0}
.hex>i,.hex>i>i,.hex>i>i>i{position:absolute;display:block;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.hex>i{inset:0;background:linear-gradient(160deg,var(--c2),var(--c1))}
.hex>i>i{inset:7%;background:#fff}
.hex>i>i>i{inset:7%;background:linear-gradient(180deg,#f6faff,#c9defa);display:grid;place-items:center;overflow:hidden}
.hex svg{width:78%;height:78%;display:block}
button.hex{cursor:pointer;transition:transform .15s,filter .15s}
button.hex:hover{transform:translateY(-.3cqw) scale(1.05);filter:drop-shadow(0 0 .9cqw rgba(255,255,255,.9))}
button.hex:active{transform:scale(.96)}
.hexw{--c1:#2a7de1;--c2:#4fc3ff;position:relative;display:block;height:6.4cqw;min-width:14.5cqw;
  filter:drop-shadow(0 0 .55cqw rgba(79,195,255,.65))}
.hexw>i,.hexw>i>i,.hexw>i>i>i{position:absolute;display:block;clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%)}
.hexw>i{inset:0;background:linear-gradient(160deg,var(--c2),var(--c1))}
.hexw>i>i{inset:7%;background:#fff}
.hexw>i>i>i{inset:7%;background:linear-gradient(180deg,#f6faff,#c9defa);display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.05;padding:0 .6cqw}
.hexw small{font-size:max(10px,1.3cqw);color:#4a5a8c;letter-spacing:.02em;font-weight:700}
.hexw b{font-size:max(13px,1.95cqw);color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}


/* ---------- Modales ---------- */
.overlay{position:absolute;inset:0;z-index:20;display:none;place-items:center;background:rgba(14,6,40,.62)}
.overlay.on{display:grid}
.modal{position:relative;width:62cqw;border-radius:2.4cqw;padding:5cqw 3cqw 2.6cqw;text-align:center;
  background:linear-gradient(180deg,#f8fcff,#c9e0fb);border:max(3px,.45cqw) solid #fff;box-shadow:0 0 0 max(3px,.5cqw) #2a7de1,0 1cqw 3cqw rgba(0,0,0,.55)}
.modal .pill{position:absolute;left:50%;top:0;transform:translate(-50%,-50%)}
.modal p{margin:.6cqw 0;font-size:max(14px,2.3cqw);line-height:1.3;color:var(--ink)}
.ej{margin:1.4cqw auto 1.8cqw;padding:1.2cqw 2cqw;border-radius:1.6cqw;background:#fff;border:.35cqw dashed #5b2bb5;display:inline-block}
.ej b{color:#5b2bb5}
#dim{position:absolute;inset:0;z-index:12;background:rgba(10,4,30,.74);opacity:0;pointer-events:none;transition:opacity .6s}
#dim.on{opacity:1}
#fin{z-index:15;background:transparent}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqw;margin:1.4cqw 0 2cqw}
.mini{display:flex;flex-direction:column;align-items:center;gap:.8cqw}
.mini .hex{--w:72%}
.mini .hex svg{width:80%;height:80%}
.mini span{font-size:max(12px,1.9cqw);line-height:1.15;color:var(--ink)}
.mini b{display:block;font-size:max(16px,3cqw);color:var(--p2)}
#cuenta{position:absolute;inset:0;z-index:11;display:none;place-items:center;pointer-events:none}
#cuenta.on{display:grid}
#cuenta span{font-size:24cqw;color:#fff;text-shadow:0 1cqw 0 #5b2bb5,0 0 4cqw rgba(79,195,255,.9);animation:cnt .9s ease-out both}
@keyframes cnt{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(.9);opacity:.9}}
.rays{animation:spin 12s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}


.pill{background:linear-gradient(180deg,#8a55ea,#4a1fa0);color:#fff;border-radius:99px;padding:.6cqw 3.2cqw;font-size:max(15px,2.5cqw);
  box-shadow:0 .4cqw 0 #2b1456,inset 0 .2cqw 0 rgba(255,255,255,.35);text-shadow:0 .2cqw 0 rgba(0,0,0,.35);display:inline-block;white-space:nowrap}
.btn{border:0;border-radius:99px;cursor:pointer;min-height:48px;padding:1cqw 6cqw;color:#fff;font-size:max(17px,2.8cqw);letter-spacing:.06em;
  background:linear-gradient(90deg,#2a7de1,#7a3be0);box-shadow:0 .5cqw 0 #1b2f84,0 1cqw 2cqw rgba(0,0,0,.35),inset 0 .2cqw 0 rgba(255,255,255,.35);
  text-shadow:0 .2cqw 0 rgba(0,0,0,.3);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.12);transform:translateY(-.3cqw)}
.btn:active{transform:translateY(.3cqw)}


#stage{background:#0b1a3a}
:root{--W:min(100vw - 16px,(100dvh - 52px)*1.6)}
#scene{position:absolute;left:0;top:0;width:100%;height:100%}
.volver{align-self:center;color:#cfe3fb;text-decoration:none;font-size:15px;min-height:28px;display:inline-flex;align-items:center;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.08)}
.volver:hover{background:rgba(255,255,255,.18);color:#fff}
#wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:6px}
:focus-visible{outline:max(3px,.4cqw) solid #fff;outline-offset:max(2px,.3cqw)}
.tw{animation:tw 3.2s ease-in-out infinite}@keyframes tw{50%{opacity:.25}}
#hudR{position:absolute;right:2cqw;top:2cqw;display:flex;align-items:center;gap:1.4cqw;z-index:8}
#hudR .hex{--w:max(56px,7cqw)}#hudR .hex svg{width:62%;height:62%}
#mudoX{opacity:1}#btnSonido[aria-pressed=false] #mudoX{opacity:0}
.paused *{animation-play-state:paused!important}
#msg{position:absolute;left:0;right:0;top:34%;text-align:center;z-index:9;font-size:max(26px,6cqw);color:#fff;text-shadow:0 .5cqw 0 rgba(0,0,0,.45),0 0 2cqw rgba(0,0,0,.5);pointer-events:none;opacity:0}
#msg.ok{color:#9dff6b}#msg.bad{color:#ff9a9a}
.cards{display:grid;gap:1cqw;margin:1.4cqw 0 2.4cqw}
.mini{display:flex;align-items:center;gap:1.4cqw;background:#fff;border-radius:99px;padding:.5cqw 2cqw .5cqw .6cqw;color:#1d1a4d;font-size:max(14px,2.3cqw);box-shadow:0 .3cqw 0 rgba(0,0,0,.12)}
.mini .hex{--w:max(46px,6.2cqw);flex:none}.mini span:last-child{flex:1;text-align:left;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.mode-titulo :is(#cab,#pregunta,#opts,#pozo,#btnContar,#btnInicio,#btnPausa){display:none}
.mode-juego #titulo{display:none}
.hex,.hexw{--c1:#2A6AC8;--c2:#7BE0A0;filter:drop-shadow(0 0 .55cqw rgba(255,255,255,.5))}
.btn{background:linear-gradient(90deg,#2FA65A,#27C6D9)}
.ola{animation:ola 4s linear infinite}@keyframes ola{to{transform:translateX(-200px)}}
@media (prefers-reduced-motion:reduce){.ola{animation:none}}
#titulo{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;padding-top:4cqw;text-align:center}
#titulo h1{margin:0;font-size:8cqw;line-height:1;color:#fff;letter-spacing:.02em;text-shadow:0 .6cqw 0 #2FA65A,0 1.2cqw 0 #0F4A26,0 2cqw 2cqw rgba(0,0,0,.3)}
#titulo .sub{margin:.8cqw 0 1cqw;font-size:max(14px,2.8cqw);color:#0F3A5A;text-shadow:0 .2cqw 0 #fff}
#sapoT{width:14cqw}#sapoT svg,#sapo svg{width:100%;display:block;filter:drop-shadow(0 .6cqw .6cqw rgba(0,0,0,.35))}
#niv{display:flex;gap:2cqw;margin-top:2.6cqw}#niv .btn{font-size:max(14px,2.6cqw);padding:1.2cqw 3cqw;min-height:48px;white-space:nowrap}
#cab{position:absolute;left:2cqw;top:2cqw;z-index:6;display:flex;flex-direction:column;gap:.5cqw;align-items:flex-start}
#cab span{background:#0F3A5Add;color:#fff;font-size:max(13px,2.2cqw);padding:.3cqw 1.5cqw;border-radius:1.2cqw}
#pregunta{position:absolute;left:0;right:0;top:6cqw;text-align:center;z-index:6;font-size:max(18px,4cqw);color:#fff;text-shadow:0 .3cqw 0 #0F3A5A}
#opts{position:absolute;left:0;right:0;top:16cqw;z-index:6;display:flex;justify-content:center;gap:4cqw}
.op{position:relative;min-width:60px;width:15cqw;height:11cqw;min-height:56px;border-radius:50%/60%;border:max(3px,.5cqw) solid #14407a;background:radial-gradient(circle at 30% 30%,#fff,#9AD8FF);color:#14407a;font-size:max(22px,5cqw);cursor:pointer;padding:0}
.op .k{position:absolute;right:1.2cqw;bottom:.2cqw;font-size:max(11px,1.6cqw);opacity:.7}
.op.ok{background:radial-gradient(circle at 30% 30%,#E8FFE8,#5CE08A);pointer-events:none}.op.mal{animation:no .35s;background:radial-gradient(circle at 30% 30%,#fff,#FFB0A0)}
@keyframes no{25%{translate:-1cqw 0}75%{translate:1cqw 0}}
#pozo{position:absolute;left:3cqw;right:3cqw;top:33cqw;height:26cqw;z-index:5}
#hilera{position:absolute;inset:0}
.nen{position:absolute;top:8cqw;transform:translateX(-50%);width:11cqw;min-width:48px;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.nen .pad svg{width:100%;display:block}
.nen .num{margin-top:-.4cqw;font-size:max(14px,2.8cqw);background:#fff;border:max(2px,.3cqw) solid #0F3A5A;border-radius:1cqw;padding:0 1cqw;min-width:5cqw;color:#0F3A5A}
.nen.falta .num{background:#FFD35A;font-size:max(16px,3.4cqw)}.nen.lit .num{background:#CFF5D8;border-color:#1E8A44}
#sapo{position:absolute;left:5%;top:-1cqw;width:9cqw;transform:translate(-50%,0);z-index:8;pointer-events:none}
#btnContar{position:absolute;left:2cqw;bottom:2cqw;z-index:6;font-size:max(14px,2.2cqw);padding:1cqw 3cqw;min-height:48px}
#btnInicio{position:absolute;right:2cqw;bottom:2cqw;z-index:6;font-size:max(14px,2.2cqw);padding:1cqw 3cqw;min-height:48px}
@media (max-width:700px) and (orientation:portrait){
  :root{--W:min(100vw - 16px,(100dvh - 52px)*.6)}
  #stage{aspect-ratio:3/5}
  #titulo{padding-top:12cqw}#titulo h1{font-size:12cqw}#titulo .sub{font-size:max(14px,4.4cqw);margin:2cqw 6cqw 6cqw}#sapoT{width:34cqw}
  #niv{flex-direction:column;gap:3cqw;margin-top:8cqw}#niv .btn{font-size:max(16px,5cqw);padding:2.4cqw 8cqw}
  #cab{top:16cqw;flex-direction:row;gap:1.5cqw;flex-wrap:wrap}#cab span{font-size:max(12px,3.6cqw)}
  #pregunta{top:26cqw;font-size:max(18px,6cqw)}
  #opts{top:40cqw;gap:3cqw}.op{width:26cqw;height:20cqw;font-size:max(24px,8cqw)}
  #pozo{left:1cqw;right:1cqw;top:76cqw;height:50cqw}
  .nen{width:10cqw;min-width:0;top:14cqw}.nen:nth-child(even){top:30cqw}.nen .num{font-size:max(12px,3.4cqw);padding:0 .6cqw;min-width:6cqw}#sapo{width:12cqw}
  #btnContar{bottom:6cqw;left:5cqw}#btnInicio{bottom:6cqw;right:5cqw}
}
</style>
</head>
<body>
<div id="wrap">
<a class="volver" href="/matematicas/#juegos">← Volver a Matemáticas</a>
<div id="stage" class="mode-titulo">
  <div id="world">
    <svg id="scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>

<script>
'use strict';
const CANCEL = { cancelado: true };
const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } }
};
const mezclar = (a, azar = Math.random) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(azar() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ent = (azar, lo, hi) => lo + Math.floor(azar() * (hi - lo + 1));
const elige = (a, azar = Math.random) => a[Math.floor(azar() * a.length)];
/* ============================================================
   SAPO SALTARÍN: completa la hilera contando de 2 en 2, de 5 en 5 o de 10 en 10
   Estructura: 1 config · 2 estado · 3 motor · 4 arte · 5 render · 6 flujo · 7 eventos
   ============================================================ */
/* ====================== 1. CONFIG ====================== */
const CFG = {
  PASOS: [{ paso: 2, nombre: 'De 2 en 2' }, { paso: 5, nombre: 'De 5 en 5' }, { paso: 10, nombre: 'De 10 en 10' }],
  NENUFARES: 10, RONDAS: 5, OPCIONES: 3,   // No confirmado en la ficha: número de rondas; el error no quita nada, solo se cuenta
  MS_SALTO: 380,
  VEL: [{ x: 1, f: 1, ritmo: 1 }], K_REC: 'sap_mejor_', K_MUDO: 'sc_mute'
};
/* ====================== 2. ESTADO ====================== */
const S = { pantalla: 'titulo', corrida: 0, pausas: new Set(), vel: 0, fin: false, p: 0, ronda: 0, q: null, errores: 0, ocupado: false, pos: 0 };

const vivas = new Set();
const D = ms => RM ? ms * 0.3 : ms * CFG.VEL[S.vel].f;     // duración según velocidad visual
function limpia(el) { el.getAnimations().forEach(a => a.cancel()); }
function anima(el, kf, op = {}) {
  const c = S.corrida;
  const a = el.animate(kf, Object.assign({ fill: 'forwards', easing: 'ease-out' }, op));
  vivas.add(a); if (S.pausas.size) a.pause();
  return a.finished.then(() => 0, () => 0).then(() => { vivas.delete(a); if (c !== S.corrida) throw CANCEL; });
}
/* Espera que se detiene mientras el juego está en pausa y se cancela al reiniciar */
function esperar(ms) {
  const c = S.corrida;
  return new Promise((res, rej) => {
    let acum = 0, ult = performance.now();
    (function f(t) {
      if (c !== S.corrida) return rej(CANCEL);
      const dt = Math.min(100, t - ult); ult = t; if (!S.pausas.size) acum += dt;
      if (acum >= ms) res(); else requestAnimationFrame(f);
    })(ult);
  });
}

/* ============================ 7. AUDIO (Web Audio, sin archivos) ============================ */
const Snd = (() => {
  let ctx = null, master = null, mus = null, mudo = store.get(CFG.K_MUDO) === '1', timer = null, paso = 0, prox = 0;
  const ACORDES = [[220, 261.63, 329.63], [174.61, 220, 261.63], [261.63, 329.63, 392], [196, 246.94, 293.66]]; // La m, Fa, Do, Sol
  const NEG = 60 / 92 / 2;                                         // corchea a 92 bpm
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC(); master = ctx.createGain(); master.gain.value = mudo ? 0 : .7; master.connect(ctx.destination);
    mus = ctx.createGain(); mus.gain.value = .55; mus.connect(master);
    if (!mudo) iniciaMusica();
  }
  function tono(f, t, d, tipo = 'sine', v = .2, f2 = null, dest = master) {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = tipo; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + d + .03);
  }
  function ruido(t, d, v = .25) {
    const n = Math.floor(ctx.sampleRate * d), b = ctx.createBuffer(1, n, ctx.sampleRate), x = b.getChannelData(0);
    for (let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = b; f.type = 'bandpass'; f.frequency.value = 900;
    g.gain.value = v; s.connect(f); f.connect(g); g.connect(master); s.start(t);
  }
  function sfx(n) {
    if (!ctx || mudo || ctx.state !== 'running') return; const t = ctx.currentTime;
    switch (n) {
      case 'clic': tono(660, t, .08, 'triangle', .18, 880); break;
      case 'acierto': [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tono(f, t + i * .07, .18, 'triangle', .2)); break;
      case 'error': tono(190, t, .32, 'sawtooth', .16, 90); tono(140, t + .02, .32, 'square', .08, 70); break;
      case 'tic': tono(1250, t, .04, 'sine', .12); break;
      case 'vida': tono(440, t, .14, 'triangle', .2, 330); tono(330, t + .13, .14, 'triangle', .2, 247); tono(220, t + .26, .3, 'triangle', .22, 147); break;
      case 'moneda': tono(1318.5, t, .09, 'square', .09); tono(1760, t + .07, .22, 'square', .09); break;
      case 'golpe': ruido(t, .18, .35); tono(120, t, .16, 'sine', .3, 50); break;
      case 'victoria': [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5].forEach((f, i) => tono(f, t + i * .13, .3, 'triangle', .22)); break;
      case 'derrota': [392, 349.23, 329.63, 261.63].forEach((f, i) => tono(f, t + i * .2, .38, 'triangle', .2)); break;
    }
  }
  function agenda() {
    if (!ctx || mudo) return;
    while (prox < ctx.currentTime + .25) {
      if (prox < ctx.currentTime) prox = ctx.currentTime + .05;
      const a = ACORDES[Math.floor(paso / 8) % 4], i = paso % 8;
      if (i === 0) a.forEach(f => tono(f, prox, NEG * 8, 'triangle', .045, null, mus));
      if (i % 4 === 0) tono(a[0] / 2, prox, NEG * 3, 'sine', .08, null, mus);
      tono(a[[0, 1, 2, 1, 2, 1, 0, 1][i]] * 2, prox, NEG * 1.6, 'sine', .04, null, mus);
      prox += NEG; paso++;

  }
  function iniciaMusica() { if (timer || !ctx) return; prox = ctx.currentTime + .1; timer = setInterval(agenda, 60); }
  function paraMusica() { clearInterval(timer); timer = null; }
  function setMudo(m) {
    mudo = m; store.set(CFG.K_MUDO, m ? '1' : '0');
    if (ctx) { master.gain.setTargetAtTime(m ? 0 : .7, ctx.currentTime, .03); if (m) paraMusica(); else iniciaMusica(); }
    pintaMudo();
  }
  return { init, sfx, setMudo, esMudo: () => mudo, suspende: () => ctx && ctx.suspend(), reanuda: () => ctx && ctx.resume() };
})();
function pintaMudo() {
  const m = Snd.esMudo(); $('btnSonido').setAttribute('aria-pressed', m);
  $('btnSonido').setAttribute('aria-label', m ? 'Sonido desactivado. Toca para activar' : 'Sonido activado. Toca para silenciar');
}


/* ====================== COMÚN: pausa, sonido, voz ====================== */
function pausar(m) {
  if (S.pantalla !== 'juego' || S.fin) return;
  S.pausas.add(m); $('stage').classList.add('paused'); $('ovPausa').classList.add('on');
  vivas.forEach(a => { try { a.pause(); } catch (e) { /* ya terminó */ } }); setTimeout(() => $('btnContinuar').focus(), 30);
}
function reanudar() {
  S.pausas.clear(); $('ovPausa').classList.remove('on'); $('stage').classList.remove('paused');
  vivas.forEach(a => { try { a.play(); } catch (e) { /* ya terminó */ } }); Snd.reanuda();
}
function irA(p) { S.pantalla = p; $('stage').className = 'mode-' + p; }
function pintaMudo() {
  const m = Snd.esMudo(); $('btnSonido').setAttribute('aria-pressed', m);
  $('btnSonido').setAttribute('aria-label', m ? 'Sonido desactivado. Toca para activar' : 'Sonido activado. Toca para silenciar');
  if (m && 'speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch (e) { /* sin voz */ } }
}
function decir(t) {   // voz en español con la síntesis del navegador (si existe y no está en silencio)
  if (Snd.esMudo() || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'es-ES'; u.rate = .9; speechSynthesis.speak(u); } catch (e) { /* sin voz */ }
}
function mostrarFin(titulo, a, b, c, victoria) {
  $('tFin').textContent = titulo; $('fA').textContent = a; $('fB').textContent = b; $('fC').textContent = c;
  $('fin').classList.add('on'); Snd.sfx(victoria ? 'victoria' : 'derrota'); setTimeout(() => $('btnOtra').focus(), 50);
}
function iniciaComun(alTecla) {
  const primero = () => { Snd.init(); window.removeEventListener('pointerdown', primero, true); window.removeEventListener('keydown', primero, true); };
  window.addEventListener('pointerdown', primero, true); window.addEventListener('keydown', primero, true);
  $('btnSonido').addEventListener('click', () => { Snd.setMudo(!Snd.esMudo()); Snd.sfx('clic'); });
  $('btnContinuar').addEventListener('click', () => { Snd.sfx('clic'); reanudar(); });
  const bp = $('btnPausa'); if (bp) bp.addEventListener('click', () => { Snd.sfx('clic'); if (S.pantalla === 'juego') (S.pausas.size ? reanudar() : pausar('manual')); });
  window.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'm') { Snd.setMudo(!Snd.esMudo()); return; }
    if (S.pantalla === 'juego' && k === 'p') { if (S.pausas.size) reanudar(); else pausar('manual'); return; }
    if (alTecla) alTecla(e, k);
  });
  const sinFoco = () => { if (S.pantalla === 'juego' && !S.pausas.size && !S.fin) { pausar('foco'); Snd.suspende(); } };
  document.addEventListener('visibilitychange', () => { if (document.hidden) sinFoco(); else Snd.reanuda(); });
  window.addEventListener('blur', sinFoco);
}


/* ====================== 3. MOTOR ====================== */
const Motor = {
  /* crearPregunta({paso, azar}) -> {paso, valores[10], oculto (índice 1..8), opciones[3], ok(índice en opciones)} */
  crearPregunta({ paso = 2, n = CFG.NENUFARES, azar = Math.random } = {}) {
    const valores = Array.from({ length: n }, (_, i) => (i + 1) * paso), oculto = 1 + Math.floor(azar() * (n - 2));
    const dis = mezclar(valores.filter((_, i) => i !== oculto), azar).slice(0, CFG.OPCIONES - 1), opciones = mezclar([valores[oculto], ...dis], azar);
    return { paso, valores, oculto, opciones, ok: opciones.indexOf(valores[oculto]) };
  }
};

/* ====================== 4. ARTE ====================== */
function lagunaSVG() {
  let juncos = ''; for (let i = 0; i < 14; i++) juncos += `<path d="M${60 + i * 118} 560q-8-90 6-150" fill="none" stroke="#2E7A4E" stroke-width="10" stroke-linecap="round"/><ellipse cx="${66 + i * 118}" cy="410" rx="10" ry="26" fill="#8A4B1E"/>`;
  return `<defs><linearGradient id="slc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7BC8FF"/><stop offset="1" stop-color="#E8F6FF"/></linearGradient><linearGradient id="sag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3AA6C8"/><stop offset="1" stop-color="#1F6A9A"/></linearGradient></defs>
  <rect width="1600" height="1000" fill="url(#slc)"/><g fill="#fff" opacity=".9"><ellipse cx="240" cy="140" rx="110" ry="34"/><ellipse cx="1200" cy="110" rx="130" ry="38"/></g>
  <path d="M0 520Q300 440 600 500T1200 480T1600 520V1000H0z" fill="#4FB35A"/>${juncos}
  <rect y="560" width="1600" height="440" fill="url(#sag)"/><path class="ola" d="M0 640q100-26 200 0t200 0 200 0 200 0 200 0 200 0 200 0 200 0" fill="none" stroke="#9AE0F0" stroke-width="8" opacity=".7"/><path class="ola" d="M0 760q100-26 200 0t200 0 200 0 200 0 200 0 200 0 200 0 200 0" fill="none" stroke="#9AE0F0" stroke-width="8" opacity=".5" style="animation-delay:-1.4s"/>`;
}
function sapoSVG() {
  return `<svg viewBox="0 0 120 100" aria-hidden="true"><g stroke="#202D4A" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">
   <path d="M18 86q-14-6-12 8h24zM102 86q14-6 12 8H90z" fill="#2FA65A"/><ellipse cx="60" cy="66" rx="38" ry="28" fill="#4FC36A"/><ellipse cx="60" cy="74" rx="24" ry="16" fill="#CFF5B8" stroke="none"/>
   <circle cx="38" cy="38" r="15" fill="#4FC36A"/><circle cx="82" cy="38" r="15" fill="#4FC36A"/><circle cx="38" cy="38" r="9" fill="#fff"/><circle cx="82" cy="38" r="9" fill="#fff"/><circle cx="40" cy="39" r="4" fill="#202D4A" stroke="none"/><circle cx="80" cy="39" r="4" fill="#202D4A" stroke="none"/>
   <path d="M40 62q20 14 40 0" fill="none"/><path d="M26 26q34-24 68 0z" fill="#F2D9A0"/><rect x="22" y="24" width="76" height="6" rx="3" fill="#C99A5A"/><path d="M42 86q18 10 36 0" fill="none" stroke="#FFC928" stroke-width="7"/></g></svg>`;
}
function nenufarSVG() { return '<svg viewBox="0 0 100 50" aria-hidden="true"><ellipse cx="50" cy="28" rx="46" ry="18" fill="#2FA65A" stroke="#0F4A26" stroke-width="3"/><path d="M50 28L90 18" stroke="#0F4A26" stroke-width="3" fill="none"/><ellipse cx="50" cy="24" rx="34" ry="10" fill="#4FC36A" opacity=".7"/></svg>'; }

/* ====================== 5. RENDER ====================== */
const cx = i => (100 / CFG.NENUFARES) * (i + .5);   // posición horizontal (%) del nenúfar i
function pintaRonda(q) {
  $('hilera').innerHTML = q.valores.map((v, i) => `<button type="button" class="nen${i === q.oculto ? ' falta' : ''}" data-i="${i}" style="left:${cx(i)}%" aria-label="Nenúfar ${i + 1}: ${i === q.oculto ? 'número que falta' : v}"><span class="pad">${nenufarSVG()}</span><b class="num">${i === q.oculto ? '?' : v}</b></button>`).join('');
  $('opts').innerHTML = q.opciones.map((o, i) => `<button type="button" class="op" data-i="${i}" aria-label="Opción ${i + 1}: ${o}">${o}<span class="k" aria-hidden="true">${i + 1}</span></button>`).join('');
  $('rond').textContent = 'Ronda ' + (S.ronda + 1) + ' de ' + CFG.RONDAS; $('pasoT').textContent = CFG.PASOS[S.p].nombre;
  const t = $('sapo'); limpia(t); t.style.left = cx(0) + '%'; t.style.translate = '0 0'; t.style.opacity = 1; S.pos = 0;
}

/* ====================== 6. FLUJO ====================== */
async function salta(a, b) {   // salto del sapo del nenúfar a al nenúfar b
  const t = $('sapo'), ms = D(CFG.MS_SALTO);
  anima(t, [{ translate: '0 0' }, { translate: '0 -7cqw', offset: .5 }, { translate: '0 0' }], { duration: ms, easing: 'ease-in-out' });
  await anima(t, [{ left: cx(a) + '%' }, { left: cx(b) + '%' }], { duration: ms, easing: 'linear' });
  S.pos = b;
}
async function cuenta(hasta) {   // demostración: el sapo cuenta saltando hasta el nenúfar tocado
  const q = S.q, c = S.corrida; S.ocupado = true; const hs = [...$('hilera').children]; hs.forEach(h => h.classList.remove('lit'));
  try {
    if (S.pos !== 0) await salta(S.pos, 0);
    for (let i = 0; i <= hasta; i++) {
      if (i > 0) await salta(i - 1, i);
      hs[i].classList.add('lit'); Snd.sfx('clic'); decir(String(q.valores[i]));
      await esperar(250);
    }
  } catch (e) { if (e !== CANCEL) throw e; return; }
  if (c === S.corrida) S.ocupado = false;
}
async function responde(i) {
  if (S.pantalla !== 'juego' || S.ocupado || S.fin || S.pausas.size) return;
  const q = S.q, b = $('opts').children[i];
  if (i !== q.ok) { S.errores++; Snd.sfx('error'); b.classList.remove('mal'); void b.offsetWidth; b.classList.add('mal'); mensaje('Cuenta otra vez', 'bad'); pintaErr(); return; }
  S.ocupado = true; b.classList.add('ok'); Snd.sfx('acierto');
  try {
    const hs = [...$('hilera').children];
    if (S.pos !== 0) await salta(S.pos, 0);
    for (let k = 0; k <= q.oculto; k++) { if (k > 0) await salta(k - 1, k); hs[k].classList.add('lit'); }
    hs[q.oculto].classList.remove('falta'); hs[q.oculto].querySelector('.num').textContent = q.valores[q.oculto]; decir(String(q.valores[q.oculto]));
    for (let k = q.oculto + 1; k < CFG.NENUFARES; k++) { await salta(k - 1, k); hs[k].classList.add('lit'); }
    await anima($('sapo'), [{ opacity: 1 }, { opacity: 0 }], { duration: D(400) });
    S.ronda++; Snd.sfx('moneda');
    if (S.ronda >= CFG.RONDAS) { S.fin = true; return termina(); }
    S.q = Motor.crearPregunta({ paso: CFG.PASOS[S.p].paso }); pintaRonda(S.q); S.ocupado = false;
  } catch (e) { if (e !== CANCEL) throw e; }
}
function pintaErr() { $('errs').textContent = 'Errores: ' + S.errores; }
function mensaje(t, tipo) { const m = $('msg'); m.className = tipo; m.textContent = t; m.style.opacity = 1; clearTimeout(mensaje.t); mensaje.t = setTimeout(() => { m.style.opacity = 0; }, 900); }
function termina() {
  const k = CFG.K_REC + CFG.PASOS[S.p].paso, mej = store.get(k), m = mej === null ? null : parseInt(mej, 10), nuevo = m === null || S.errores < m;
  if (nuevo) store.set(k, String(S.errores));
  mostrarFin('¡Cruzaste la laguna!', 'Rondas: ' + CFG.RONDAS, 'Mejor: ' + (nuevo ? S.errores : m) + (nuevo ? ' errores ¡Nuevo!' : ' errores'), 'Errores: ' + S.errores, true);
}
function nuevaPartida(p) {
  S.p = p; S.corrida++; vivas.forEach(a => a.cancel()); vivas.clear(); S.pausas.clear(); S.fin = false; S.ronda = 0; S.errores = 0; S.ocupado = false;
  $('fin').classList.remove('on'); $('ovPausa').classList.remove('on'); $('stage').classList.remove('paused'); $('msg').style.opacity = 0;
  S.q = Motor.crearPregunta({ paso: CFG.PASOS[p].paso }); irA('juego'); pintaErr(); pintaRonda(S.q);
  setTimeout(() => { if (S.pantalla === 'juego' && !S.ocupado) cuenta(S.q.oculto - 1); }, 400);
}
function aTitulo() { S.corrida++; S.fin = false; vivas.forEach(a => a.cancel()); vivas.clear(); irA('titulo'); $('fin').classList.remove('on'); setTimeout(() => { const b = document.querySelector('.nivbtn'); if (b) b.focus(); }, 30); }

/* ====================== 7. EVENTOS ====================== */
(function iniciar() {
  $('scene').innerHTML = lagunaSVG(); $('sapo').innerHTML = sapoSVG(); $('sapoT').innerHTML = sapoSVG(); pintaMudo();
  $('niv').innerHTML = CFG.PASOS.map((n, i) => `<button class="btn nivbtn" type="button" data-n="${i}">${n.nombre}</button>`).join('');
  $('niv').addEventListener('click', e => { const b = e.target.closest('.nivbtn'); if (b) { Snd.sfx('clic'); nuevaPartida(+b.dataset.n); } });
  $('hilera').addEventListener('click', e => { const b = e.target.closest('.nen'); if (!b || S.ocupado || S.pausas.size || S.fin) return; const i = +b.dataset.i; cuenta(i === S.q.oculto ? i - 1 : i); });
  $('opts').addEventListener('click', e => { const b = e.target.closest('.op'); if (b) responde(+b.dataset.i); });
  $('btnContar').addEventListener('click', () => { if (!S.ocupado && !S.fin && !S.pausas.size) { Snd.sfx('clic'); cuenta(S.q.oculto - 1); } });
  $('btnOtra').addEventListener('click', () => { Snd.sfx('clic'); aTitulo(); });
  $('btnInicio').addEventListener('click', () => { Snd.sfx('clic'); aTitulo(); });
  iniciaComun((e, k) => {
    if (S.pantalla === 'titulo' && /^[1-3]$/.test(k)) { Snd.sfx('clic'); nuevaPartida(+k - 1); }
    else if (S.pantalla === 'juego' && /^[1-3]$/.test(k)) { responde(+k - 1); e.preventDefault(); }
  });
  window.__sap = { S, CFG, Motor };   // gancho de pruebas
})();
