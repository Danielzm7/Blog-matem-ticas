<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Mi primer mapa: guía al pollito con las flechas hasta la bandera y descubre qué hay arriba, abajo y a los lados de cada lugar. Para niños de 5 a 6 años.">
<title>Mi primer mapa: sigue el camino</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#12082e;color:var(--ink);
  font-family:'Fredoka','Nunito','Baloo 2','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;font-weight:700}
button{font:inherit;color:inherit}
#wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:6px}
.volver{align-self:center;color:#cfe3fb;text-decoration:none;font-size:15px;min-height:28px;display:inline-flex;align-items:center;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.08)}
.volver:hover{background:rgba(255,255,255,.18);color:#fff}
#stage{position:relative;width:var(--W);aspect-ratio:16/10;container-type:inline-size;overflow:hidden;
  border-radius:calc(var(--W)*.022);background:#2b1456;isolation:isolate;
  box-shadow:0 calc(var(--W)*.015) calc(var(--W)*.05) rgba(0,0,0,.55);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#world{position:absolute;inset:0}
#scene{position:absolute;left:0;top:0;width:100%;height:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:max(3px,.4cqw) solid #fff;outline-offset:max(2px,.3cqw)}

/* ---------- Marcos hexagonales con borde doble ---------- */
.hex{--c1:#2a7de1;--c2:#4fc3ff;position:relative;display:block;width:var(--w,7cqw);aspect-ratio:1/.866;
  filter:drop-shadow(0 0 .55cqw rgba(79,195,255,.65));border:0;background:none;padding:0;margin:0}
.hex>i,.hex>i>i,.hex>i>i>i{position:absolute;display:block;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.hex>i{inset:0;background:linear-gradient(160deg,var(--c2),var(--c1))}
.hex>i>i{inset:7%;background:#fff}
.hex>i>i>i{inset:7%;background:linear-gradient(180deg,#f6faff,#c9defa);display:grid;place-items:center;overflow:hidden}
.hex svg{width:78%;height:78%;display:block}
button.hex{cursor:pointer;transition:transform .15s,filter .15s}
button.hex:hover{transform:translateY(-.3cqw) scale(1.05);filter:drop-shadow(0 0 .9cqw rgba(255,255,255,.9))}
button.hex:active{transform:scale(.96)}
.hexw{--c1:#2a7de1;--c2:#4fc3ff;position:relative;display:block;height:6.4cqw;min-width:14.5cqw;
  filter:drop-shadow(0 0 .55cqw rgba(79,195,255,.65))}
.hexw>i,.hexw>i>i,.hexw>i>i>i{position:absolute;display:block;clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%)}
.hexw>i{inset:0;background:linear-gradient(160deg,var(--c2),var(--c1))}
.hexw>i>i{inset:7%;background:#fff}
.hexw>i>i>i{inset:7%;background:linear-gradient(180deg,#f6faff,#c9defa);display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.05;padding:0 .6cqw}
.hexw small{font-size:max(10px,1.3cqw);color:#4a5a8c;letter-spacing:.02em;font-weight:700}
.hexw b{font-size:max(13px,1.95cqw);color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}


/* ---------- Modales ---------- */
.overlay{position:absolute;inset:0;z-index:20;display:none;place-items:center;background:rgba(14,6,40,.62)}
.overlay.on{display:grid}
.modal{position:relative;width:62cqw;border-radius:2.4cqw;padding:5cqw 3cqw 2.6cqw;text-align:center;
  background:linear-gradient(180deg,#f8fcff,#c9e0fb);border:max(3px,.45cqw) solid #fff;box-shadow:0 0 0 max(3px,.5cqw) #2a7de1,0 1cqw 3cqw rgba(0,0,0,.55)}
.modal .pill{position:absolute;left:50%;top:0;transform:translate(-50%,-50%)}
.modal p{margin:.6cqw 0;font-size:max(14px,2.3cqw);line-height:1.3;color:var(--ink)}
.ej{margin:1.4cqw auto 1.8cqw;padding:1.2cqw 2cqw;border-radius:1.6cqw;background:#fff;border:.35cqw dashed #5b2bb5;display:inline-block}
.ej b{color:#5b2bb5}
#dim{position:absolute;inset:0;z-index:12;background:rgba(10,4,30,.74);opacity:0;pointer-events:none;transition:opacity .6s}
#dim.on{opacity:1}
#fin{z-index:15;background:transparent}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqw;margin:1.4cqw 0 2cqw}
.mini{display:flex;flex-direction:column;align-items:center;gap:.8cqw}
.mini .hex{--w:72%}
.mini .hex svg{width:80%;height:80%}
.mini span{font-size:max(12px,1.9cqw);line-height:1.15;color:var(--ink)}
.mini b{display:block;font-size:max(16px,3cqw);color:var(--p2)}
#cuenta{position:absolute;inset:0;z-index:11;display:none;place-items:center;pointer-events:none}
#cuenta.on{display:grid}
#cuenta span{font-size:24cqw;color:#fff;text-shadow:0 1cqw 0 #5b2bb5,0 0 4cqw rgba(79,195,255,.9);animation:cnt .9s ease-out both}
@keyframes cnt{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(.9);opacity:.9}}
.rays{animation:spin 12s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}


.pill{background:linear-gradient(180deg,#8a55ea,#4a1fa0);color:#fff;border-radius:99px;padding:.6cqw 3.2cqw;font-size:max(15px,2.5cqw);
  box-shadow:0 .4cqw 0 #2b1456,inset 0 .2cqw 0 rgba(255,255,255,.35);text-shadow:0 .2cqw 0 rgba(0,0,0,.35);display:inline-block;white-space:nowrap}
.btn{border:0;border-radius:99px;cursor:pointer;min-height:48px;padding:1cqw 6cqw;color:#fff;font-size:max(17px,2.8cqw);letter-spacing:.06em;
  background:linear-gradient(90deg,#2a7de1,#7a3be0);box-shadow:0 .5cqw 0 #1b2f84,0 1cqw 2cqw rgba(0,0,0,.35),inset 0 .2cqw 0 rgba(255,255,255,.35);
  text-shadow:0 .2cqw 0 rgba(0,0,0,.3);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.12);transform:translateY(-.3cqw)}
.btn:active{transform:translateY(.3cqw)}


#stage{background:#0b1a3a}
:root{--W:min(100vw - 16px,(100dvh - 52px)*1.6)}
#scene{position:absolute;left:0;top:0;width:100%;height:100%}
.volver{align-self:center;color:#cfe3fb;text-decoration:none;font-size:15px;min-height:28px;display:inline-flex;align-items:center;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.08)}
.volver:hover{background:rgba(255,255,255,.18);color:#fff}
#wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:6px}
:focus-visible{outline:max(3px,.4cqw) solid #fff;outline-offset:max(2px,.3cqw)}
.tw{animation:tw 3.2s ease-in-out infinite}@keyframes tw{50%{opacity:.25}}
#hudR{position:absolute;right:2cqw;top:2cqw;display:flex;align-items:center;gap:1.4cqw;z-index:8}
#hudR .hex{--w:max(56px,7cqw)}#hudR .hex svg{width:62%;height:62%}
#mudoX{opacity:1}#btnSonido[aria-pressed=false] #mudoX{opacity:0}
.paused *{animation-play-state:paused!important}
#msg{position:absolute;left:0;right:0;top:34%;text-align:center;z-index:9;font-size:max(26px,6cqw);color:#fff;text-shadow:0 .5cqw 0 rgba(0,0,0,.45),0 0 2cqw rgba(0,0,0,.5);pointer-events:none;opacity:0}
#msg.ok{color:#9dff6b}#msg.bad{color:#ff9a9a}
.cards{display:grid;gap:1cqw;margin:1.4cqw 0 2.4cqw}
.mini{display:flex;align-items:center;gap:1.4cqw;background:#fff;border-radius:99px;padding:.5cqw 2cqw .5cqw .6cqw;color:#1d1a4d;font-size:max(14px,2.3cqw);box-shadow:0 .3cqw 0 rgba(0,0,0,.12)}
.mini .hex{--w:max(46px,6.2cqw);flex:none}.mini span:last-child{flex:1;text-align:left;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#msg{top:57cqw!important}.mode-titulo :is(#prog,#mapa,#panel,#fb,#btnOir,#btnInicio,#btnPausa){display:none}
.mode-juego #titulo{display:none}
.hex,.hexw{--c1:#3FB86A;--c2:#FFD84A;filter:drop-shadow(0 0 .55cqw rgba(255,255,255,.5))}
.btn{background:linear-gradient(90deg,#3FB86A,#2A9DF4)}
#titulo{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;padding-top:5cqw;text-align:center}
#titulo h1{margin:0;font-size:7cqw;line-height:1;color:#fff;letter-spacing:.02em;text-shadow:0 .6cqw 0 #3FB86A,0 1.2cqw 0 #14602A,0 2cqw 2cqw rgba(0,0,0,.3)}
#titulo .sub{margin:.8cqw 0 .6cqw;font-size:max(14px,2.8cqw);color:#14407a;text-shadow:0 .2cqw 0 #fff}
#pipoT{width:13cqw}#pipoT svg,#pipo svg{width:100%;height:100%;display:block}
#niv{display:flex;gap:1.6cqw;margin-top:2.4cqw;flex-wrap:wrap;justify-content:center;width:92%}#niv .btn{font-size:max(14px,2.5cqw);padding:1.2cqw 2.4cqw;min-height:48px;white-space:nowrap}
#prog{position:absolute;left:2cqw;top:2cqw;z-index:6;color:#fff;background:#14602Add;border:max(2px,.3cqw) solid #FFE9A8;border-radius:1.4cqw;padding:.3cqw 1.8cqw;font-size:max(16px,2.8cqw)}
#mapa{position:absolute;left:4cqw;top:11cqw;width:55cqw;height:44cqw;z-index:5;border:max(3px,.5cqw) solid #14602A;border-radius:2cqw;overflow:hidden;background:#BEEA8A;box-shadow:0 1cqw 0 rgba(0,0,0,.18)}
#celdas{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr)}
.cel{position:relative;display:grid;place-items:center;background:#C9F096;border:1px solid rgba(20,96,42,.18)}.cel.b{background:#B2E07A}
.cel svg{width:78%;height:78%}.cel.foco{outline:max(3px,.5cqw) solid #E0409A;outline-offset:-.5cqw;background:#FFE9F2}
.bandera{position:absolute;right:6%;top:2%;font-size:4cqw;line-height:1}.cel.meta{background:#FFF1A8}
#pipo{position:absolute;z-index:3;transition:left .35s ease,top .35s ease;padding:.6cqw}#pipo.salta{animation:salto .6s}@keyframes salto{40%{translate:0 -2cqw}}
#panel{position:absolute;left:62cqw;top:11cqw;width:34cqw;z-index:6;display:flex;flex-direction:column;gap:1.4cqw}
#instr{margin:0;font-size:max(14px,2.2cqw);line-height:1.25;color:#14407a;background:#ffffffdd;border:max(2px,.3cqw) solid #2A7DE1;border-radius:1.6cqw;padding:1cqw 1.4cqw;min-height:8cqw}
#chips{display:flex;gap:.8cqw;flex-wrap:wrap;min-height:5cqw}.chip{width:5cqw;height:5cqw;min-width:30px;min-height:30px;display:grid;place-items:center;border-radius:1cqw;border:max(2px,.3cqw) solid #14407a;background:#fff;color:#14407a;font-size:max(18px,3.2cqw);line-height:1}
.chip.hecho{background:#7ee0a0;border-color:#14602A;color:#14602A}.chip.sig{background:#FFE45C;outline:max(2px,.3cqw) solid #E0409A}.chip.mal{animation:nop .4s}@keyframes nop{25%{translate:-.8cqw 0}75%{translate:.8cqw 0}}
#pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-areas:". u ." "l d r";gap:.8cqw;width:24cqw;margin:0 auto}
#pad button{height:8cqw;min-height:52px;min-width:52px;border-radius:2cqw;border:max(3px,.4cqw) solid #14407a;background:linear-gradient(180deg,#6AC0FF,#2A7DE1);color:#fff;font-size:max(24px,4.6cqw);line-height:1;cursor:pointer;box-shadow:0 .5cqw 0 #14407a;padding:0}
#pad .u{grid-area:u}#pad .l{grid-area:l}#pad .d{grid-area:d}#pad .r{grid-area:r}
#opts{display:grid;grid-template-columns:repeat(3,1fr);gap:1cqw}
.op{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2cqw;min-height:56px;border-radius:1.6cqw;border:max(3px,.4cqw) solid #14407a;background:linear-gradient(180deg,#fff,#DDF1FC);color:#14407a;font-size:max(12px,2cqw);cursor:pointer;padding:.6cqw}
.op svg{width:7cqw;min-width:34px}.op .k{position:absolute;left:.6cqw;top:.4cqw;font-style:normal;font-size:max(11px,1.6cqw);opacity:.6}
.op.ok{background:#7ee0a0;border-color:#14602A}.op.mal{background:#ffc2c2;border-color:#a31212;opacity:.7}
#panel.a #opts{display:none}#panel.b :is(#pad,#chips){display:none}
#fb{display:none}
#btnOir{position:absolute;left:4cqw;bottom:1.5cqw;z-index:6;font-size:max(14px,2.2cqw);padding:1cqw 3cqw;min-height:48px}
#btnInicio{position:absolute;right:2cqw;bottom:1.5cqw;z-index:6;font-size:max(14px,2.2cqw);padding:1cqw 3cqw;min-height:48px}
.btn:focus-visible,#pad button:focus-visible,.op:focus-visible{outline:3px solid #FFE066;outline-offset:2px}
@media (max-width:700px) and (orientation:portrait){
  :root{--W:min(100vw - 16px,(100dvh - var(--sc-h,52px) - var(--sc-extra,0px))*.6)}
  #stage{aspect-ratio:3/5}
  #titulo{padding-top:10cqw}#titulo h1{font-size:12cqw}#titulo .sub{font-size:max(14px,4.4cqw);margin:2cqw 6cqw 3cqw}#pipoT{width:30cqw}
  #niv{flex-direction:column;align-items:center;gap:3cqw;margin-top:6cqw}#niv .btn{font-size:max(15px,4.6cqw);padding:2.2cqw 8cqw}
  #prog{top:16cqw;font-size:max(15px,4.6cqw)}
  #mapa{left:10cqw;top:27cqw;width:80cqw;height:64cqw}
  #panel{left:4cqw;top:94cqw;width:92cqw;gap:2cqw}#instr{font-size:max(14px,3.8cqw);min-height:12cqw;padding:1.6cqw 3cqw}
  .chip{width:9cqw;height:9cqw;font-size:max(20px,6cqw)}#pad{width:92cqw;gap:2cqw;grid-template-columns:repeat(4,1fr);grid-template-areas:'l u d r'}#pad button{height:13cqw;font-size:max(26px,8cqw)}
  .op{font-size:max(12px,3.4cqw);min-height:64px}.op svg{width:14cqw}.bandera{font-size:8cqw}
  #msg{top:92cqw!important}#btnOir{left:4cqw;bottom:3cqw;font-size:max(14px,4cqw);padding:2cqw 4cqw}#btnInicio{right:4cqw;bottom:3cqw;font-size:max(14px,4cqw);padding:2cqw 5cqw}
}
</style>

<body>
<div id="wrap">
<a class="volver" href="/matematicas/#juegos">← Volver a Matemáticas</a>
<div id="stage" class="mode-titulo">
  <div id="world">
    <svg id="scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    <section id="titulo" aria-label="Título"><h1>MI PRIMER MAPA</h1><p class="sub">sigue el camino y descubre qué hay en el mapa</p><div id="pipoT" aria-hidden="true"></div><div id="niv" role="group" aria-label="Elige el reto"></div></section>
    <div id="prog" role="status"></div>
    <div id="mapa" role="img"><div id="celdas"></div><div id="pipo" aria-hidden="true"></div></div>
    <div id="panel" class="a"><p id="instr" aria-live="polite"></p><div id="chips" aria-label="Pasos del camino"></div>
      <div id="pad" role="group" aria-label="Flechas para mover al pollito"><button type="button" data-d="U" aria-label="Arriba" class="u">↑</button><button type="button" data-d="L" aria-label="Izquierda" class="l">←</button><button type="button" data-d="D" aria-label="Abajo" class="d">↓</button><button type="button" data-d="R" aria-label="Derecha" class="r">→</button></div>
      <div id="opts" role="group" aria-label="Lugares"></div></div>
    <div id="fb" role="status" aria-live="assertive"></div><button class="btn" id="btnOir" type="button">🔊 Escuchar</button><button class="btn" id="btnInicio" type="button">Inicio</button>
    <div id="hudR"><button class="hex" id="btnPausa" type="button" aria-label="Pausa"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="16" y="14" width="12" height="36" rx="4" fill="#5b2bb5"/><rect x="36" y="14" width="12" height="36" rx="4" fill="#5b2bb5"/></svg></i></i></i></button><button class="hex" id="btnSonido" type="button" aria-label="Sonido" aria-pressed="false"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M10 25h10l14-11v36L20 39H10z" fill="#2a7de1"/><path d="M41 23c5 5 5 13 0 18M47 16c9 9 9 23 0 32" stroke="#2a7de1" stroke-width="4" fill="none" stroke-linecap="round"/><path id="mudoX" d="M14 50 52 12" stroke="#e02020" stroke-width="6" stroke-linecap="round"/></svg></i></i></i></button></div>
    <div id="msg" role="status" aria-live="assertive"></div>
  </div>
  <div class="overlay" id="ovPausa">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tPausa">
      <span class="pill" id="tPausa">Pausa</span>
      <p>El juego está en pausa.</p>
      <button class="btn" id="btnContinuar" type="button">Continuar</button>
    </div>
  </div>
  
  <div class="overlay" id="fin">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tFin">
      <span class="pill" id="tFin">Fin del juego</span>
      <div id="finExtra"></div>
      <div class="cards"><div class="mini"><span class="hex"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#ico-monedas"/></svg></i></i></i></span><span id="fA">Aciertos</span></div><div class="mini"><span class="hex"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#ico-cofre"/></svg></i></i></i></span><span id="fB">Récord</span></div><div class="mini"><span class="hex"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#ico-libro"/></svg></i></i></i></span><span id="fC">Preguntas</span></div></div>
      <button class="btn" id="btnOtra" type="button">Jugar de nuevo</button>
    </div>
  </div>
</div>
</div>

  <defs>
    <radialGradient id="gold" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff3a8"/><stop offset=".55" stop-color="#ffc928"/><stop offset="1" stop-color="#d98a00"/></radialGradient>

const DIR = { R: { dc: 1, dr: 0, txt: 'a la derecha', tecla: 'arrowright', flecha: '→' }, L: { dc: -1, dr: 0, txt: 'a la izquierda', tecla: 'arrowleft', flecha: '←' }, U: { dc: 0, dr: -1, txt: 'hacia arriba', tecla: 'arrowup', flecha: '↑' }, D: { dc: 0, dr: 1, txt: 'hacia abajo', tecla: 'arrowdown', flecha: '↓' } };

function pintaChips() { $('chips').innerHTML = S.ruta.map((k, i) => `<span class="chip${i < S.paso ? ' hecho' : i === S.paso ? ' sig' : ''}" aria-label="Paso ${i + 1}: ${DIR[k].txt}${i < S.paso ? ', hecho' : ''}">${DIR[k].flecha}</span>`).join(''); }
function pintaProg() { $('prog').textContent = 'Ronda ' + Math.min(S.ronda + 1, CFG.RONDAS) + ' de ' + CFG.RONDAS; }
function mensaje(t, tipo) { const m = $('msg'); m.className = tipo; m.textContent = t; m.style.opacity = 1; clearTimeout(mensaje.t); mensaje.t = setTimeout(() => { m.style.opacity = 0; }, 900); }

/* ====================== 6. FLUJO ====================== */
function repetir() { if (S.pantalla === 'juego') { Snd.sfx('clic'); decir($('instr').textContent); } }
function nuevaRonda() {
  const n = CFG.NIVELES[S.nivel]; S.fallo = false; S.paso = 0; S.esperando = true;
  if (n.tipo === 'ruta') {
    const r = Motor.crearRuta({ cols: CFG.COLS, filas: CFG.FILAS, largo: rnd(n.min, n.max) });
    S.ruta = r.pasos; S.ruta.ini = r.inicio; S.pos = r.inicio.slice(); S.meta = r.meta; S.q = null;
    const adorno = mezclar(LUGARES.slice()).slice(0, 4), libres = []; for (let f = 0; f < CFG.FILAS; f++) for (let c = 0; c < CFG.COLS; c++) if (!(c === r.meta[0] && f === r.meta[1]) && !(c === r.inicio[0] && f === r.inicio[1])) libres.push([c, f]);
    S.lugares = mezclar(libres).slice(0, 4).map(([c, f], i) => ({ k: adorno[i].k, c, f }));
    $('instr').textContent = Motor.textoRuta(r.pasos) + ' para llegar a la bandera.'; $('panel').className = 'a';
    pintaMapa(); colocaPipo(true); pintaChips();
  } else {
    const r = Motor.crearLado({ cols: CFG.COLS, filas: CFG.FILAS }); S.lugares = r.lugares; S.q = r.q; S.ruta = []; S.pos = [-1, -1];
    $('instr').textContent = Motor.frase(r.q); $('panel').className = 'b';
    const ops = mezclar([r.q.ok, ...mezclar(LUGARES.map(l => l.k).filter(k => k !== r.q.ok && k !== r.q.de)).slice(0, 2)]);
    $('opts').innerHTML = ops.map((k, i) => { const l = LUGARES.find(x => x.k === k); return `<button type="button" class="op" data-k="${k}" aria-label="${l.n}">${icono(k)}<span>${l.n}</span><i class="k" aria-hidden="true">${i + 1}</i></button>`; }).join('');
    pintaMapa(); $('pipo').style.width = '0';
  }
  pintaProg(); $('fb').textContent = ''; setTimeout(() => decir($('instr').textContent), 250);
}
async function acierta() {
  S.esperando = false; if (!S.fallo) S.limpias++; Snd.sfx('acierto'); mensaje('¡Muy bien!', 'ok'); $('pipo').classList.add('salta'); setTimeout(() => $('pipo').classList.remove('salta'), 700);
  const c = S.corrida; S.ronda++;
  try { await esperar(CFG.PAUSA); if (c !== S.corrida) return; if (S.ronda >= CFG.RONDAS) termina(); else nuevaRonda(); } catch (e) { if (e !== CANCEL) throw e; }
}
function mover(d) {
  if (S.pantalla !== 'juego' || S.fin || S.pausas.size || !S.esperando || CFG.NIVELES[S.nivel].tipo !== 'ruta') return;
  if (S.ruta[S.paso] !== d) {   // flecha que no era la siguiente
    S.errores++; S.fallo = true; Snd.sfx('error'); mensaje('Mira la flecha que sigue', 'bad'); const sig = $('chips').querySelector('.sig'); if (sig) { sig.classList.remove('mal'); void sig.offsetWidth; sig.classList.add('mal'); } return;
  }
  S.pos = [S.pos[0] + DIR[d].dc, S.pos[1] + DIR[d].dr]; S.paso++; colocaPipo(); Snd.sfx('clic'); pintaChips();
  if (S.paso >= S.ruta.length) acierta();
}
function elegirLugar(k, el) {
  if (S.pantalla !== 'juego' || S.fin || S.pausas.size || !S.esperando) return;
  if (k === S.q.ok) { el.classList.add('ok'); $('opts').querySelectorAll('.op').forEach(b => { b.disabled = true; }); document.querySelector('.cel.foco')?.classList.remove('foco'); acierta(); }
  else { S.errores++; S.fallo = true; Snd.sfx('error'); el.classList.add('mal'); el.disabled = true; mensaje('Mira el mapa otra vez', 'bad'); }
}
function termina() {
  S.fin = true; const k = CFG.K_REC + CFG.NIVELES[S.nivel].id, mej = parseInt(store.get(k) || '0', 10) || 0, nuevo = S.limpias > mej; if (nuevo) store.set(k, String(S.limpias));
  mostrarFin('¡Llegaste al final del mapa!', 'A la primera: ' + S.limpias + ' de ' + CFG.RONDAS, 'Mejor: ' + Math.max(mej, S.limpias) + (nuevo ? ' ¡Nuevo!' : ''), 'Errores: ' + S.errores, true);
}
function nuevaPartida(n) {
  S.corrida++; S.pausas.clear(); S.fin = false; S.nivel = n; S.ronda = 0; S.limpias = 0; S.errores = 0;
  $('fin').classList.remove('on'); $('ovPausa').classList.remove('on'); $('stage').classList.remove('paused'); $('msg').style.opacity = 0;
  irA('juego'); nuevaRonda();
}
function aTitulo() { S.corrida++; S.fin = false; irA('titulo'); $('fin').classList.remove('on'); setTimeout(() => { const b = document.querySelector('.nivbtn'); if (b) b.focus(); }, 30); }

/* ====================== 7. EVENTOS ====================== */
(function iniciar() {
  $('scene').innerHTML = paisajeSVG(); $('pipo').innerHTML = pipoSVG(); $('pipoT').innerHTML = pipoSVG(); pintaMudo();
  $('niv').innerHTML = CFG.NIVELES.map((n, i) => `<button class="btn nivbtn" type="button" data-n="${i}">${n.nombre}</button>`).join('');
  $('niv').addEventListener('click', e => { const b = e.target.closest('.nivbtn'); if (b) { Snd.sfx('clic'); nuevaPartida(+b.dataset.n); } });
  $('pad').addEventListener('click', e => { const b = e.target.closest('[data-d]'); if (b) mover(b.dataset.d); });
  $('opts').addEventListener('click', e => { const b = e.target.closest('.op'); if (b && !b.disabled) elegirLugar(b.dataset.k, b); });
  $('btnOir').addEventListener('click', repetir);
  $('btnOtra').addEventListener('click', () => { Snd.sfx('clic'); aTitulo(); }); $('btnInicio').addEventListener('click', () => { Snd.sfx('clic'); aTitulo(); });
  iniciaComun((e, k) => {
    if (S.pantalla === 'titulo' && /^[1-3]$/.test(k)) { Snd.sfx('clic'); nuevaPartida(+k - 1); }
    else if (S.pantalla === 'juego') {
      const d = Object.keys(DIR).find(x => DIR[x].tecla === k); if (d) { e.preventDefault(); mover(d); }
      else if (/^[1-3]$/.test(k) && CFG.NIVELES[S.nivel].tipo === 'lado') { const b = $('opts').children[+k - 1]; if (b && !b.disabled) elegirLugar(b.dataset.k, b); }
      else if (k === 'r') repetir();
    }
  });
  window.__map = { S, CFG, Motor };   // gancho de pruebas
})();
</script>
