<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Tienda del yeti: llena la bolsa con los productos que faltan para completar el total. Para niños de 5 a 8 años.">
<title>Tienda del yeti: componer y descomponer</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#12082e;color:var(--ink);
  font-family:'Fredoka','Nunito','Baloo 2','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;font-weight:700}
button{font:inherit;color:inherit}
#wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:6px}
.volver{align-self:center;color:#cfe3fb;text-decoration:none;font-size:15px;min-height:28px;display:inline-flex;align-items:center;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.08)}
.volver:hover{background:rgba(255,255,255,.18);color:#fff}
#stage{position:relative;width:var(--W);aspect-ratio:16/10;container-type:inline-size;overflow:hidden;
  border-radius:calc(var(--W)*.022);background:#2b1456;isolation:isolate;
  box-shadow:0 calc(var(--W)*.015) calc(var(--W)*.05) rgba(0,0,0,.55);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#world{position:absolute;inset:0}
#scene{position:absolute;left:0;top:0;width:100%;height:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:max(3px,.4cqw) solid #fff;outline-offset:max(2px,.3cqw)}

/* ---------- Marcos hexagonales con borde doble ---------- */
.hex{--c1:#2a7de1;--c2:#4fc3ff;position:relative;display:block;width:var(--w,7cqw);aspect-ratio:1/.866;
  filter:drop-shadow(0 0 .55cqw rgba(79,195,255,.65));border:0;background:none;padding:0;margin:0}
.hex>i,.hex>i>i,.hex>i>i>i{position:absolute;display:block;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.hex>i{inset:0;background:linear-gradient(160deg,var(--c2),var(--c1))}
.hex>i>i{inset:7%;background:#fff}
.hex>i>i>i{inset:7%;background:linear-gradient(180deg,#f6faff,#c9defa);display:grid;place-items:center;overflow:hidden}
.hex svg{width:78%;height:78%;display:block}
button.hex{cursor:pointer;transition:transform .15s,filter .15s}
button.hex:hover{transform:translateY(-.3cqw) scale(1.05);filter:drop-shadow(0 0 .9cqw rgba(255,255,255,.9))}
button.hex:active{transform:scale(.96)}
.hexw{--c1:#2a7de1;--c2:#4fc3ff;position:relative;display:block;height:6.4cqw;min-width:14.5cqw;
  filter:drop-shadow(0 0 .55cqw rgba(79,195,255,.65))}
.hexw>i,.hexw>i>i,.hexw>i>i>i{position:absolute;display:block;clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%)}
.hexw>i{inset:0;background:linear-gradient(160deg,var(--c2),var(--c1))}
.hexw>i>i{inset:7%;background:#fff}
.hexw>i>i>i{inset:7%;background:linear-gradient(180deg,#f6faff,#c9defa);display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.05;padding:0 .6cqw}
.hexw small{font-size:max(10px,1.3cqw);color:#4a5a8c;letter-spacing:.02em;font-weight:700}
.hexw b{font-size:max(13px,1.95cqw);color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}


/* ---------- Modales ---------- */
.overlay{position:absolute;inset:0;z-index:20;display:none;place-items:center;background:rgba(14,6,40,.62)}
.overlay.on{display:grid}
.modal{position:relative;width:62cqw;border-radius:2.4cqw;padding:5cqw 3cqw 2.6cqw;text-align:center;
  background:linear-gradient(180deg,#f8fcff,#c9e0fb);border:max(3px,.45cqw) solid #fff;box-shadow:0 0 0 max(3px,.5cqw) #2a7de1,0 1cqw 3cqw rgba(0,0,0,.55)}
.modal .pill{position:absolute;left:50%;top:0;transform:translate(-50%,-50%)}
.modal p{margin:.6cqw 0;font-size:max(14px,2.3cqw);line-height:1.3;color:var(--ink)}
.ej{margin:1.4cqw auto 1.8cqw;padding:1.2cqw 2cqw;border-radius:1.6cqw;background:#fff;border:.35cqw dashed #5b2bb5;display:inline-block}
.ej b{color:#5b2bb5}
#dim{position:absolute;inset:0;z-index:12;background:rgba(10,4,30,.74);opacity:0;pointer-events:none;transition:opacity .6s}
#dim.on{opacity:1}
#fin{z-index:15;background:transparent}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqw;margin:1.4cqw 0 2cqw}
.mini{display:flex;flex-direction:column;align-items:center;gap:.8cqw}
.mini .hex{--w:72%}
.mini .hex svg{width:80%;height:80%}
.mini span{font-size:max(12px,1.9cqw);line-height:1.15;color:var(--ink)}
.mini b{display:block;font-size:max(16px,3cqw);color:var(--p2)}
#cuenta{position:absolute;inset:0;z-index:11;display:none;place-items:center;pointer-events:none}
#cuenta.on{display:grid}
#cuenta span{font-size:24cqw;color:#fff;text-shadow:0 1cqw 0 #5b2bb5,0 0 4cqw rgba(79,195,255,.9);animation:cnt .9s ease-out both}
@keyframes cnt{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(.9);opacity:.9}}
.rays{animation:spin 12s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}


.pill{background:linear-gradient(180deg,#8a55ea,#4a1fa0);color:#fff;border-radius:99px;padding:.6cqw 3.2cqw;font-size:max(15px,2.5cqw);
  box-shadow:0 .4cqw 0 #2b1456,inset 0 .2cqw 0 rgba(255,255,255,.35);text-shadow:0 .2cqw 0 rgba(0,0,0,.35);display:inline-block;white-space:nowrap}
.btn{border:0;border-radius:99px;cursor:pointer;min-height:48px;padding:1cqw 6cqw;color:#fff;font-size:max(17px,2.8cqw);letter-spacing:.06em;
  background:linear-gradient(90deg,#2a7de1,#7a3be0);box-shadow:0 .5cqw 0 #1b2f84,0 1cqw 2cqw rgba(0,0,0,.35),inset 0 .2cqw 0 rgba(255,255,255,.35);
  text-shadow:0 .2cqw 0 rgba(0,0,0,.3);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.12);transform:translateY(-.3cqw)}
.btn:active{transform:translateY(.3cqw)}


#stage{background:#0b1a3a}
:root{--W:min(100vw - 16px,(100dvh - 52px)*1.6)}
#scene{position:absolute;left:0;top:0;width:100%;height:100%}
.volver{align-self:center;color:#cfe3fb;text-decoration:none;font-size:15px;min-height:28px;display:inline-flex;align-items:center;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.08)}
.volver:hover{background:rgba(255,255,255,.18);color:#fff}
#wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:6px}
:focus-visible{outline:max(3px,.4cqw) solid #fff;outline-offset:max(2px,.3cqw)}
.tw{animation:tw 3.2s ease-in-out infinite}@keyframes tw{50%{opacity:.25}}
#hudR{position:absolute;right:2cqw;top:2cqw;display:flex;align-items:center;gap:1.4cqw;z-index:8}
#hudR .hex{--w:max(56px,7cqw)}#hudR .hex svg{width:62%;height:62%}
#mudoX{opacity:1}#btnSonido[aria-pressed=false] #mudoX{opacity:0}
.paused *{animation-play-state:paused!important}
#msg{position:absolute;left:0;right:0;top:34%;text-align:center;z-index:9;font-size:max(26px,6cqw);color:#fff;text-shadow:0 .5cqw 0 rgba(0,0,0,.45),0 0 2cqw rgba(0,0,0,.5);pointer-events:none;opacity:0}
#msg.ok{color:#9dff6b}#msg.bad{color:#ff9a9a}
.cards{display:grid;gap:1cqw;margin:1.4cqw 0 2.4cqw}
.mini{display:flex;align-items:center;gap:1.4cqw;background:#fff;border-radius:99px;padding:.5cqw 2cqw .5cqw .6cqw;color:#1d1a4d;font-size:max(14px,2.3cqw);box-shadow:0 .3cqw 0 rgba(0,0,0,.12)}
.mini .hex{--w:max(46px,6.2cqw);flex:none}.mini span:last-child{flex:1;text-align:left;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.mode-titulo :is(#prog,#marco,#bolsaA,#zonaB,#cinta,#fb,#yeti,#acc,#btnPausa){display:none}
.mode-juego #titulo{display:none}
.hex,.hexw{--c1:#2A9DF4;--c2:#FFC928;filter:drop-shadow(0 0 .55cqw rgba(255,255,255,.5))}.pz{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}.pz.arrastra{cursor:grabbing;z-index:40;filter:drop-shadow(0 1cqw 1cqw rgba(0,0,0,.4))}.pz.sel{outline:max(3px,.4cqw) solid #FFE066;outline-offset:.4cqw;border-radius:1.4cqw}.pz.puesta{cursor:default}
.hu.no{animation:nop .4s}@keyframes nop{25%{translate:-.8cqw 0}75%{translate:.8cqw 0}}.pz:focus-visible,.hu:focus-visible,.btn:focus-visible{outline:3px solid #FFE066;outline-offset:2px}
.btn{background:linear-gradient(90deg,#2A9DF4,#8A4BE0)}
#titulo{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;padding-top:5cqw;text-align:center}
#titulo h1{margin:0;font-size:7cqw;line-height:1;color:#fff;text-shadow:0 .6cqw 0 #2A9DF4,0 1.2cqw 0 #14407a,0 2cqw 2cqw rgba(0,0,0,.3);padding:0 8cqw}
#titulo .sub{margin:.8cqw 0 .6cqw;font-size:max(14px,2.8cqw);color:#14407a}
#yetiT{width:11cqw}#yetiT svg,#yeti svg{width:100%;display:block;filter:drop-shadow(0 .6cqw .6cqw rgba(0,0,0,.3))}
#niv{display:grid;grid-template-columns:repeat(2,1fr);gap:2cqw;margin-top:2.4cqw;width:60%}#niv .btn{font-size:max(15px,2.8cqw);padding:1.4cqw .6cqw;min-height:52px;white-space:nowrap}
#prog{position:absolute;left:2cqw;top:2cqw;z-index:6;color:#fff;background:#14407add;border:max(2px,.3cqw) solid #FFE9A8;border-radius:1.4cqw;padding:.3cqw 1.8cqw;font-size:max(18px,3cqw)}
#marco{position:absolute;left:50%;top:2cqw;translate:-50% 0;z-index:6;display:flex;flex-direction:column;align-items:center;gap:.8cqw}
#tot{min-width:11cqw;text-align:center;background:#35B86A;color:#fff;font-size:max(30px,6.4cqw);border:max(3px,.5cqw) solid #14603A;border-radius:2cqw;padding:0 2cqw;text-shadow:0 .3cqw 0 #14603A;line-height:1.15}
#partes{display:flex;gap:2cqw}.parte{min-width:9cqw;text-align:center;background:#FFE066;color:#5A3A00;font-size:max(24px,4.6cqw);border:max(3px,.5cqw) solid #B8860B;border-radius:1.8cqw;padding:0 1.6cqw}.parte.lleno{background:#9dff6b;border-color:#1E8A44}
#bolsaA{position:absolute;left:12cqw;top:18cqw;width:26cqw;z-index:4;display:flex;flex-direction:column;align-items:center}
.dib{position:relative;width:11cqw}.dib svg{width:100%;display:block}.dib b{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:max(20px,4.2cqw);color:#fff;text-shadow:0 .25cqw 0 #14407a}
.cont{display:flex;flex-wrap:wrap;gap:.3cqw;justify-content:center;margin-top:.6cqw}.mini{display:block;width:4.2cqw;background:none;padding:0;border:0;border-radius:0}.mini svg{width:100%;height:auto;display:block}
#zonaB{position:absolute;left:46cqw;top:18cqw;width:30cqw;z-index:4;display:flex;flex-direction:column;align-items:center;border:max(3px,.4cqw) dashed #14407a;border-radius:2cqw;padding:.6cqw .6cqw 1cqw;background:#ffffff66}
#zonaB .dib svg{opacity:.6;filter:grayscale(.4)}#contB{display:flex;flex-wrap:wrap;gap:.3cqw;justify-content:center;min-height:3.6cqw;margin-top:.4cqw}#contB .pz{width:3.6cqw;height:3.6cqw;padding:0;border:0;background:none}#cuentaWrap{font-size:max(12px,1.9cqw);color:#14407a}
#cinta{position:absolute;left:6cqw;right:6cqw;top:45cqw;z-index:5;display:flex;flex-wrap:wrap;justify-content:center;gap:1.2cqw;padding:1.2cqw 2cqw;background:#7A8496;border:max(3px,.5cqw) solid #4A5266;border-radius:2cqw;min-height:9cqw}
#cinta .pz{width:6.4cqw;height:6.4cqw;padding:0;border:0;background:none}.pz svg{width:100%;height:100%;display:block}
#fb{position:absolute;left:6cqw;right:6cqw;top:39.6cqw;z-index:6;text-align:center;font-size:max(14px,2.4cqw);color:#14407a;min-height:2.6cqw}#fb.ok{color:#146A30}#fb.mal{color:#B8260A}
#yeti{position:absolute;right:2.5cqw;top:16cqw;width:11cqw;z-index:4}
#acc{position:absolute;left:0;right:0;bottom:1.2cqw;z-index:6;display:flex;justify-content:center;gap:2cqw}#acc .btn{font-size:max(14px,2.2cqw);padding:1cqw 3cqw;min-height:48px}#btnListo{background:linear-gradient(180deg,#FF6A5A,#C2260A);font-size:max(18px,3cqw)!important;padding:1cqw 5cqw!important}#btnListo:disabled{opacity:.6}
@media (max-width:700px) and (orientation:portrait){
  :root{--W:min(100vw - 16px,(100dvh - 52px)*.6)}
  #stage{aspect-ratio:3/5}
  #titulo{padding-top:12cqw}#titulo h1{font-size:12cqw;padding:0 3cqw}#titulo .sub{font-size:max(14px,4.4cqw)}#yetiT{width:28cqw}
  #niv{grid-template-columns:1fr;width:70%;gap:3cqw;margin-top:5cqw}#niv .btn{font-size:max(16px,5cqw);padding:2.6cqw 1cqw}
  #prog{top:16cqw;font-size:max(16px,5cqw)}#marco{top:26cqw}#tot{font-size:max(34px,14cqw);min-width:24cqw}.parte{font-size:max(26px,10cqw);min-width:18cqw}
  #bolsaA{left:4cqw;top:68cqw;width:42cqw}.dib{width:22cqw}.dib b{font-size:max(22px,8cqw)}.mini{width:8cqw}
  #zonaB{left:50cqw;top:68cqw;width:46cqw}#contB .pz{width:7cqw;height:7cqw}#contB{min-height:7cqw}#cuentaWrap{font-size:max(12px,3.4cqw)}
  #cinta{left:3cqw;right:3cqw;top:112cqw;gap:2cqw}#cinta .pz{width:13cqw;height:13cqw}
  #fb{left:4cqw;right:4cqw;top:101cqw;font-size:max(13px,3.8cqw);text-align:center}#yeti{display:none}#acc{bottom:3cqw}#acc .btn{font-size:max(14px,3.8cqw);padding:2cqw 4cqw}#btnListo{font-size:max(18px,5cqw)!important}
}
</style>

<body>
<div id="wrap">
<a class="volver" href="/matematicas/#juegos">← Volver a Matemáticas</a>
<div id="stage" class="mode-titulo">
  <div id="world">
    <svg id="scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    <section id="titulo" aria-label="Título"><h1>TIENDA DEL YETI</h1><p class="sub">completa el total con los productos que faltan</p><div id="yetiT" aria-hidden="true"></div><div id="niv" role="group" aria-label="Elige el rango"></div></section>
    <div id="prog" role="status"></div>
    <div id="marco"><div id="tot" aria-label="Total"></div><div id="partes"><span id="pA" class="parte"></span><span id="pB" class="parte">?</span></div></div>
    <div id="bolsaA" aria-hidden="true"></div>
    <div id="zonaB" class="hu" role="button" tabindex="0" aria-label="Bolsa vacía: suelta aquí los productos"><div class="dib" aria-hidden="true"></div><div id="contB"></div><span id="cuentaWrap">En la bolsa: <b id="cuentaB">0</b></span></div>
    <div id="cinta" role="group" aria-label="Banda con productos"></div>
    <div id="fb" role="status" aria-live="assertive"></div><div id="yeti" aria-hidden="true"></div>
    <div id="acc"><button class="btn" id="btnListo" type="button" aria-label="Revisar la bolsa (Enter)">¡Listo!</button><button class="btn" id="btnInicio" type="button">Inicio</button></div>
    <div id="hudR"><button class="hex" id="btnPausa" type="button" aria-label="Pausa"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="16" y="14" width="12" height="36" rx="4" fill="#5b2bb5"/><rect x="36" y="14" width="12" height="36" rx="4" fill="#5b2bb5"/></svg></i></i></i></button><button class="hex" id="btnSonido" type="button" aria-label="Sonido" aria-pressed="false"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M10 25h10l14-11v36L20 39H10z" fill="#2a7de1"/><path d="M41 23c5 5 5 13 0 18M47 16c9 9 9 23 0 32" stroke="#2a7de1" stroke-width="4" fill="none" stroke-linecap="round"/><path id="mudoX" d="M14 50 52 12" stroke="#e02020" stroke-width="6" stroke-linecap="round"/></svg></i></i></i></button></div>
    <div id="msg" role="status" aria-live="assertive"></div>
  </div>
  <div class="overlay" id="ovPausa">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tPausa">
      <span class="pill" id="tPausa">Pausa</span>
      <p>El juego está en pausa.</p>
      <button class="btn" id="btnContinuar" type="button">Continuar</button>
    </div>
  </div>
  
  <div class="overlay" id="fin">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tFin">
      <span class="pill" id="tFin">Fin del juego</span>
      <div id="finExtra"></div>
      <div class="cards"><div class="mini"><span class="hex"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#ico-monedas"/></svg></i></i></i></span><span id="fA">Aciertos</span></div><div class="mini"><span class="hex"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#ico-cofre"/></svg></i></i></i></span><span id="fB">Récord</span></div><div class="mini"><span class="hex"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#ico-libro"/></svg></i></i></i></span><span id="fC">Preguntas</span></div></div>
      <button class="btn" id="btnOtra" type="button">Jugar de nuevo</button>
    </div>
  </div>
</div>

  <defs>
    <radialGradient id="gold" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff3a8"/><stop offset=".55" stop-color="#ffc928"/><stop offset="1" stop-color="#d98a00"/></radialGradient>

<script>
'use strict';
const CANCEL = { cancelado: true };
const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const store = {

const mezclar = (a, azar = Math.random) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(azar() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ent = (azar, lo, hi) => lo + Math.floor(azar() * (hi - lo + 1));
const elige = (a, azar = Math.random) => a[Math.floor(azar() * a.length)];
/* ============================================================
   TIENDA DEL YETI: compone y descompone un número; llena la bolsa con los productos que faltan
   Estructura: 1 config · 2 estado · 3 motor · 4 arte · 5 render · 6 flujo · 7 eventos
   ============================================================ */
/* ====================== 1. CONFIG ====================== */
const CFG = {
  NIVELES: [{ id: 'c5', nombre: 'Hasta 5', min: 2, max: 5 }, { id: 'c10', nombre: 'Hasta 10', min: 3, max: 10 }],
  RONDAS: 8, PRODUCTOS: 10, TOL: 40,   // No confirmado en la ficha: cómo se responde y qué pasa al fallar; aquí se arrastran productos a la bolsa y se confirma con el botón rojo (sin castigo, cuenta como fallo)
  VEL: [{ x: 1, f: 1, ritmo: 1 }], K_REC: 'tie_mejor_', K_MUDO: 'sc_mute'

/* ====================== 2. ESTADO ====================== */
const S = { pantalla: 'titulo', corrida: 0, pausas: new Set(), vel: 0, fin: false, nivel: 0, n: 0, aciertos: 0, q: null, enBolsa: 0, fallo: false, resuelta: false, usados: new Set() };

const vivas = new Set();
const D = ms => RM ? ms * 0.3 : ms * CFG.VEL[S.vel].f;     // duración según velocidad visual
function limpia(el) { el.getAnimations().forEach(a => a.cancel()); }
function anima(el, kf, op = {}) {
  const c = S.corrida;
  const a = el.animate(kf, Object.assign({ fill: 'forwards', easing: 'ease-out' }, op));

}
/* Espera que se detiene mientras el juego está en pausa y se cancela al reiniciar */

/* ============================ 7. AUDIO (Web Audio, sin archivos) ============================ */
const Snd = (() => {
  let ctx = null, master = null, mus = null, mudo = store.get(CFG.K_MUDO) === '1', timer = null, paso = 0, prox = 0;
  const ACORDES = [[220, 261.63, 329.63], [174.61, 220, 261.63], [261.63, 329.63, 392], [196, 246.94, 293.66]]; // La m, Fa, Do, Sol
  const NEG = 60 / 92 / 2;                                         // corchea a 92 bpm

      case 'acierto': [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tono(f, t + i * .07, .18, 'triangle', .2)); break;
      case 'error': tono(190, t, .32, 'sawtooth', .16, 90); tono(140, t + .02, .32, 'square', .08, 70); break;
      case 'tic': tono(1250, t, .04, 'sine', .12); break;

function pintaMudo() {

/* ====================== COMÚN: pausa, sonido, voz ====================== */
function pausar(m) {

  S.pausas.add(m); $('stage').classList.add('paused'); $('ovPausa').classList.add('on');

}
function irA(p) { S.pantalla = p; $('stage').className = 'mode-' + p; }
function pintaMudo() {
  const m = Snd.esMudo(); $('btnSonido').setAttribute('aria-pressed', m);

/* ARRASTRE común: pointer events (ratón y táctil), imán al hueco libre más cercano y alternativa de tocar la pieza y luego el hueco */
const Arrastre = (() => {
  let cfg = null, act = null, sel = null;
  const activo = () => S.pantalla === 'juego' && !S.fin && !S.pausas.size;
  function huecoCerca(p) {
    const r = p.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2; let mejor = null, d0 = 1e9, afin = null, d1 = 1e9;

  }

  }

})();

/* ====================== 3. MOTOR ====================== */
const Motor = {
  /* crearRonda({min, max, usados, azar}) -> {total, conocida, falta}: total = conocida + falta, con ambas partes de al menos 1; sin repetir */
  crearRonda({ min = 2, max = 10, usados = new Set(), azar = Math.random } = {}) {
    for (let i = 0; i < 400; i++) {
      const total = min + Math.floor(azar() * (max - min + 1)), conocida = 1 + Math.floor(azar() * (total - 1)), k = total + '/' + conocida; if (usados.has(k) && i < 300) continue; usados.add(k);
      return { total, conocida, falta: total - conocida };
    }
  },
  /* revisa(q, cantidad) -> true si la bolsa tiene justo los productos que faltan */
  revisa(q, cantidad) { return cantidad === q.falta; }
};

/* ====================== 4. ARTE ====================== */

  <rect y="820" width="1600" height="180" fill="#8A5A2E"/><path d="M0 820H1600" stroke="#5A3A1A" stroke-width="8"/>`;

/* ====================== 5. RENDER ====================== */

/* ====================== 6. FLUJO ====================== */
function suelta(p, h) {   // la bolsa acepta cualquier producto; el conteo se revisa con el botón
  if (S.resuelta) return false; $('contB').appendChild(p); p.classList.add('enbolsa'); S.enBolsa++; pintaCuenta(); Snd.sfx('clic'); return true;
}
function devuelve(p) { if (S.resuelta || !p.classList.contains('enbolsa')) return; p.classList.remove('enbolsa', 'sel'); $('cinta').appendChild(p); S.enBolsa--; pintaCuenta(); Snd.sfx('clic'); }
function confirma() {
  if (S.pantalla !== 'juego' || S.resuelta || S.fin || S.pausas.size) return; const q = S.q;
  if (S.enBolsa === 0) { $('fb').className = 'mal'; $('fb').textContent = 'Pon productos en la bolsa vacía.'; return; }
  if (Motor.revisa(q, S.enBolsa)) {
    S.resuelta = true; if (!S.fallo) S.aciertos++; Snd.sfx('acierto'); $('pB').textContent = q.falta; $('pB').classList.add('lleno'); $('btnListo').disabled = true; $('yeti').innerHTML = yetiSVG(true);

    const c = S.corrida; esperar(1800).then(() => { if (c === S.corrida) siguiente(); }).catch(e => { if (e !== CANCEL) throw e; });
  } else {
    S.fallo = true; Snd.sfx('error'); const n = S.enBolsa; $('fb').className = 'mal'; $('fb').textContent = 'Buen intento: ' + q.conocida + ' + ' + n + ' = ' + (q.conocida + n) + ', y necesitamos ' + q.total + '.';
    document.querySelectorAll('#contB .pz').forEach(p => { p.classList.remove('enbolsa'); $('cinta').appendChild(p); }); S.enBolsa = 0; pintaCuenta();
  }
}
function siguiente() {
  if (S.fin || !S.resuelta) return; S.n++; if (S.n >= CFG.RONDAS) return termina(); const N = CFG.NIVELES[S.nivel]; S.q = Motor.crearRonda({ min: N.min, max: N.max, usados: S.usados }); S.fallo = false; pintaRonda();
}
function termina() {
  S.fin = true; const k = CFG.K_REC + CFG.NIVELES[S.nivel].id, mej = parseInt(store.get(k) || '0', 10) || 0, nuevo = S.aciertos > mej; if (nuevo) store.set(k, String(S.aciertos));
  mostrarFin(S.aciertos === CFG.RONDAS ? '¡Todas a la primera!' : '¡Buenas compras!', 'A la primera: ' + S.aciertos + ' de ' + CFG.RONDAS, 'Récord: ' + Math.max(mej, S.aciertos) + (nuevo ? ' ¡Nuevo!' : ''), CFG.NIVELES[S.nivel].nombre, true);
}
function nuevaPartida(i) {
  S.nivel = i; S.corrida++; S.pausas.clear(); S.fin = false; S.n = 0; S.aciertos = 0; S.fallo = false; S.usados = new Set(); const N = CFG.NIVELES[i]; S.q = Motor.crearRonda({ min: N.min, max: N.max, usados: S.usados });
  $('fin').classList.remove('on'); $('ovPausa').classList.remove('on'); $('stage').classList.remove('paused'); irA('juego'); pintaRonda();
}
function aTitulo() { S.corrida++; S.fin = false; irA('titulo'); $('fin').classList.remove('on'); setTimeout(() => { const b = document.querySelector('.nivbtn'); if (b) b.focus(); }, 30); }

/* ====================== 7. EVENTOS ====================== */
(function iniciar() {
  $('scene').innerHTML = tiendaSVG(); $('yeti').innerHTML = yetiSVG(false); $('yetiT').innerHTML = yetiSVG(true); pintaMudo();
  $('niv').innerHTML = CFG.NIVELES.map((v, i) => `<button class="btn nivbtn" type="button" data-n="${i}">${v.nombre}</button>`).join('');
  $('niv').addEventListener('click', e => { const b = e.target.closest('.nivbtn'); if (b) { Snd.sfx('clic'); nuevaPartida(+b.dataset.n); } });
  Arrastre.iniciar({ raiz: $('cinta'), zonaHuecos: $('zonaB'), huecos: () => [$('zonaB')], tol: CFG.TOL, suelta });
  $('contB').addEventListener('click', e => { const p = e.target.closest('.pz'); if (p) { e.stopPropagation(); devuelve(p); } });
  $('btnListo').addEventListener('click', confirma);
  $('btnOtra').addEventListener('click', () => { Snd.sfx('clic'); aTitulo(); }); $('btnInicio').addEventListener('click', () => { Snd.sfx('clic'); aTitulo(); });
  iniciaComun((e, k) => { if (S.pantalla === 'juego' && k === 'enter') { e.preventDefault(); confirma(); } });
  window.__com = { S, CFG, Motor, suelta, confirma };   // gancho de pruebas
})();
</script>
