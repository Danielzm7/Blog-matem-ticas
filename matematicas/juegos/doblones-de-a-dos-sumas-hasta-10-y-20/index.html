<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Doblones de a dos: elige dos doblones que sumen el objetivo. Para niños de 6 a 9 años.">
<title>Doblones de a dos: sumas hasta 10 y 20</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#12082e;color:var(--ink);
  font-family:'Fredoka','Nunito','Baloo 2','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;font-weight:700}
button{font:inherit;color:inherit}
#wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:6px}
.volver{align-self:center;color:#cfe3fb;text-decoration:none;font-size:15px;min-height:28px;display:inline-flex;align-items:center;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.08)}
.volver:hover{background:rgba(255,255,255,.18);color:#fff}
#stage{position:relative;width:var(--W);aspect-ratio:16/10;container-type:inline-size;overflow:hidden;
  border-radius:calc(var(--W)*.022);background:#2b1456;isolation:isolate;
  box-shadow:0 calc(var(--W)*.015) calc(var(--W)*.05) rgba(0,0,0,.55);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#world{position:absolute;inset:0}
#scene{position:absolute;left:0;top:0;width:100%;height:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:max(3px,.4cqw) solid #fff;outline-offset:max(2px,.3cqw)}

/* ---------- Marcos hexagonales con borde doble ---------- */
.hex{--c1:#2a7de1;--c2:#4fc3ff;position:relative;display:block;width:var(--w,7cqw);aspect-ratio:1/.866;
  filter:drop-shadow(0 0 .55cqw rgba(79,195,255,.65));border:0;background:none;padding:0;margin:0}
.hex>i,.hex>i>i,.hex>i>i>i{position:absolute;display:block;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.hex>i{inset:0;background:linear-gradient(160deg,var(--c2),var(--c1))}
.hex>i>i{inset:7%;background:#fff}
.hex>i>i>i{inset:7%;background:linear-gradient(180deg,#f6faff,#c9defa);display:grid;place-items:center;overflow:hidden}
.hex svg{width:78%;height:78%;display:block}
button.hex{cursor:pointer;transition:transform .15s,filter .15s}
button.hex:hover{transform:translateY(-.3cqw) scale(1.05);filter:drop-shadow(0 0 .9cqw rgba(255,255,255,.9))}
button.hex:active{transform:scale(.96)}
.hexw{--c1:#2a7de1;--c2:#4fc3ff;position:relative;display:block;height:6.4cqw;min-width:14.5cqw;
  filter:drop-shadow(0 0 .55cqw rgba(79,195,255,.65))}
.hexw>i,.hexw>i>i,.hexw>i>i>i{position:absolute;display:block;clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%)}
.hexw>i{inset:0;background:linear-gradient(160deg,var(--c2),var(--c1))}
.hexw>i>i{inset:7%;background:#fff}
.hexw>i>i>i{inset:7%;background:linear-gradient(180deg,#f6faff,#c9defa);display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.05;padding:0 .6cqw}
.hexw small{font-size:max(10px,1.3cqw);color:#4a5a8c;letter-spacing:.02em;font-weight:700}
.hexw b{font-size:max(13px,1.95cqw);color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}


/* ---------- Modales ---------- */
.overlay{position:absolute;inset:0;z-index:20;display:none;place-items:center;background:rgba(14,6,40,.62)}
.overlay.on{display:grid}
.modal{position:relative;width:62cqw;border-radius:2.4cqw;padding:5cqw 3cqw 2.6cqw;text-align:center;
  background:linear-gradient(180deg,#f8fcff,#c9e0fb);border:max(3px,.45cqw) solid #fff;box-shadow:0 0 0 max(3px,.5cqw) #2a7de1,0 1cqw 3cqw rgba(0,0,0,.55)}
.modal .pill{position:absolute;left:50%;top:0;transform:translate(-50%,-50%)}
.modal p{margin:.6cqw 0;font-size:max(14px,2.3cqw);line-height:1.3;color:var(--ink)}
.ej{margin:1.4cqw auto 1.8cqw;padding:1.2cqw 2cqw;border-radius:1.6cqw;background:#fff;border:.35cqw dashed #5b2bb5;display:inline-block}
.ej b{color:#5b2bb5}
#dim{position:absolute;inset:0;z-index:12;background:rgba(10,4,30,.74);opacity:0;pointer-events:none;transition:opacity .6s}
#dim.on{opacity:1}
#fin{z-index:15;background:transparent}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqw;margin:1.4cqw 0 2cqw}
.mini{display:flex;flex-direction:column;align-items:center;gap:.8cqw}
.mini .hex{--w:72%}
.mini .hex svg{width:80%;height:80%}
.mini span{font-size:max(12px,1.9cqw);line-height:1.15;color:var(--ink)}
.mini b{display:block;font-size:max(16px,3cqw);color:var(--p2)}
#cuenta{position:absolute;inset:0;z-index:11;display:none;place-items:center;pointer-events:none}
#cuenta.on{display:grid}
#cuenta span{font-size:24cqw;color:#fff;text-shadow:0 1cqw 0 #5b2bb5,0 0 4cqw rgba(79,195,255,.9);animation:cnt .9s ease-out both}
@keyframes cnt{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(.9);opacity:.9}}
.rays{animation:spin 12s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}


.pill{background:linear-gradient(180deg,#8a55ea,#4a1fa0);color:#fff;border-radius:99px;padding:.6cqw 3.2cqw;font-size:max(15px,2.5cqw);
  box-shadow:0 .4cqw 0 #2b1456,inset 0 .2cqw 0 rgba(255,255,255,.35);text-shadow:0 .2cqw 0 rgba(0,0,0,.35);display:inline-block;white-space:nowrap}
.btn{border:0;border-radius:99px;cursor:pointer;min-height:48px;padding:1cqw 6cqw;color:#fff;font-size:max(17px,2.8cqw);letter-spacing:.06em;
  background:linear-gradient(90deg,#2a7de1,#7a3be0);box-shadow:0 .5cqw 0 #1b2f84,0 1cqw 2cqw rgba(0,0,0,.35),inset 0 .2cqw 0 rgba(255,255,255,.35);
  text-shadow:0 .2cqw 0 rgba(0,0,0,.3);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.12);transform:translateY(-.3cqw)}
.btn:active{transform:translateY(.3cqw)}


#stage{background:#0b1a3a}
:root{--W:min(100vw - 16px,(100dvh - 52px)*1.6)}
#scene{position:absolute;left:0;top:0;width:100%;height:100%}
.volver{align-self:center;color:#cfe3fb;text-decoration:none;font-size:15px;min-height:28px;display:inline-flex;align-items:center;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.08)}
.volver:hover{background:rgba(255,255,255,.18);color:#fff}
#wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:6px}
:focus-visible{outline:max(3px,.4cqw) solid #fff;outline-offset:max(2px,.3cqw)}
.tw{animation:tw 3.2s ease-in-out infinite}@keyframes tw{50%{opacity:.25}}
#hudR{position:absolute;right:2cqw;top:2cqw;display:flex;align-items:center;gap:1.4cqw;z-index:8}
#hudR .hex{--w:max(56px,7cqw)}#hudR .hex svg{width:62%;height:62%}
#mudoX{opacity:1}#btnSonido[aria-pressed=false] #mudoX{opacity:0}
.paused *{animation-play-state:paused!important}
#msg{position:absolute;left:0;right:0;top:34%;text-align:center;z-index:9;font-size:max(26px,6cqw);color:#fff;text-shadow:0 .5cqw 0 rgba(0,0,0,.45),0 0 2cqw rgba(0,0,0,.5);pointer-events:none;opacity:0}
#msg.ok{color:#9dff6b}#msg.bad{color:#ff9a9a}
.cards{display:grid;gap:1cqw;margin:1.4cqw 0 2.4cqw}
.mini{display:flex;align-items:center;gap:1.4cqw;background:#fff;border-radius:99px;padding:.5cqw 2cqw .5cqw .6cqw;color:#1d1a4d;font-size:max(14px,2.3cqw);box-shadow:0 .3cqw 0 rgba(0,0,0,.12)}
.mini .hex{--w:max(46px,6.2cqw);flex:none}.mini span:last-child{flex:1;text-align:left;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.mode-titulo :is(#prog,#pts,#obj,#tab,#fb,#cang,#acc,#btnPausa){display:none}
.mode-juego #titulo{display:none}
.hex,.hexw{--c1:#B8860B;--c2:#FFE066;filter:drop-shadow(0 0 .55cqw rgba(255,255,255,.5))}
.btn{background:linear-gradient(90deg,#2A9DF4,#35B86A)}
#titulo{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;padding-top:3cqw;text-align:center}
#titulo h1{margin:0;font-size:6.6cqw;line-height:1;color:#FFF3B0;letter-spacing:.02em;text-shadow:0 .6cqw 0 #B8860B,0 1.2cqw 0 #0A2E6A,0 2cqw 2cqw rgba(0,0,0,.35);padding:0 8cqw}
#titulo .sub{margin:.8cqw 0 .6cqw;font-size:max(14px,2.8cqw);color:#fff}
#cangT{width:10cqw}#cangT svg,#cang svg{width:100%;display:block;filter:drop-shadow(0 .6cqw .6cqw rgba(0,0,0,.35))}
#niv{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;margin-top:2.4cqw;width:90%}#niv .btn{font-size:max(15px,2.8cqw);padding:1.4cqw .6cqw;min-height:52px;white-space:nowrap}
#prog,#pts{position:absolute;left:2cqw;z-index:6;color:#fff;background:#0A2E6Add;border:max(2px,.3cqw) solid #FFF3B0;border-radius:1.4cqw;padding:.3cqw 1.6cqw;font-size:max(14px,2.4cqw)}#prog{top:2cqw}#pts{top:8cqw}
#obj{position:absolute;left:50%;top:2cqw;translate:-50% 0;z-index:6;display:flex;flex-direction:column;align-items:center;line-height:1;background:#fff;border:max(3px,.5cqw) solid #202D4A;border-radius:2cqw;padding:.8cqw 3cqw;box-shadow:0 .7cqw 0 #202D4A}
#obj small{font-size:max(12px,2cqw);color:#4A5A7A}#obj strong{font-size:max(30px,7cqw);color:#202D4A}
#tab{position:absolute;left:14cqw;right:12cqw;top:21cqw;z-index:5;display:grid;grid-template-columns:repeat(6,1fr);gap:2cqw;justify-items:center}
.pz{position:relative;width:11cqw;min-width:48px;aspect-ratio:1;padding:0;border:0;background:none;cursor:pointer;display:grid;place-items:center;transition:scale .25s,opacity .25s;color:#202D4A}
.pz svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 .4cqw .3cqw rgba(0,0,0,.35))}.pz b{position:relative;color:#fff;font-size:max(18px,4.4cqw);text-shadow:0 .2cqw 0 #202D4A,0 0 .6cqw #202D4A;line-height:1}
.pz.sel{scale:1.18;outline:max(3px,.4cqw) solid #FFF3B0;outline-offset:.3cqw;border-radius:2cqw}.pz.fuera{scale:0;opacity:0;visibility:hidden;transition:scale .3s,opacity .3s,visibility 0s .3s}
.pz.no{animation:nop .4s}@keyframes nop{25%{translate:-.8cqw 0}75%{translate:.8cqw 0}}.pz.pista{animation:pis .7s ease-in-out infinite alternate}@keyframes pis{to{scale:1.15;filter:brightness(1.3)}}
.pz:focus-visible,.btn:focus-visible{outline:3px solid #FFF3B0;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.pz,.pz.fuera{transition:none}.pz.pista{animation:none;outline:3px solid #FFF3B0}}
#fb{position:absolute;left:14cqw;right:14cqw;top:49cqw;z-index:6;text-align:center;font-size:max(15px,2.7cqw);color:#fff;text-shadow:0 .3cqw 0 #0A2E6A;min-height:3cqw}#fb.ok{color:#9dff6b}#fb.mal{color:#FFD36B}
#cang{position:absolute;left:2.5cqw;top:24cqw;width:9cqw;z-index:4}
#acc{position:absolute;left:0;right:0;bottom:1.5cqw;z-index:6;display:flex;justify-content:center;gap:2cqw}#acc .btn{font-size:max(14px,2.3cqw);padding:1cqw 3cqw;min-height:48px}
@media (max-width:700px) and (orientation:portrait){
  :root{--W:min(100vw - 16px,(100dvh - 52px)*.6)}
  #stage{aspect-ratio:3/5}
  #titulo{padding-top:8cqw}#titulo h1{font-size:11cqw;padding:0 3cqw}#titulo .sub{font-size:max(14px,4.4cqw)}#cangT{width:26cqw}
  #niv{grid-template-columns:1fr;width:70%;gap:3cqw;margin-top:5cqw}#niv .btn{font-size:max(16px,5cqw);padding:2.6cqw 1cqw}
  #prog{top:16cqw;font-size:max(14px,4cqw)}#pts{top:16cqw;left:auto;right:4cqw;font-size:max(13px,3.4cqw)}
  #obj{top:26cqw;padding:1.4cqw 6cqw}#obj small{font-size:max(13px,3.6cqw)}#obj strong{font-size:max(36px,13cqw)}
  #tab{left:5cqw;right:5cqw;top:62cqw;grid-template-columns:repeat(4,1fr);gap:3cqw 3cqw}.pz{width:19cqw}.pz b{font-size:max(20px,7cqw)}
  #fb{left:4cqw;right:4cqw;top:134cqw;font-size:max(14px,4.2cqw)}#cang{left:4cqw;top:auto;bottom:3cqw;width:20cqw}
  #acc{left:26cqw;right:2cqw;bottom:4cqw;flex-wrap:wrap;gap:2cqw}#acc .btn{font-size:max(14px,3.8cqw);padding:2cqw 4cqw}
}
</style>
</head>
<body>
<div id="wrap">
<a class="volver" href="/matematicas/#juegos">← Volver a Matemáticas</a>
<div id="stage" class="mode-titulo">
  <div id="world">
    <svg id="scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    <section id="titulo" aria-label="Título"><h1>DOBLONES DE A DOS</h1><p class="sub">elige 2 doblones que sumen el objetivo</p><div id="cangT" aria-hidden="true"></div><div id="niv" role="group" aria-label="Elige una modalidad"></div></section>
    <div id="prog" role="status"></div><div id="pts" role="status" aria-live="polite"></div>

    <div id="hudR"><button class="hex" id="btnPausa" type="button" aria-label="Pausa"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="16" y="14" width="12" height="36" rx="4" fill="#5b2bb5"/><rect x="36" y="14" width="12" height="36" rx="4" fill="#5b2bb5"/></svg></i></i></i></button><button class="hex" id="btnSonido" type="button" aria-label="Sonido" aria-pressed="false"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M10 25h10l14-11v36L20 39H10z" fill="#2a7de1"/><path d="M41 23c5 5 5 13 0 18M47 16c9 9 9 23 0 32" stroke="#2a7de1" stroke-width="4" fill="none" stroke-linecap="round"/><path id="mudoX" d="M14 50 52 12" stroke="#e02020" stroke-width="6" stroke-linecap="round"/></svg></i></i></i></button></div>

      <div class="cards"><div class="mini"><span class="hex"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#ico-monedas"/></svg></i></i></i></span><span id="fA">Aciertos</span></div><div class="mini"><span class="hex"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#ico-cofre"/></svg></i></i></i></span><span id="fB">Récord</span></div><div class="mini"><span class="hex"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#ico-libro"/></svg></i></i></i></span><span id="fC">Preguntas</span></div></div>
      <button class="btn" id="btnOtra" type="button">Jugar de nuevo</button>

</div>

<script>
'use strict';
const CANCEL = { cancelado: true };
const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } }
};
const mezclar = (a, azar = Math.random) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(azar() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ent = (azar, lo, hi) => lo + Math.floor(azar() * (hi - lo + 1));
const elige = (a, azar = Math.random) => a[Math.floor(azar() * a.length)];
/* ============================================================
   GEMAS Y DOBLONES: elige las piezas que suman el número objetivo y vacía el tablero
   Un solo motor para tres juegos (MODO: galeon = 2 gemas, doble = 2 doblones, triple = 3 doblones)
   Estructura: 1 config · 2 estado · 3 motor · 4 arte · 5 render · 6 flujo · 7 eventos
   ============================================================ */
/* ====================== 1. CONFIG ====================== */
const MODO = 'doble';   // 'galeon' | 'doble' | 'triple'
const CFG = {
  PICK: MODO === 'triple' ? 3 : 2, PIEZA: MODO === 'galeon' ? 'gema' : 'doblón',

  const ACORDES = [[220, 261.63, 329.63], [174.61, 220, 261.63], [261.63, 329.63, 392], [196, 246.94, 293.66]]; // La m, Fa, Do, Sol

    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = b; f.type = 'bandpass'; f.frequency.value = 900;
    g.gain.value = v; s.connect(f); f.connect(g); g.connect(master); s.start(t);

      case 'error': tono(190, t, .32, 'sawtooth', .16, 90); tono(140, t + .02, .32, 'square', .08, 70); break;

/* ====================== 3. MOTOR ====================== */
const Motor = {
  /* crearNivel({variante, nivel, azar}) -> {t, k, gemas:[{id,v}]}: arma grupos que suman el objetivo y los mezcla; siempre tiene solución */
  crearNivel({ variante = 0, nivel = 0, azar = Math.random } = {}) {
    const N = CFG.VARIANTES[variante].niv[nivel], k = CFG.PICK, vals = [];
    for (let g = 0; g < N.g; g++) {
      let resto = N.t; for (let j = 0; j < k - 1; j++) { const max = resto - (k - 1 - j), v = 1 + Math.floor(azar() * Math.min(max, 12)); vals.push(v); resto -= v; }
      vals.push(resto);
    }
    return { t: N.t, k, gemas: mezclar(vals, azar).map((v, i) => ({ id: i, v })) };
  }
};
/* resolver(valores, k, t) -> grupos de posiciones que vacían el tablero (o null) */
Motor.resolver = function (vals, k, t) {
  const rec = rest => {
    if (!rest.length) return [];
    const a = rest[0], otros = rest.slice(1);
    const comb = (pos, cuantos, suma, acc) => {
      if (cuantos === 0) { if (suma !== 0) return null; const sobra = otros.filter(o => !acc.includes(o)), s = rec(sobra); return s ? [[a, ...acc], ...s] : null; }
      for (let j = pos; j < otros.length; j++) { const v = vals[otros[j]]; if (v > suma) continue; const r = comb(j + 1, cuantos - 1, suma - v, [...acc, otros[j]]); if (r) return r; }
      return null;
    };
    return comb(0, CFG.PICK - 1, t - vals[a], []);
  };
  return rec(vals.map((_, i) => i));
};
