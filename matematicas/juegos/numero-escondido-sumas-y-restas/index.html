<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Número escondido: encuentra el número que falta en sumas y restas y completa la cuenta del puesto de jugos. Para niños de 6 a 9 años.">
<title>Número escondido: sumas y restas misteriosas</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#12082e;color:var(--ink);
  font-family:'Fredoka','Nunito','Baloo 2','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;font-weight:700}
button{font:inherit;color:inherit}
#wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:6px}
.volver{align-self:center;color:#cfe3fb;text-decoration:none;font-size:15px;min-height:28px;display:inline-flex;align-items:center;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.08)}
.volver:hover{background:rgba(255,255,255,.18);color:#fff}
#stage{position:relative;width:var(--W);aspect-ratio:16/10;container-type:inline-size;overflow:hidden;
  border-radius:calc(var(--W)*.022);background:#2b1456;isolation:isolate;
  box-shadow:0 calc(var(--W)*.015) calc(var(--W)*.05) rgba(0,0,0,.55);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#world{position:absolute;inset:0}
#scene{position:absolute;left:0;top:0;width:100%;height:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:max(3px,.4cqw) solid #fff;outline-offset:max(2px,.3cqw)}

/* ---------- Marcos hexagonales con borde doble ---------- */
.hex{--c1:#2a7de1;--c2:#4fc3ff;position:relative;display:block;width:var(--w,7cqw);aspect-ratio:1/.866;
  filter:drop-shadow(0 0 .55cqw rgba(79,195,255,.65));border:0;background:none;padding:0;margin:0}
.hex>i,.hex>i>i,.hex>i>i>i{position:absolute;display:block;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.hex>i{inset:0;background:linear-gradient(160deg,var(--c2),var(--c1))}
.hex>i>i{inset:7%;background:#fff}
.hex>i>i>i{inset:7%;background:linear-gradient(180deg,#f6faff,#c9defa);display:grid;place-items:center;overflow:hidden}
.hex svg{width:78%;height:78%;display:block}
button.hex{cursor:pointer;transition:transform .15s,filter .15s}
button.hex:hover{transform:translateY(-.3cqw) scale(1.05);filter:drop-shadow(0 0 .9cqw rgba(255,255,255,.9))}
button.hex:active{transform:scale(.96)}
.hexw{--c1:#2a7de1;--c2:#4fc3ff;position:relative;display:block;height:6.4cqw;min-width:14.5cqw;
  filter:drop-shadow(0 0 .55cqw rgba(79,195,255,.65))}
.hexw>i,.hexw>i>i,.hexw>i>i>i{position:absolute;display:block;clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%)}
.hexw>i{inset:0;background:linear-gradient(160deg,var(--c2),var(--c1))}
.hexw>i>i{inset:7%;background:#fff}
.hexw>i>i>i{inset:7%;background:linear-gradient(180deg,#f6faff,#c9defa);display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.05;padding:0 .6cqw}
.hexw small{font-size:max(10px,1.3cqw);color:#4a5a8c;letter-spacing:.02em;font-weight:700}
.hexw b{font-size:max(13px,1.95cqw);color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}


/* ---------- Modales ---------- */
.overlay{position:absolute;inset:0;z-index:20;display:none;place-items:center;background:rgba(14,6,40,.62)}
.overlay.on{display:grid}
.modal{position:relative;width:62cqw;border-radius:2.4cqw;padding:5cqw 3cqw 2.6cqw;text-align:center;
  background:linear-gradient(180deg,#f8fcff,#c9e0fb);border:max(3px,.45cqw) solid #fff;box-shadow:0 0 0 max(3px,.5cqw) #2a7de1,0 1cqw 3cqw rgba(0,0,0,.55)}
.modal .pill{position:absolute;left:50%;top:0;transform:translate(-50%,-50%)}
.modal p{margin:.6cqw 0;font-size:max(14px,2.3cqw);line-height:1.3;color:var(--ink)}
.ej{margin:1.4cqw auto 1.8cqw;padding:1.2cqw 2cqw;border-radius:1.6cqw;background:#fff;border:.35cqw dashed #5b2bb5;display:inline-block}
.ej b{color:#5b2bb5}
#dim{position:absolute;inset:0;z-index:12;background:rgba(10,4,30,.74);opacity:0;pointer-events:none;transition:opacity .6s}
#dim.on{opacity:1}
#fin{z-index:15;background:transparent}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqw;margin:1.4cqw 0 2cqw}
.mini{display:flex;flex-direction:column;align-items:center;gap:.8cqw}
.mini .hex{--w:72%}
.mini .hex svg{width:80%;height:80%}
.mini span{font-size:max(12px,1.9cqw);line-height:1.15;color:var(--ink)}
.mini b{display:block;font-size:max(16px,3cqw);color:var(--p2)}
#cuenta{position:absolute;inset:0;z-index:11;display:none;place-items:center;pointer-events:none}
#cuenta.on{display:grid}
#cuenta span{font-size:24cqw;color:#fff;text-shadow:0 1cqw 0 #5b2bb5,0 0 4cqw rgba(79,195,255,.9);animation:cnt .9s ease-out both}
@keyframes cnt{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(.9);opacity:.9}}
.rays{animation:spin 12s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}


.pill{background:linear-gradient(180deg,#8a55ea,#4a1fa0);color:#fff;border-radius:99px;padding:.6cqw 3.2cqw;font-size:max(15px,2.5cqw);
  box-shadow:0 .4cqw 0 #2b1456,inset 0 .2cqw 0 rgba(255,255,255,.35);text-shadow:0 .2cqw 0 rgba(0,0,0,.35);display:inline-block;white-space:nowrap}
.btn{border:0;border-radius:99px;cursor:pointer;min-height:48px;padding:1cqw 6cqw;color:#fff;font-size:max(17px,2.8cqw);letter-spacing:.06em;
  background:linear-gradient(90deg,#2a7de1,#7a3be0);box-shadow:0 .5cqw 0 #1b2f84,0 1cqw 2cqw rgba(0,0,0,.35),inset 0 .2cqw 0 rgba(255,255,255,.35);
  text-shadow:0 .2cqw 0 rgba(0,0,0,.3);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.12);transform:translateY(-.3cqw)}
.btn:active{transform:translateY(.3cqw)}


#stage{background:#0b1a3a}
:root{--W:min(100vw - 16px,(100dvh - 52px)*1.6)}
#scene{position:absolute;left:0;top:0;width:100%;height:100%}
.volver{align-self:center;color:#cfe3fb;text-decoration:none;font-size:15px;min-height:28px;display:inline-flex;align-items:center;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.08)}
.volver:hover{background:rgba(255,255,255,.18);color:#fff}
#wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:6px}
:focus-visible{outline:max(3px,.4cqw) solid #fff;outline-offset:max(2px,.3cqw)}
.tw{animation:tw 3.2s ease-in-out infinite}@keyframes tw{50%{opacity:.25}}
#hudR{position:absolute;right:2cqw;top:2cqw;display:flex;align-items:center;gap:1.4cqw;z-index:8}
#hudR .hex{--w:max(56px,7cqw)}#hudR .hex svg{width:62%;height:62%}
#mudoX{opacity:1}#btnSonido[aria-pressed=false] #mudoX{opacity:0}
.paused *{animation-play-state:paused!important}
#msg{position:absolute;left:0;right:0;top:34%;text-align:center;z-index:9;font-size:max(26px,6cqw);color:#fff;text-shadow:0 .5cqw 0 rgba(0,0,0,.45),0 0 2cqw rgba(0,0,0,.5);pointer-events:none;opacity:0}
#msg.ok{color:#9dff6b}#msg.bad{color:#ff9a9a}
.cards{display:grid;gap:1cqw;margin:1.4cqw 0 2.4cqw}
.mini{display:flex;align-items:center;gap:1.4cqw;background:#fff;border-radius:99px;padding:.5cqw 2cqw .5cqw .6cqw;color:#1d1a4d;font-size:max(14px,2.3cqw);box-shadow:0 .3cqw 0 rgba(0,0,0,.12)}
.mini .hex{--w:max(46px,6.2cqw);flex:none}.mini span:last-child{flex:1;text-align:left;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.mode-titulo :is(#cab,#opts,#mostrador,#cama,#vasos,#btnInicio,#btnPausa){display:none}
.mode-juego #titulo{display:none}
.hex,.hexw{--c1:#E8362F;--c2:#FFC928;filter:drop-shadow(0 0 .55cqw rgba(255,255,255,.5))}
.btn{background:linear-gradient(90deg,#E8362F,#F07A1A)}
#titulo{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;padding-top:4cqw;text-align:center}
#titulo h1{margin:0;font-size:6.6cqw;line-height:1;color:#fff;letter-spacing:.02em;text-shadow:0 .6cqw 0 #E8362F,0 1.2cqw 0 #7A1010,0 2cqw 2cqw rgba(0,0,0,.3)}
#titulo .sub{margin:1.2cqw 0 1cqw;font-size:max(14px,2.6cqw);color:#7A1010;background:#FFF3DE;border:max(2px,.3cqw) solid #7A1010;border-radius:2cqw;padding:.2cqw 2.4cqw;position:relative;z-index:2}
#camaT{width:15cqw}#camaT svg,#cama svg{width:100%;display:block;filter:drop-shadow(0 .6cqw .6cqw rgba(0,0,0,.3))}
#niv{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqw;margin-top:2cqw;width:80%}#niv .btn{font-size:max(14px,2.4cqw);padding:1.2cqw 1cqw;min-height:48px;white-space:nowrap}
#cab{position:absolute;left:2cqw;top:2cqw;z-index:6;display:flex;flex-direction:column;gap:.5cqw;align-items:flex-start}
#cab span{background:#7A1010dd;color:#fff;font-size:max(13px,2.2cqw);padding:.3cqw 1.5cqw;border-radius:1.2cqw}
#opts{position:absolute;left:50%;top:6cqw;transform:translateX(-50%);z-index:6;display:flex;gap:3cqw;background:#FF9AB8;border:max(3px,.5cqw) solid #7A1010;border-radius:2cqw;padding:1.4cqw 3cqw;box-shadow:0 .8cqw 0 #7A1010}
.op{position:relative;width:11cqw;min-width:60px;height:9cqw;min-height:56px;border-radius:1.6cqw;border:max(3px,.4cqw) solid #14407a;background:linear-gradient(180deg,#7BC8FF,#2A7DE1);color:#fff;font-size:max(22px,4.6cqw);cursor:pointer;padding:0}
.op .k{position:absolute;right:.8cqw;bottom:.1cqw;font-size:max(11px,1.5cqw);opacity:.7}
.op.mal{animation:no .35s;background:linear-gradient(180deg,#FFB0A0,#E8362F)}@keyframes no{25%{translate:-1cqw 0}75%{translate:1cqw 0}}
#mostrador{position:absolute;left:0;right:0;top:30cqw;z-index:5;display:flex;justify-content:center}
#ecu{display:flex;align-items:center;gap:1.6cqw;font-size:max(28px,8cqw);color:#fff;text-shadow:0 .4cqw 0 #4A2410;background:#4A2410cc;border-radius:2cqw;padding:.4cqw 3cqw}
.hueco{min-width:11cqw;text-align:center;background:#FFD35A;color:#7A1010;border-radius:1.4cqw;text-shadow:none;border:max(3px,.4cqw) dashed #7A1010;padding:0 1cqw}.hueco.listo{background:#8EE07A;border-style:solid;color:#0F4A26}
#cama{position:absolute;right:6cqw;top:41cqw;width:13cqw;z-index:4}
#vasos{position:absolute;left:4cqw;bottom:2.4cqw;z-index:4;display:flex;gap:.6cqw}#vasos i{width:4cqw;display:block;opacity:.55}#vasos i.lleno{opacity:1}#vasos svg{width:100%;display:block}#vasos i:not(.lleno) .jugo{opacity:0}
#btnInicio{position:absolute;right:2cqw;bottom:2cqw;z-index:6;font-size:max(14px,2.2cqw);padding:1cqw 3cqw;min-height:48px}
@media (max-width:700px) and (orientation:portrait){
  :root{--W:min(100vw - 16px,(100dvh - 52px)*.6)}
  #stage{aspect-ratio:3/5}
  #titulo{padding-top:10cqw}#titulo h1{font-size:11cqw}#titulo .sub{font-size:max(14px,4.4cqw);margin:2cqw 6cqw 4cqw}#camaT{width:40cqw}
  #niv{grid-template-columns:repeat(2,1fr);gap:3cqw;width:88%;margin-top:6cqw}#niv .btn{font-size:max(15px,4.4cqw);padding:2.4cqw 1cqw}
  #cab{top:16cqw;flex-direction:row;gap:2cqw}#cab span{font-size:max(12px,3.8cqw)}
  #opts{top:30cqw;gap:3cqw;padding:3cqw 4cqw}.op{width:22cqw;height:18cqw;font-size:max(24px,8cqw)}
  #mostrador{top:66cqw}#ecu{font-size:max(26px,11cqw);gap:2cqw;padding:1cqw 3cqw}.hueco{min-width:15cqw}
  #cama{right:50%;transform:translateX(50%);top:96cqw;width:34cqw}#vasos{left:50%;transform:translateX(-50%);bottom:18cqw}#vasos i{width:6.4cqw}
  #btnInicio{bottom:4cqw;right:50%;transform:translateX(50%);font-size:max(16px,4.6cqw)}
}
</style>
</head>
<body>
<div id="wrap">
<a class="volver" href="/matematicas/#juegos">← Volver a Matemáticas</a>
<div id="stage" class="mode-titulo">
  <div id="world">
    <svg id="scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    <section id="titulo" aria-label="Título"><h1>NÚMERO ESCONDIDO</h1><p class="sub">encuentra el número que falta</p><div id="camaT" aria-hidden="true"></div><div id="niv" role="group" aria-label="Elige el reto"></div></section>
    <div id="cab"><span id="prog" aria-live="polite"></span><span id="errs"></span></div>
    <div id="opts" role="group" aria-label="Opciones"></div>
    <div id="mostrador"><div id="ecu" role="img"></div></div>
    <div id="cama" aria-hidden="true"></div><div id="vasos" aria-hidden="true"></div>
    <button class="btn" id="btnInicio" type="button">Inicio</button>
    <div id="hudR"><button class="hex" id="btnPausa" type="button" aria-label="Pausa"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="16" y="14" width="12" height="36" rx="4" fill="#5b2bb5"/><rect x="36" y="14" width="12" height="36" rx="4" fill="#5b2bb5"/></svg></i></i></i></button><button class="hex" id="btnSonido" type="button" aria-label="Sonido" aria-pressed="false"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M10 25h10l14-11v36L20 39H10z" fill="#2a7de1"/><path d="M41 23c5 5 5 13 0 18M47 16c9 9 9 23 0 32" stroke="#2a7de1" stroke-width="4" fill="none" stroke-linecap="round"/><path id="mudoX" d="M14 50 52 12" stroke="#e02020" stroke-width="6" stroke-linecap="round"/></svg></i></i></i></button></div>
    <div id="msg" role="status" aria-live="polite"></div>
  </div>
  <div class="overlay" id="ovPausa">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tPausa">
      <span class="pill" id="tPausa">Pausa</span>
      <p>El juego está en pausa.</p>
      <button class="btn" id="btnContinuar" type="button">Continuar</button>
    </div>
  </div>
  
  <div class="overlay" id="fin">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tFin">
      <span class="pill" id="tFin">Fin del juego</span>
      <div id="finExtra"></div>
      <div class="cards"><div class="mini"><span class="hex"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#ico-monedas"/></svg></i></i></i></span><span id="fA">Aciertos</span></div><div class="mini"><span class="hex"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#ico-cofre"/></svg></i></i></i></span><span id="fB">Récord</span></div><div class="mini"><span class="hex"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#ico-libro"/></svg></i></i></i></span><span id="fC">Preguntas</span></div></div>
      <button class="btn" id="btnOtra" type="button">Jugar de nuevo</button>
    </div>
  </div>
</div>
</div>
<!-- Íconos reutilizables -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="gold" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff3a8"/><stop offset=".55" stop-color="#ffc928"/><stop offset="1" stop-color="#d98a00"/></radialGradient>
    <g id="ico-moneda"><circle cx="32" cy="32" r="24" fill="url(#gold)" stroke="#b36b00" stroke-width="3"/><circle cx="32" cy="32" r="16.5" fill="none" stroke="#b36b00" stroke-width="2.4" opacity=".7"/><path d="M32 21v22M27 26c0-3 10-3 10 1s-10 3-10 7 10 4 10 1" stroke="#b36b00" stroke-width="3" fill="none" stroke-linecap="round" transform="translate(0 -1)"/></g>
    <g id="ico-monedas"><ellipse cx="32" cy="48" rx="22" ry="7" fill="url(#gold)" stroke="#b36b00" stroke-width="2.5"/><ellipse cx="32" cy="40" rx="22" ry="7" fill="url(#gold)" stroke="#b36b00" stroke-width="2.5"/><ellipse cx="32" cy="32" rx="22" ry="7" fill="url(#gold)" stroke="#b36b00" stroke-width="2.5"/><ellipse cx="32" cy="24" rx="22" ry="7" fill="url(#gold)" stroke="#b36b00" stroke-width="2.5"/><ellipse cx="32" cy="16" rx="22" ry="7" fill="url(#gold)" stroke="#b36b00" stroke-width="2.5"/></g>

    <g id="ico-cofre"><g class="rays" style="transform-origin:32px 30px"><path d="M32 30 20 -6 44 -6zM32 30 70 8 70 30zM32 30 70 40 62 60zM32 30 -6 8 -6 30zM32 30 -6 40 2 60z" fill="#ffe45c" opacity=".55"/></g><rect x="9" y="30" width="46" height="24" rx="3" fill="#a85a1a" stroke="#4a2300" stroke-width="2.5"/><path d="M9 33c0-12 46-12 46 0z" fill="#c9742a" stroke="#4a2300" stroke-width="2.5"/><rect x="9" y="38" width="46" height="5" fill="#ffc928" stroke="#4a2300" stroke-width="1.5"/><rect x="27" y="35" width="10" height="13" rx="2" fill="#ffc928" stroke="#4a2300" stroke-width="2"/><circle cx="32" cy="41" r="2" fill="#4a2300"/></g>
  </defs>
</svg>
<script>
'use strict';
const CANCEL = { cancelado: true };
const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } }
};
const mezclar = (a, azar = Math.random) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(azar() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ent = (azar, lo, hi) => lo + Math.floor(azar() * (hi - lo + 1));
const elige = (a, azar = Math.random) => a[Math.floor(azar() * a.length)];
/* ============================================================
   NÚMERO ESCONDIDO: sumas y restas con un número que falta
   Estructura: 1 config · 2 estado · 3 motor · 4 arte · 5 render · 6 flujo · 7 eventos
   ============================================================ */
/* ====================== 1. CONFIG ====================== */
const CFG = {
  MODOS: [
    { id: 's20', nombre: 'Sumas hasta 20', op: 'suma', max: 20 }, { id: 's40', nombre: 'Sumas hasta 40', op: 'suma', max: 40 }, { id: 's50', nombre: 'Sumas hasta 50', op: 'suma', max: 50 },
    { id: 'r20', nombre: 'Restas hasta 20', op: 'resta', max: 20 }, { id: 'r40', nombre: 'Restas hasta 40', op: 'resta', max: 40 }, { id: 'r50', nombre: 'Restas hasta 50', op: 'resta', max: 50 }
  ],
  PREGUNTAS: 10, OPCIONES: 3,   // No confirmado en la ficha: cantidad de preguntas y qué pasa al fallar (aquí solo se cuenta el error)
  PAUSA: 1100, VEL: [{ x: 1, f: 1, ritmo: 1 }], K_REC: 'mis_mejor_', K_MUDO: 'sc_mute'
};
/* ====================== 2. ESTADO ====================== */
const S = { pantalla: 'titulo', corrida: 0, pausas: new Set(), vel: 0, fin: false, modo: 0, n: 0, q: null, errores: 0, ocupado: false, usados: new Set() };

const vivas = new Set();
const D = ms => RM ? ms * 0.3 : ms * CFG.VEL[S.vel].f;     // duración según velocidad visual
function limpia(el) { el.getAnimations().forEach(a => a.cancel()); }
function anima(el, kf, op = {}) {
  const c = S.corrida;
  const a = el.animate(kf, Object.assign({ fill: 'forwards', easing: 'ease-out' }, op));
  vivas.add(a); if (S.pausas.size) a.pause();
  return a.finished.then(() => 0, () => 0).then(() => { vivas.delete(a); if (c !== S.corrida) throw CANCEL; });
}
/* Espera que se detiene mientras el juego está en pausa y se cancela al reiniciar */
function esperar(ms) {
  const c = S.corrida;
  return new Promise((res, rej) => {
    let acum = 0, ult = performance.now();
    (function f(t) {
      if (c !== S.corrida) return rej(CANCEL);
      const dt = Math.min(100, t - ult); ult = t; if (!S.pausas.size) acum += dt;
      if (acum >= ms) res(); else requestAnimationFrame(f);
    })(ult);
  });
}

/* ============================ 7. AUDIO (Web Audio, sin archivos) ============================ */
const Snd = (() => {
  let ctx = null, master = null, mus = null, mudo = store.get(CFG.K_MUDO) === '1', timer = null, paso = 0, prox = 0;
  const ACORDES = [[220, 261.63, 329.63], [174.61, 220, 261.63], [261.63, 329.63, 392], [196, 246.94, 293.66]]; // La m, Fa, Do, Sol
  const NEG = 60 / 92 / 2;                                         // corchea a 92 bpm
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC(); master = ctx.createGain(); master.gain.value = mudo ? 0 : .7; master.connect(ctx.destination);
    mus = ctx.createGain(); mus.gain.value = .55; mus.connect(master);
    if (!mudo) iniciaMusica();
  }
  function tono(f, t, d, tipo = 'sine', v = .2, f2 = null, dest = master) {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = tipo; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + d + .03);
  }
  function ruido(t, d, v = .25) {
    const n = Math.floor(ctx.sampleRate * d), b = ctx.createBuffer(1, n, ctx.sampleRate), x = b.getChannelData(0);
    for (let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = b; f.type = 'bandpass'; f.frequency.value = 900;
    g.gain.value = v; s.connect(f); f.connect(g); g.connect(master); s.start(t);
  }
  function sfx(n) {
    if (!ctx || mudo || ctx.state !== 'running') return; const t = ctx.currentTime;
    switch (n) {
      case 'clic': tono(660, t, .08, 'triangle', .18, 880); break;
      case 'acierto': [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tono(f, t + i * .07, .18, 'triangle', .2)); break;
      case 'error': tono(190, t, .32, 'sawtooth', .16, 90); tono(140, t + .02, .32, 'square', .08, 70); break;
      case 'tic': tono(1250, t, .04, 'sine', .12); break;
      case 'vida': tono(440, t, .14, 'triangle', .2, 330); tono(330, t + .13, .14, 'triangle', .2, 247); tono(220, t + .26, .3, 'triangle', .22, 147); break;
      case 'moneda': tono(1318.5, t, .09, 'square', .09); tono(1760, t + .07, .22, 'square', .09); break;
      case 'golpe': ruido(t, .18, .35); tono(120, t, .16, 'sine', .3, 50); break;
      case 'victoria': [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5].forEach((f, i) => tono(f, t + i * .13, .3, 'triangle', .22)); break;
      case 'derrota': [392, 349.23, 329.63, 261.63].forEach((f, i) => tono(f, t + i * .2, .38, 'triangle', .2)); break;
    }
  }
  function agenda() {
    if (!ctx || mudo) return;
    while (prox < ctx.currentTime + .25) {
      if (prox < ctx.currentTime) prox = ctx.currentTime + .05;
      const a = ACORDES[Math.floor(paso / 8) % 4], i = paso % 8;
      if (i === 0) a.forEach(f => tono(f, prox, NEG * 8, 'triangle', .045, null, mus));
      if (i % 4 === 0) tono(a[0] / 2, prox, NEG * 3, 'sine', .08, null, mus);
      tono(a[[0, 1, 2, 1, 2, 1, 0, 1][i]] * 2, prox, NEG * 1.6, 'sine', .04, null, mus);
      prox += NEG; paso++;
    }
  }
  function iniciaMusica() { if (timer || !ctx) return; prox = ctx.currentTime + .1; timer = setInterval(agenda, 60); }
  function paraMusica() { clearInterval(timer); timer = null; }
  function setMudo(m) {
    mudo = m; store.set(CFG.K_MUDO, m ? '1' : '0');
    if (ctx) { master.gain.setTargetAtTime(m ? 0 : .7, ctx.currentTime, .03); if (m) paraMusica(); else iniciaMusica(); }
    pintaMudo();
  }
  return { init, sfx, setMudo, esMudo: () => mudo, suspende: () => ctx && ctx.suspend(), reanuda: () => ctx && ctx.resume() };
})();
function pintaMudo() {
  const m = Snd.esMudo(); $('btnSonido').setAttribute('aria-pressed', m);
  $('btnSonido').setAttribute('aria-label', m ? 'Sonido desactivado. Toca para activar' : 'Sonido activado. Toca para silenciar');
}


/* ====================== COMÚN: pausa, sonido, voz ====================== */
function pausar(m) {
  if (S.pantalla !== 'juego' || S.fin) return;
  S.pausas.add(m); $('stage').classList.add('paused'); $('ovPausa').classList.add('on');
  vivas.forEach(a => { try { a.pause(); } catch (e) { /* ya terminó */ } }); setTimeout(() => $('btnContinuar').focus(), 30);
}
function reanudar() {
  S.pausas.clear(); $('ovPausa').classList.remove('on'); $('stage').classList.remove('paused');
  vivas.forEach(a => { try { a.play(); } catch (e) { /* ya terminó */ } }); Snd.reanuda();
}
function irA(p) { S.pantalla = p; $('stage').className = 'mode-' + p; }
function pintaMudo() {
  const m = Snd.esMudo(); $('btnSonido').setAttribute('aria-pressed', m);
  $('btnSonido').setAttribute('aria-label', m ? 'Sonido desactivado. Toca para activar' : 'Sonido activado. Toca para silenciar');
  if (m && 'speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch (e) { /* sin voz */ } }
}
function decir(t) {   // voz en español con la síntesis del navegador (si existe y no está en silencio)
  if (Snd.esMudo() || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'es-ES'; u.rate = .9; speechSynthesis.speak(u); } catch (e) { /* sin voz */ }
}
function mostrarFin(titulo, a, b, c, victoria) {
  $('tFin').textContent = titulo; $('fA').textContent = a; $('fB').textContent = b; $('fC').textContent = c;
  $('fin').classList.add('on'); Snd.sfx(victoria ? 'victoria' : 'derrota'); setTimeout(() => $('btnOtra').focus(), 50);
}
function iniciaComun(alTecla) {
  const primero = () => { Snd.init(); window.removeEventListener('pointerdown', primero, true); window.removeEventListener('keydown', primero, true); };
  window.addEventListener('pointerdown', primero, true); window.addEventListener('keydown', primero, true);
  $('btnSonido').addEventListener('click', () => { Snd.setMudo(!Snd.esMudo()); Snd.sfx('clic'); });
  $('btnContinuar').addEventListener('click', () => { Snd.sfx('clic'); reanudar(); });
  const bp = $('btnPausa'); if (bp) bp.addEventListener('click', () => { Snd.sfx('clic'); if (S.pantalla === 'juego') (S.pausas.size ? reanudar() : pausar('manual')); });
  window.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'm') { Snd.setMudo(!Snd.esMudo()); return; }
    if (S.pantalla === 'juego' && k === 'p') { if (S.pausas.size) reanudar(); else pausar('manual'); return; }
    if (alTecla) alTecla(e, k);
  });
  const sinFoco = () => { if (S.pantalla === 'juego' && !S.pausas.size && !S.fin) { pausar('foco'); Snd.suspende(); } };
  document.addEventListener('visibilitychange', () => { if (document.hidden) sinFoco(); else Snd.reanuda(); });
  window.addEventListener('blur', sinFoco);
}


/* ====================== 3. MOTOR ====================== */
const Motor = {
  /* crearPregunta({op, max, usados, azar}) -> {a, b, c, op, falta:0|1|2, valor, opciones[3], ok, partes[3]}; a+b=c o a−b=c */
  crearPregunta({ op = 'suma', max = 20, usados = new Set(), azar = Math.random } = {}) {
    const R = (lo, hi) => lo + Math.floor(azar() * (hi - lo + 1));
    for (let i = 0; i < 400; i++) {
      let a, b, c;
      if (op === 'suma') { c = R(max > 20 ? 11 : 5, max); a = R(1, c - 1); b = c - a; } else { a = R(max > 20 ? 11 : 5, max); b = R(1, a - 1); c = a - b; }
      const falta = elige([0, 1, 1, 2, 2, 2], azar), v = [a, b, c][falta], clave = op + a + '_' + b + '_' + falta;
      if (usados.has(clave)) continue;
      const cand = new Set([c, a, b, v + 1, v - 1, v + 2, v - 2, v + 10, v - 10]); cand.delete(v);
      const dis = mezclar([...cand].filter(x => x >= 0 && x <= max + 5), azar).slice(0, CFG.OPCIONES - 1); if (dis.length < CFG.OPCIONES - 1) continue;
      usados.add(clave); const opciones = mezclar([v, ...dis], azar);
      return { a, b, c, op, falta, valor: v, opciones, ok: opciones.indexOf(v) };
    }
    throw new Error('Sin preguntas nuevas');
  }
};

/* ====================== 4. ARTE ====================== */
function puestoSVG() {
  let rayas = ''; for (let i = 0; i < 12; i++) rayas += `<path d="M${i * 134} 210h134l-14 120h-106z" fill="${i % 2 ? '#fff' : '#E8362F'}" stroke="#7A1010" stroke-width="5"/>`;
  return `<defs><linearGradient id="mcl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB070"/><stop offset="1" stop-color="#FFE7B0"/></linearGradient></defs>
  <rect width="1600" height="1000" fill="url(#mcl)"/><circle cx="1300" cy="140" r="70" fill="#FFF3C4"/><path d="M0 640L260 520 520 640 780 500 1040 640 1300 520 1600 640V1000H0z" fill="#D9803F" opacity=".7"/>
  <rect y="700" width="1600" height="300" fill="#C2622E"/><path d="M0 700H1600" stroke="#7A3A1A" stroke-width="8"/>${rayas}<rect y="200" width="1608" height="14" fill="#7A1010"/>
  <rect x="160" y="560" width="1280" height="200" rx="18" fill="#8A4B1E" stroke="#4A2410" stroke-width="8"/><rect x="160" y="540" width="1280" height="40" rx="14" fill="#C99A5A" stroke="#4A2410" stroke-width="8"/>`;
}
function camaleonSVG() {
  return `<svg viewBox="0 0 150 120" aria-hidden="true"><g stroke="#202D4A" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">
   <path d="M30 90q-26 6-22-22 6 14 20 6" fill="none" stroke-width="7"/><path d="M30 90q-26 6-22-22 6 14 20 6" fill="none" stroke="#4FC36A" stroke-width="3"/>
   <ellipse cx="68" cy="76" rx="44" ry="30" fill="#4FC36A"/><path d="M36 60q14-10 28 0M56 52q14-10 28 0" fill="none" stroke="#2FA65A" stroke-width="4"/><ellipse cx="68" cy="88" rx="26" ry="14" fill="#CFF5B8" stroke="none"/>
   <path d="M84 70q10-40 40-30 18 8 14 28-6 18-30 14z" fill="#4FC36A"/><circle cx="118" cy="48" r="13" fill="#fff"/><circle cx="120" cy="48" r="6" fill="#202D4A" stroke="none"/><circle cx="122" cy="46" r="2" fill="#fff" stroke="none"/>
   <path d="M104 76q14 10 28-2" fill="none"/><path d="M54 20l8 14 8-14 8 14 8-14" fill="#FFC928"/><path d="M40 100v12M96 100v12" stroke-width="9" fill="none"/><path d="M40 100v12M96 100v12" stroke="#4FC36A" stroke-width="4" fill="none"/></g></svg>`;
}
function vasoSVG() { return '<svg viewBox="0 0 40 60" aria-hidden="true"><path d="M6 6h28l-4 48H10z" fill="#fff" fill-opacity=".4" stroke="#202D4A" stroke-width="3" stroke-linejoin="round"/><path class="jugo" d="M9 24h22l-2 30H11z" fill="#FF8A1F" stroke="none"/><path d="M26 6l8-6" stroke="#202D4A" stroke-width="3" stroke-linecap="round"/></svg>'; }

/* ====================== 5. RENDER ====================== */
function pintaPregunta(q) {
  const t = [q.a, q.b, q.c], sim = q.op === 'suma' ? '+' : '−';
  const casilla = i => i === q.falta ? '<span class="hueco" id="hueco">?</span>' : `<span class="num">${t[i]}</span>`;
  $('ecu').innerHTML = `${casilla(0)}<span class="sg">${sim}</span>${casilla(1)}<span class="sg">=</span>${casilla(2)}`;
  $('ecu').setAttribute('aria-label', `${q.falta === 0 ? 'número que falta' : q.a} ${q.op === 'suma' ? 'más' : 'menos'} ${q.falta === 1 ? 'número que falta' : q.b} es igual a ${q.falta === 2 ? 'número que falta' : q.c}`);
  $('opts').innerHTML = q.opciones.map((o, i) => `<button type="button" class="op" data-i="${i}" aria-label="Opción ${i + 1}: ${o}">${o}<span class="k" aria-hidden="true">${i + 1}</span></button>`).join('');
  $('prog').textContent = 'Pregunta ' + (S.n + 1) + ' de ' + CFG.PREGUNTAS; $('errs').textContent = 'Errores: ' + S.errores;
}
function pintaVasos() { $('vasos').innerHTML = Array.from({ length: CFG.PREGUNTAS }, (_, i) => `<i class="${i < S.n ? 'lleno' : ''}">${vasoSVG()}</i>`).join(''); }
function mensaje(t, tipo) { const m = $('msg'); m.className = tipo; m.textContent = t; m.style.opacity = 1; clearTimeout(mensaje.t); mensaje.t = setTimeout(() => { m.style.opacity = 0; }, 900); }

/* ====================== 6. FLUJO ====================== */
async function responde(i) {
  if (S.pantalla !== 'juego' || S.ocupado || S.fin || S.pausas.size) return;
  const q = S.q, b = $('opts').children[i];
  if (i !== q.ok) { S.errores++; Snd.sfx('error'); b.classList.remove('mal'); void b.offsetWidth; b.classList.add('mal'); mensaje('Prueba con otro', 'bad'); $('errs').textContent = 'Errores: ' + S.errores; return; }
  S.ocupado = true; Snd.sfx('acierto'); $('msg').style.opacity = 0;
  try {
    const h = $('hueco'), r1 = b.getBoundingClientRect(), r2 = h.getBoundingClientRect(), dx = r2.left + r2.width / 2 - (r1.left + r1.width / 2), dy = r2.top + r2.height / 2 - (r1.top + r1.height / 2);
    await anima(b, [{ translate: '0 0', scale: 1 }, { translate: dx + 'px ' + dy + 'px', scale: .7 }], { duration: D(450), easing: 'ease-in-out' });
    h.textContent = q.valor; h.classList.add('listo'); b.style.visibility = 'hidden'; decir(`${q.a}${q.op === 'suma' ? ' más ' : ' menos '}${q.b} es igual a ${q.c}`.replace(/(\d+)/g, '$1'));
    S.n++; pintaVasos(); Snd.sfx('moneda'); await esperar(CFG.PAUSA);
    if (S.n >= CFG.PREGUNTAS) { S.fin = true; return termina(); }
    S.q = Motor.crearPregunta({ op: CFG.MODOS[S.modo].op, max: CFG.MODOS[S.modo].max, usados: S.usados }); pintaPregunta(S.q); S.ocupado = false;
  } catch (e) { if (e !== CANCEL) throw e; }
}
function termina() {
  const k = CFG.K_REC + CFG.MODOS[S.modo].id, mej = store.get(k), m = mej === null ? null : parseInt(mej, 10), nuevo = m === null || S.errores < m; if (nuevo) store.set(k, String(S.errores));
  mostrarFin('¡Todos los jugos listos!', 'Resueltas: ' + CFG.PREGUNTAS, 'Mejor: ' + (nuevo ? S.errores : m) + (nuevo ? ' errores ¡Nuevo!' : ' errores'), 'Errores: ' + S.errores, true);
}
function nuevaPartida(m) {
  S.modo = m; S.corrida++; vivas.forEach(a => a.cancel()); vivas.clear(); S.pausas.clear(); S.fin = false; S.n = 0; S.errores = 0; S.ocupado = false; S.usados = new Set();
  $('fin').classList.remove('on'); $('ovPausa').classList.remove('on'); $('stage').classList.remove('paused'); $('msg').style.opacity = 0;
  S.q = Motor.crearPregunta({ op: CFG.MODOS[m].op, max: CFG.MODOS[m].max, usados: S.usados }); irA('juego'); pintaVasos(); pintaPregunta(S.q);
}
function aTitulo() { S.corrida++; S.fin = false; vivas.forEach(a => a.cancel()); vivas.clear(); irA('titulo'); $('fin').classList.remove('on'); setTimeout(() => { const b = document.querySelector('.nivbtn'); if (b) b.focus(); }, 30); }

/* ====================== 7. EVENTOS ====================== */
(function iniciar() {
  $('scene').innerHTML = puestoSVG(); $('cama').innerHTML = camaleonSVG(); $('camaT').innerHTML = camaleonSVG(); pintaMudo();
  $('niv').innerHTML = CFG.MODOS.map((n, i) => `<button class="btn nivbtn" type="button" data-n="${i}">${n.nombre}</button>`).join('');
  $('niv').addEventListener('click', e => { const b = e.target.closest('.nivbtn'); if (b) { Snd.sfx('clic'); nuevaPartida(+b.dataset.n); } });
  $('opts').addEventListener('click', e => { const b = e.target.closest('.op'); if (b) responde(+b.dataset.i); });
  $('btnOtra').addEventListener('click', () => { Snd.sfx('clic'); aTitulo(); });
  $('btnInicio').addEventListener('click', () => { Snd.sfx('clic'); aTitulo(); });
  iniciaComun((e, k) => {
    if (S.pantalla === 'titulo' && /^[1-6]$/.test(k)) { Snd.sfx('clic'); nuevaPartida(+k - 1); }
    else if (S.pantalla === 'juego' && /^[1-3]$/.test(k)) { responde(+k - 1); e.preventDefault(); }
  });
  window.__mis = { S, CFG, Motor };   // gancho de pruebas
})();
