<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Cráter de formas: salta a la piedra con la figura que pide la pista y sube al volcán. Para niños de 6 a 8 años.">
<title>Cráter de formas: figuras 2D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#12082e;color:var(--ink);
  font-family:'Fredoka','Nunito','Baloo 2','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;font-weight:700}
button{font:inherit;color:inherit}
#wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:6px}
.volver{align-self:center;color:#cfe3fb;text-decoration:none;font-size:15px;min-height:28px;display:inline-flex;align-items:center;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.08)}
.volver:hover{background:rgba(255,255,255,.18);color:#fff}
#stage{position:relative;width:var(--W);aspect-ratio:16/10;container-type:inline-size;overflow:hidden;
  border-radius:calc(var(--W)*.022);background:#2b1456;isolation:isolate;
  box-shadow:0 calc(var(--W)*.015) calc(var(--W)*.05) rgba(0,0,0,.55);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#world{position:absolute;inset:0}
#scene{position:absolute;left:0;top:0;width:100%;height:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:max(3px,.4cqw) solid #fff;outline-offset:max(2px,.3cqw)}

/* ---------- Marcos hexagonales con borde doble ---------- */
.hex{--c1:#2a7de1;--c2:#4fc3ff;position:relative;display:block;width:var(--w,7cqw);aspect-ratio:1/.866;
  filter:drop-shadow(0 0 .55cqw rgba(79,195,255,.65));border:0;background:none;padding:0;margin:0}
.hex>i,.hex>i>i,.hex>i>i>i{position:absolute;display:block;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.hex>i{inset:0;background:linear-gradient(160deg,var(--c2),var(--c1))}
.hex>i>i{inset:7%;background:#fff}
.hex>i>i>i{inset:7%;background:linear-gradient(180deg,#f6faff,#c9defa);display:grid;place-items:center;overflow:hidden}
.hex svg{width:78%;height:78%;display:block}
button.hex{cursor:pointer;transition:transform .15s,filter .15s}
button.hex:hover{transform:translateY(-.3cqw) scale(1.05);filter:drop-shadow(0 0 .9cqw rgba(255,255,255,.9))}
button.hex:active{transform:scale(.96)}
.hexw{--c1:#2a7de1;--c2:#4fc3ff;position:relative;display:block;height:6.4cqw;min-width:14.5cqw;
  filter:drop-shadow(0 0 .55cqw rgba(79,195,255,.65))}
.hexw>i,.hexw>i>i,.hexw>i>i>i{position:absolute;display:block;clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%)}
.hexw>i{inset:0;background:linear-gradient(160deg,var(--c2),var(--c1))}
.hexw>i>i{inset:7%;background:#fff}
.hexw>i>i>i{inset:7%;background:linear-gradient(180deg,#f6faff,#c9defa);display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.05;padding:0 .6cqw}
.hexw small{font-size:max(10px,1.3cqw);color:#4a5a8c;letter-spacing:.02em;font-weight:700}
.hexw b{font-size:max(13px,1.95cqw);color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}


/* ---------- Modales ---------- */
.overlay{position:absolute;inset:0;z-index:20;display:none;place-items:center;background:rgba(14,6,40,.62)}
.overlay.on{display:grid}
.modal{position:relative;width:62cqw;border-radius:2.4cqw;padding:5cqw 3cqw 2.6cqw;text-align:center;
  background:linear-gradient(180deg,#f8fcff,#c9e0fb);border:max(3px,.45cqw) solid #fff;box-shadow:0 0 0 max(3px,.5cqw) #2a7de1,0 1cqw 3cqw rgba(0,0,0,.55)}
.modal .pill{position:absolute;left:50%;top:0;transform:translate(-50%,-50%)}
.modal p{margin:.6cqw 0;font-size:max(14px,2.3cqw);line-height:1.3;color:var(--ink)}
.ej{margin:1.4cqw auto 1.8cqw;padding:1.2cqw 2cqw;border-radius:1.6cqw;background:#fff;border:.35cqw dashed #5b2bb5;display:inline-block}
.ej b{color:#5b2bb5}
#dim{position:absolute;inset:0;z-index:12;background:rgba(10,4,30,.74);opacity:0;pointer-events:none;transition:opacity .6s}
#dim.on{opacity:1}
#fin{z-index:15;background:transparent}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqw;margin:1.4cqw 0 2cqw}
.mini{display:flex;flex-direction:column;align-items:center;gap:.8cqw}
.mini .hex{--w:72%}
.mini .hex svg{width:80%;height:80%}
.mini span{font-size:max(12px,1.9cqw);line-height:1.15;color:var(--ink)}
.mini b{display:block;font-size:max(16px,3cqw);color:var(--p2)}
#cuenta{position:absolute;inset:0;z-index:11;display:none;place-items:center;pointer-events:none}
#cuenta.on{display:grid}
#cuenta span{font-size:24cqw;color:#fff;text-shadow:0 1cqw 0 #5b2bb5,0 0 4cqw rgba(79,195,255,.9);animation:cnt .9s ease-out both}
@keyframes cnt{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(.9);opacity:.9}}
.rays{animation:spin 12s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}


.pill{background:linear-gradient(180deg,#8a55ea,#4a1fa0);color:#fff;border-radius:99px;padding:.6cqw 3.2cqw;font-size:max(15px,2.5cqw);
  box-shadow:0 .4cqw 0 #2b1456,inset 0 .2cqw 0 rgba(255,255,255,.35);text-shadow:0 .2cqw 0 rgba(0,0,0,.35);display:inline-block;white-space:nowrap}
.btn{border:0;border-radius:99px;cursor:pointer;min-height:48px;padding:1cqw 6cqw;color:#fff;font-size:max(17px,2.8cqw);letter-spacing:.06em;
  background:linear-gradient(90deg,#2a7de1,#7a3be0);box-shadow:0 .5cqw 0 #1b2f84,0 1cqw 2cqw rgba(0,0,0,.35),inset 0 .2cqw 0 rgba(255,255,255,.35);
  text-shadow:0 .2cqw 0 rgba(0,0,0,.3);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.12);transform:translateY(-.3cqw)}
.btn:active{transform:translateY(.3cqw)}


#stage{background:#0b1a3a}
:root{--W:min(100vw - 16px,(100dvh - 52px)*1.6)}
#scene{position:absolute;left:0;top:0;width:100%;height:100%}
.volver{align-self:center;color:#cfe3fb;text-decoration:none;font-size:15px;min-height:28px;display:inline-flex;align-items:center;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.08)}
.volver:hover{background:rgba(255,255,255,.18);color:#fff}
#wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:6px}
:focus-visible{outline:max(3px,.4cqw) solid #fff;outline-offset:max(2px,.3cqw)}
.tw{animation:tw 3.2s ease-in-out infinite}@keyframes tw{50%{opacity:.25}}
#hudR{position:absolute;right:2cqw;top:2cqw;display:flex;align-items:center;gap:1.4cqw;z-index:8}
#hudR .hex{--w:max(56px,7cqw)}#hudR .hex svg{width:62%;height:62%}
#mudoX{opacity:1}#btnSonido[aria-pressed=false] #mudoX{opacity:0}
.paused *{animation-play-state:paused!important}
#msg{position:absolute;left:0;right:0;top:34%;text-align:center;z-index:9;font-size:max(26px,6cqw);color:#fff;text-shadow:0 .5cqw 0 rgba(0,0,0,.45),0 0 2cqw rgba(0,0,0,.5);pointer-events:none;opacity:0}
#msg.ok{color:#9dff6b}#msg.bad{color:#ff9a9a}
.cards{display:grid;gap:1cqw;margin:1.4cqw 0 2.4cqw}
.mini{display:flex;align-items:center;gap:1.4cqw;background:#fff;border-radius:99px;padding:.5cqw 2cqw .5cqw .6cqw;color:#1d1a4d;font-size:max(14px,2.3cqw);box-shadow:0 .3cqw 0 rgba(0,0,0,.12)}
.mini .hex{--w:max(46px,6.2cqw);flex:none}.mini span:last-child{flex:1;text-align:left;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.mode-titulo :is(#hudL3,#btnLupa,#pista,#tiempo,#explo,#piedras,#btnPausa,#msg){display:none}
.mode-juego #titulo{display:none}
.hex,.hexw{--c1:#E0400A;--c2:#FFB347;filter:drop-shadow(0 0 .55cqw rgba(255,179,71,.8))}
.btn{background:linear-gradient(90deg,#E0400A,#F5A623)}
#titulo{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;padding-top:5cqw;text-align:center}
#titulo h1{margin:0;font-size:7.4cqw;line-height:1;color:#FFE08A;letter-spacing:.02em;text-shadow:0 .6cqw 0 #C2330A,0 1.2cqw 0 #5A1A0A,0 2cqw 2cqw rgba(0,0,0,.4)}
#titulo .sub{margin:.8cqw 0 1.6cqw;font-size:max(16px,3cqw);color:#fff;letter-spacing:.12em;text-shadow:0 .2cqw 0 #5A1A0A}
#muestra{display:flex;gap:2cqw;margin-bottom:1.2cqw}#muestra svg{width:8cqw;height:8cqw;display:block;filter:drop-shadow(0 .5cqw .6cqw rgba(0,0,0,.4))}
#exploT{width:11cqw;height:12cqw;margin-bottom:1.6cqw}#exploT svg,#explo svg{width:100%;height:100%;display:block}
#hudL3{position:absolute;left:2cqw;top:2cqw;z-index:6;display:flex;flex-direction:column;gap:.8cqw}
#energia{display:flex;gap:.6cqw;background:#2A0F1A;padding:.8cqw 1.2cqw;border-radius:1.2cqw;border:max(2px,.35cqw) solid #FFB347}
.seg{width:3.2cqw;height:2.4cqw;border-radius:.6cqw;background:#5A3A3A;display:block}.seg.on{background:linear-gradient(180deg,#FFE08A,#F07A1A);box-shadow:0 0 1cqw #FF9A2A}
#prog{align-self:flex-start;font-size:max(13px,2.2cqw);color:#fff;background:#2A0F1A;padding:.3cqw 1.4cqw;border-radius:1cqw}
#btnLupa{--w:max(56px,7cqw);position:absolute;right:17cqw;top:2cqw;z-index:6;cursor:pointer}#btnLupa svg{width:62%;height:62%}
#pista{position:absolute;left:50%;top:15cqw;transform:translateX(-50%);z-index:6;max-width:74%;text-align:center;font-size:max(16px,3.6cqw);color:#fff;background:#2A0F1Acc;border:max(3px,.4cqw) solid #FFB347;border-radius:2cqw;padding:1cqw 3cqw}
#tiempo{position:absolute;left:50%;top:26.6cqw;transform:translateX(-50%);width:36cqw;height:1.4cqw;background:#2A0F1A;border-radius:1cqw;overflow:hidden;z-index:6}
#tiempoR{display:block;height:100%;background:#7CFF7C;transform-origin:left;transition:transform .1s linear}#tiempo.poco #tiempoR{background:#ff5a4a}
#explo{position:absolute;z-index:4;left:calc(8% + var(--p,0) * 8%);top:calc(53% - var(--p,0) * 32%);width:8cqw;height:9cqw;transition:left .6s ease,top .6s ease}
#piedras{position:absolute;left:0;right:0;top:calc(32cqw + 2cqw);z-index:5;display:flex;justify-content:space-around;padding:0 6cqw}
.piedra{position:relative;width:24cqw;min-width:72px;aspect-ratio:1.6;border:0;background:none;padding:0;cursor:pointer;border-radius:3cqw;margin-top:8cqw}
.piedra .roca{width:100%;display:block;filter:drop-shadow(0 .8cqw .4cqw rgba(0,0,0,.4))}
.piedra .fig{position:absolute;left:50%;top:-8cqw;transform:translateX(-50%);width:13cqw;height:13cqw}.piedra .fig svg{width:100%;height:100%;display:block;filter:drop-shadow(0 .5cqw .5cqw rgba(0,0,0,.4))}
.piedra .k{position:absolute;left:50%;bottom:1.2cqw;transform:translateX(-50%);font-size:max(13px,2.4cqw);color:#FFE08A;opacity:.8}
.piedra:hover:not(:disabled) .roca,.piedra:focus-visible .roca{transform:translateY(-.6cqw)}
.piedra.ok .roca path:first-child{fill:#2FA65A}.piedra.mal .roca path:first-child{fill:#C2330A}
.piedra.ok,.piedra.mal{outline:none}
#msg{position:absolute;right:auto;width:max-content;left:50%;top:44cqw;transform:translateX(-50%);z-index:8;opacity:0;font-size:max(18px,4.4cqw);padding:.6cqw 3cqw;border-radius:2cqw;color:#fff;transition:opacity .2s}#msg.ok{background:#1E8A44;color:#fff}#msg.bad{background:#C2330A;color:#fff}
#stage.tiembla{animation:trem .4s}@keyframes trem{25%{transform:translateX(-1cqw)}75%{transform:translateX(1cqw)}}
.humo{animation:hum 5s ease-in-out infinite alternate}@keyframes hum{to{transform:translateY(-30px)}}
.chispa{animation:chi 3s ease-out infinite}@keyframes chi{from{transform:translateY(0);opacity:1}to{transform:translateY(-220px);opacity:0}}
.olas{animation:ola 4s linear infinite}@keyframes ola{to{transform:translateX(-200px)}}
@media (prefers-reduced-motion:reduce){.humo,.chispa,.olas{animation:none}}
@media (max-width:700px) and (orientation:portrait){
  :root{--W:min(100vw - 16px,(100dvh - 52px)*.6)}
  #stage{aspect-ratio:3/5}
  #titulo{padding-top:14cqw}#titulo h1{font-size:12cqw}#titulo .sub{font-size:max(15px,4.6cqw)}#muestra{flex-wrap:wrap;justify-content:center;gap:3cqw;padding:0 8cqw}#muestra svg{width:16cqw;height:16cqw}#exploT{width:22cqw;height:24cqw}
  #energia{padding:1.2cqw 2cqw}.seg{width:5cqw;height:4cqw}#prog{font-size:max(13px,4cqw)}
  #btnLupa{right:3cqw;top:17cqw;--w:max(52px,14cqw)}
  #pista{top:31cqw;font-size:max(15px,4.6cqw);max-width:94%;width:80%;padding:2cqw 3cqw}
  #tiempo{top:46.5cqw;width:60cqw;height:2.4cqw}
  #explo{width:14cqw;height:16cqw;left:calc(6% + var(--p,0) * 6%);top:calc(86% - var(--p,0) * 14%)}
  #piedras{top:54cqw;flex-direction:column;align-items:center;padding:0;gap:3cqw}
  .piedra{width:36cqw;min-width:0;margin-top:9cqw}.piedra .fig{width:19cqw;height:19cqw;top:-10cqw}.piedra .k{font-size:max(14px,4cqw)}
  #msg{top:50cqw;font-size:max(18px,6cqw)}
}

</style>
</head>
<body>
<div id="wrap">
<a class="volver" href="/matematicas/#juegos">← Volver a Matemáticas</a>
<div id="stage" class="mode-titulo">
  <div id="world">
    <svg id="scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    
    <section id="titulo" aria-label="Título"><h1>CRÁTER DE FORMAS</h1><p class="sub">salta a la figura correcta</p><div id="muestra" aria-hidden="true"></div><div id="exploT" aria-hidden="true"></div><button class="btn" id="btnEmpezar" type="button">JUGAR</button></section>
    <div id="hudL3"><div id="energia" role="img" aria-label="Energía"></div><div id="prog" aria-live="polite">0 de 10</div></div>
    <button class="hex" id="btnLupa" type="button" aria-label="Repetir la pista en voz alta"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="27" cy="27" r="14" fill="#cfefff" stroke="#14407a" stroke-width="6"/><path d="M38 38L54 54" stroke="#14407a" stroke-width="8" stroke-linecap="round"/></svg></i></i></i></button>
    <div id="pista" role="status" aria-live="polite"></div>
    <div id="tiempo" aria-hidden="true"><i id="tiempoR"></i></div>
    <div id="explo" aria-hidden="true"></div>
    <div id="piedras" role="group" aria-label="Piedras sobre la lava"></div>
    <div id="msg" role="status" aria-live="assertive"></div>
    <div id="hudR"><button class="hex" id="btnPausa" type="button" aria-label="Pausa"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="16" y="14" width="12" height="36" rx="4" fill="#5b2bb5"/><rect x="36" y="14" width="12" height="36" rx="4" fill="#5b2bb5"/></svg></i></i></i></button><button class="hex" id="btnSonido" type="button" aria-label="Sonido" aria-pressed="false"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M10 25h10l14-11v36L20 39H10z" fill="#2a7de1"/><path d="M41 23c5 5 5 13 0 18M47 16c9 9 9 23 0 32" stroke="#2a7de1" stroke-width="4" fill="none" stroke-linecap="round"/><path id="mudoX" d="M14 50 52 12" stroke="#e02020" stroke-width="6" stroke-linecap="round"/></svg></i></i></i></button></div>
    <div id="msg" role="status" aria-live="polite"></div>
  </div>
  <div class="overlay" id="ovPausa">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tPausa">
      <span class="pill" id="tPausa">Pausa</span>
      <p>El juego está en pausa.</p>
      <button class="btn" id="btnContinuar" type="button">Continuar</button>
    </div>
  </div>
  
  <div class="overlay" id="fin">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tFin">
      <span class="pill" id="tFin">Fin del juego</span>
      <div id="finExtra"></div>
      <div class="cards"><div class="mini"><span class="hex"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#ico-monedas"/></svg></i></i></i></span><span id="fA">Piedras</span></div><div class="mini"><span class="hex"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#ico-cofre"/></svg></i></i></i></span><span id="fB">Récord</span></div><div class="mini"><span class="hex"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#ico-libro"/></svg></i></i></i></span><span id="fC">Errores</span></div></div>
      <button class="btn" id="btnOtra" type="button">Jugar de nuevo</button>
    </div>
  </div>
</div>
</div>
<!-- Íconos reutilizables -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="gold" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff3a8"/><stop offset=".55" stop-color="#ffc928"/><stop offset="1" stop-color="#d98a00"/></radialGradient>
    <g id="ico-moneda"><circle cx="32" cy="32" r="24" fill="url(#gold)" stroke="#b36b00" stroke-width="3"/><circle cx="32" cy="32" r="16.5" fill="none" stroke="#b36b00" stroke-width="2.4" opacity=".7"/><path d="M32 21v22M27 26c0-3 10-3 10 1s-10 3-10 7 10 4 10 1" stroke="#b36b00" stroke-width="3" fill="none" stroke-linecap="round" transform="translate(0 -1)"/></g>
    <g id="ico-monedas"><ellipse cx="32" cy="48" rx="22" ry="7" fill="url(#gold)" stroke="#b36b00" stroke-width="2.5"/><ellipse cx="32" cy="40" rx="22" ry="7" fill="url(#gold)" stroke="#b36b00" stroke-width="2.5"/><ellipse cx="32" cy="32" rx="22" ry="7" fill="url(#gold)" stroke="#b36b00" stroke-width="2.5"/><ellipse cx="32" cy="24" rx="22" ry="7" fill="url(#gold)" stroke="#b36b00" stroke-width="2.5"/><ellipse cx="32" cy="16" rx="22" ry="7" fill="url(#gold)" stroke="#b36b00" stroke-width="2.5"/></g>
    <g id="ico-libro"><path d="M5 14c9-4 19-3 27 4v36c-8-7-18-8-27-4z" fill="#2a7de1" stroke="#143a73" stroke-width="2.5" stroke-linejoin="round"/><path d="M59 14c-9-4-19-3-27 4v36c8-7 18-8 27-4z" fill="#4fc3ff" stroke="#143a73" stroke-width="2.5" stroke-linejoin="round"/><path d="M11 21c6-1 12 0 17 3M11 29c6-1 12 0 17 3M11 37c6-1 12 0 17 3M36 24c5-3 11-4 17-3M36 32c5-3 11-4 17-3M36 40c5-3 11-4 17-3" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/></g>
    <g id="ico-cofre"><g class="rays" style="transform-origin:32px 30px"><path d="M32 30 20 -6 44 -6zM32 30 70 8 70 30zM32 30 70 40 62 60zM32 30 -6 8 -6 30zM32 30 -6 40 2 60z" fill="#ffe45c" opacity=".55"/></g><rect x="9" y="30" width="46" height="24" rx="3" fill="#a85a1a" stroke="#4a2300" stroke-width="2.5"/><path d="M9 33c0-12 46-12 46 0z" fill="#c9742a" stroke="#4a2300" stroke-width="2.5"/><rect x="9" y="38" width="46" height="5" fill="#ffc928" stroke="#4a2300" stroke-width="1.5"/><rect x="27" y="35" width="10" height="13" rx="2" fill="#ffc928" stroke="#4a2300" stroke-width="2"/><circle cx="32" cy="41" r="2" fill="#4a2300"/></g>
  </defs>
</svg>
<script>
'use strict';
const CANCEL = { cancelado: true };
const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },

/* Espera que se detiene mientras el juego está en pausa y se cancela al reiniciar */
function esperar(ms) {

const Snd = (() => {

  const ACORDES = [[220, 261.63, 329.63], [174.61, 220, 261.63], [261.63, 329.63, 392], [196, 246.94, 293.66]]; // La m, Fa, Do, Sol

    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = b; f.type = 'bandpass'; f.frequency.value = 900;
    g.gain.value = v; s.connect(f); f.connect(g); g.connect(master); s.start(t);
  }

    if (!ctx || mudo || ctx.state !== 'running') return; const t = ctx.currentTime;
    switch (n) {
      case 'clic': tono(660, t, .08, 'triangle', .18, 880); break;
      case 'acierto': [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tono(f, t + i * .07, .18, 'triangle', .2)); break;
      case 'error': tono(190, t, .32, 'sawtooth', .16, 90); tono(140, t + .02, .32, 'square', .08, 70); break;
      case 'tic': tono(1250, t, .04, 'sine', .12); break;

      case 'golpe': ruido(t, .18, .35); tono(120, t, .16, 'sine', .3, 50); break;
      case 'victoria': [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5].forEach((f, i) => tono(f, t + i * .13, .3, 'triangle', .22)); break;
      case 'derrota': [392, 349.23, 329.63, 261.63].forEach((f, i) => tono(f, t + i * .2, .38, 'triangle', .2)); break;

/* ====================== 3. MOTOR ====================== */
const Motor = {
  /* crearPregunta({usados, azar}) -> {pista, voz, formas:[{forma,color}], ok} con una sola figura que cumple la pista */
  crearPregunta({ usados = new Set(), azar = Math.random } = {}) {
    for (let i = 0; i < 400; i++) {
      const fs = mezclar(Object.keys(FORMAS), azar).slice(0, 3), cs = mezclar(Object.keys(COLORES), azar).slice(0, 3);
      const piedras = fs.map((f, k) => ({ forma: f, color: cs[k] })), ok = Math.floor(azar() * 3), t = piedras[ok];
      const tipo = elige(['nombre', 'color', 'nombreColor', 'lados', 'nombreColor'], azar);
      let pista, voz;
      if (tipo === 'nombre') pista = `Toca ${nombreForma(t.forma)}`;
      else if (tipo === 'color') pista = `Toca la figura de color ${COLORES[t.color].m}`;
      else if (tipo === 'nombreColor') pista = `Toca ${nombreForma(t.forma, t.color)}`;
      else {
        const l = FORMAS[t.forma].lados; if (l < 0 || l === 1 || l > 6 || piedras.filter(p => FORMAS[p.forma].lados === l).length !== 1) continue;
        pista = l === 0 ? 'Toca la figura redonda' : `Toca la figura que tiene ${l} lados`;
      }
      const clave = pista + '|' + piedras.map(p => p.forma + p.color).join(); if (usados.has(pista)) continue; usados.add(pista);
      return { pista, voz: pista, piedras, ok, tipo };
    }
    throw new Error('Sin preguntas nuevas');
  }
};

async function ronda() {
  const q = Motor.crearPregunta({ usados: S.usados }); S.q = q; pintaPiedras(q); S.tRest = CFG.SEG_PREG; pintaTiempo(); setTimeout(() => decir(q.pista), 200);
  const r = await new Promise(res => { S.esperando = true; S.resolver = res; });
  S.esperando = false; const bs = [...$('piedras').querySelectorAll('.piedra')]; bs.forEach(b => { b.disabled = true; });
  const bien = r === q.ok;
  if (r !== null) bs[r].classList.add(bien ? 'ok' : 'mal'); if (!bien) bs[q.ok].classList.add('ok');
  if (bien) {
    S.paso++; if (S.energia < CFG.ENERGIA) S.energia++; Snd.sfx('acierto'); mensaje('¡Bien!', 'ok'); pintaCamino(); pintaEnergia();
    if (S.paso >= CFG.PASOS) { S.fin = true; await esperar(900); return termina(true); }
    await esperar(CFG.PAUSA_ACIERTO);
  } else {
    S.errores++; S.energia--; Snd.sfx('error'); mensaje(r === null ? '¡Se acabó el tiempo!' : 'Esa no era', 'bad'); pintaEnergia(); $('stage').classList.add('tiembla'); setTimeout(() => $('stage').classList.remove('tiembla'), 400);
    if (S.energia <= 0) { S.fin = true; await esperar(900); return termina(false); }
    await esperar(CFG.PAUSA_ERROR);
  }
}
function bucle(t) {
  const dt = Math.min(100, t - (S.ult || t)) / 1000; S.ult = t;
  if (S.pantalla === 'juego' && S.esperando && !S.pausas.size && !S.fin && CFG.SEG_PREG) {
    S.tRest -= dt; pintaTiempo();
    if (S.tRest <= 0 && S.resolver) { const f = S.resolver; S.resolver = null; f(null); }
  }
  requestAnimationFrame(bucle);
}
function termina(gano) {
  S.fin = true; const mej = parseInt(store.get(CFG.K_REC) || '0', 10) || 0, nuevo = gano && S.paso > mej;
  if (S.paso > mej) store.set(CFG.K_REC, String(S.paso));
  mostrarFin(gano ? '¡Llegaste a la cima!' : 'Te quedaste sin energía', 'Piedras: ' + S.paso + ' de ' + CFG.PASOS, 'Récord: ' + Math.max(mej, S.paso) + (S.paso > mej ? ' ¡Nuevo!' : ''), S.errores + (S.errores === 1 ? ' error' : ' errores'), gano);
}
async function nuevaPartida() {
  S.corrida++; vivas.forEach(a => a.cancel()); vivas.clear(); S.pausas.clear(); S.fin = false; S.energia = CFG.ENERGIA; S.paso = 0; S.errores = 0; S.usados = new Set(); S.esperando = false; S.resolver = null;
  $('fin').classList.remove('on'); $('ovPausa').classList.remove('on'); $('stage').classList.remove('paused'); $('msg').style.opacity = 0;

  try { while (!S.fin) await ronda(); } catch (e) { if (e !== CANCEL) throw e; }
}
function aTitulo() { S.corrida++; S.fin = false; S.esperando = false; irA('titulo'); $('fin').classList.remove('on'); setTimeout(() => $('btnEmpezar').focus(), 30); }
function elegir(i) { if (S.pantalla === 'juego' && S.esperando && !S.pausas.size && S.resolver) { const f = S.resolver; S.resolver = null; f(i); } }

/* ====================== 7. EVENTOS ====================== */
(function iniciar() {
  $('scene').innerHTML = volcanSVG(); $('explo').innerHTML = exploradorSVG(); $('exploT').innerHTML = exploradorSVG(); pintaMudo();
  $('muestra').innerHTML = ['circulo', 'triangulo', 'cuadrado', 'estrella'].map((f, i) => formaSVG(f, ['naranja', 'azul', 'verde', 'amarillo'][i])).join('');
  $('btnEmpezar').addEventListener('click', () => { Snd.sfx('clic'); nuevaPartida(); });
  $('btnOtra').addEventListener('click', () => { Snd.sfx('clic'); aTitulo(); });
  $('btnLupa').addEventListener('click', () => { Snd.sfx('clic'); if (S.q) decir(S.q.pista); });
  $('piedras').addEventListener('click', e => { const b = e.target.closest('.piedra'); if (b && !b.disabled) elegir(+b.dataset.i); });
  iniciaComun((e, k) => {
    if (S.pantalla === 'titulo' && k === 'enter') { e.preventDefault(); Snd.sfx('clic'); nuevaPartida(); }
    else if (S.pantalla === 'juego' && /^[1-3]$/.test(k)) { elegir(+k - 1); e.preventDefault(); }
    else if (S.pantalla === 'juego' && k === 'r' && S.q) decir(S.q.pista);
  });
  requestAnimationFrame(bucle); window.__cra = { S, CFG, Motor };   // gancho de pruebas
})();

</script>
