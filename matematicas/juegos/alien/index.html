<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Alien: problemas hasta 20. Problemas matemáticos contrarreloj para niños de 6 a 8 años.">
<title>Alien: problemas hasta 20</title>
<style>
/* ============================================================
   Alien: problemas hasta 20 · estilos
   Todo el tamaño del juego se mide en cqw (1cqw = 1% del ancho del escenario)
   ============================================================ */
:root{
  --p1:#2b1456;--p2:#5b2bb5;--b1:#f07a1a;--b2:#ffb347;--o:#ff8a1f;--g:#ffc928;--ink:#1d1a4d;
  --W:min(100vw - 16px,(100dvh - 52px)*1.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#12082e;color:var(--ink);
  font-family:'Fredoka','Nunito','Baloo 2','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;font-weight:700}
button{font:inherit;color:inherit}
#wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:6px}
.volver{align-self:center;color:#ffe6cc;text-decoration:none;font-size:15px;min-height:28px;display:inline-flex;align-items:center;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.08)}
.volver:hover{background:rgba(255,255,255,.18);color:#fff}
#stage{position:relative;width:var(--W);aspect-ratio:16/10;container-type:inline-size;overflow:hidden;
  border-radius:calc(var(--W)*.022);background:#2b1456;isolation:isolate;
  box-shadow:0 calc(var(--W)*.015) calc(var(--W)*.05) rgba(0,0,0,.55);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#world{position:absolute;inset:0}
#scene{position:absolute;left:0;top:0;width:100%;height:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:max(3px,.4cqw) solid #fff;outline-offset:max(2px,.3cqw)}

/* ---------- Marcos hexagonales con borde doble ---------- */
.hex{--c1:#f07a1a;--c2:#ffb347;position:relative;display:block;width:var(--w,7cqw);aspect-ratio:1/.866;
  filter:drop-shadow(0 0 .55cqw rgba(255,179,71,.65));border:0;background:none;padding:0;margin:0}
.hex>i,.hex>i>i,.hex>i>i>i{position:absolute;display:block;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.hex>i{inset:0;background:linear-gradient(160deg,var(--c2),var(--c1))}
.hex>i>i{inset:7%;background:#fff}
.hex>i>i>i{inset:7%;background:linear-gradient(180deg,#fffaf2,#ffdfbd);display:grid;place-items:center;overflow:hidden}
.hex svg{width:78%;height:78%;display:block}
button.hex{cursor:pointer;transition:transform .15s,filter .15s}
button.hex:hover{transform:translateY(-.3cqw) scale(1.05);filter:drop-shadow(0 0 .9cqw rgba(255,255,255,.9))}
button.hex:active{transform:scale(.96)}
.hexw{--c1:#f07a1a;--c2:#ffb347;position:relative;display:block;height:6.4cqw;min-width:14.5cqw;
  filter:drop-shadow(0 0 .55cqw rgba(255,179,71,.65))}
.hexw>i,.hexw>i>i,.hexw>i>i>i{position:absolute;display:block;clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%)}
.hexw>i{inset:0;background:linear-gradient(160deg,var(--c2),var(--c1))}
.hexw>i>i{inset:7%;background:#fff}
.hexw>i>i>i{inset:7%;background:linear-gradient(180deg,#fffaf2,#ffdfbd);display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.05;padding:0 .6cqw}
.hexw small{font-size:max(10px,1.3cqw);color:#8a5a3a;letter-spacing:.02em;font-weight:700}
.hexw b{font-size:max(13px,1.95cqw);color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- HUD ---------- */
#hudA{position:absolute;left:2cqw;top:2cqw;display:flex;align-items:center;gap:.8cqw;z-index:6}
#hudA .hex{--w:max(46px,7cqw)}
#gears{display:flex;gap:.2cqw}
.gear{width:max(22px,3.6cqw);height:max(22px,3.6cqw);filter:drop-shadow(0 .2cqw .3cqw rgba(0,0,0,.5))}
.gear svg{width:100%;height:100%;overflow:visible}
.gear .gb{fill:#ff4f6d;stroke:#8a1230;stroke-width:4;stroke-linejoin:round}
.gear .gh{display:none}
.gear .crack{fill:none;stroke:#1a1030;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.gear.dead .gb{fill:#7c7c8c;stroke:#4a4a58}
.gear.dead .crack{opacity:1}
.gear.dead svg{animation:gearDie .9s ease-out both}
@keyframes gearDie{0%{transform:rotate(0) scale(1.15)}60%{transform:rotate(200deg) scale(1.2)}100%{transform:rotate(160deg) scale(.92)}}
#hudB{position:absolute;left:25cqw;top:2cqw;display:flex;gap:1.6cqw;z-index:6}
.pan{display:flex;align-items:center}
.pan .hex{--w:max(46px,6.4cqw);z-index:2}
.pan .hexw{margin-left:-1.2cqw}
#hudR{position:absolute;right:2cqw;top:2cqw;display:flex;gap:1.2cqw;z-index:8}
#hudR .hex{--w:max(56px,7cqw)}
#hudR svg{width:62%;height:62%}
#mudoX{opacity:1}
#btnSonido[aria-pressed=false] #mudoX{opacity:0}
@keyframes bounce{0%,100%{transform:scale(1)}40%{transform:scale(1.35) rotate(-8deg)}70%{transform:scale(.92)}}
.bounce{animation:bounce .5s ease-out}

/* ---------- Reloj ---------- */
#clock{position:absolute;left:2cqw;top:16cqw;width:max(52px,11cqw);aspect-ratio:1;z-index:5;filter:drop-shadow(0 .3cqw .5cqw rgba(0,0,0,.5))}
#clock svg{width:100%;height:100%;display:block;overflow:visible}
#clock .ring{fill:none;stroke:#f07a1a;stroke-width:6;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke .2s}
#clock.warn .ring{stroke:#ff3b3b}
#clock text{font-family:inherit;font-weight:800;font-size:34px;fill:#1d1a4d;text-anchor:middle;dominant-baseline:central;transform-origin:50px 50px;transform-box:view-box}
#clock.warn text{fill:#e02020;animation:pulse .5s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.22)}}

/* ---------- Velocidad ---------- */
#speed{position:absolute;right:2cqw;bottom:2cqw;--w:max(58px,8cqw);z-index:6}
#speed b{font-size:max(15px,2.6cqw);color:var(--ink);font-weight:800}

/* ---------- Actores (robots) ---------- */
.actor{position:absolute;width:17cqw;z-index:3;bottom:8cqw}
.actor .fx,.actor .pos{width:100%}
.actor svg{display:block;width:100%;height:auto;overflow:visible;animation:breathe 2.6s ease-in-out infinite;transform-origin:50% 92%}
.actor .flip{width:100%}
#player{left:8cqw;transition:left .5s,bottom .5s,width .5s}
#enemy{right:8cqw}
#enemy .flip{transform:scaleX(-1)}
#enemy .pos{transform:translateX(calc(var(--adv,0)*-1*var(--advd,12cqw)))}
#enemy.fuera{visibility:hidden}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
.rb-eyes{animation:blink 4.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.mode-select #player{left:1.5cqw;bottom:3cqw;width:23cqw}
#flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0;z-index:7}

/* ---------- Pregunta ---------- */
#card{position:absolute;left:33cqw;width:34cqw;top:14cqw;z-index:4;text-align:center;border-radius:2cqw;padding:1.1cqw 1cqw 1.2cqw;
  background:linear-gradient(180deg,#fffaf2,#ffd9b0);border:max(3px,.45cqw) solid #f07a1a;
  box-shadow:0 0 0 max(2px,.25cqw) #fff inset,0 .8cqw 0 #a8480a,0 1.4cqw 2.5cqw rgba(0,0,0,.45)}
#card small{display:block;font-size:max(11px,1.5cqw);color:#8a5a3a}
#qnum{display:block;font-size:max(34px,8.2cqw);line-height:1;color:var(--p1);letter-spacing:.06em;text-shadow:0 .3cqw 0 rgba(42,125,225,.25);font-variant-numeric:tabular-nums}
.riv{position:absolute;width:1.1cqw;height:1.1cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#c9a27a 60%,#4a638f);box-shadow:0 .15cqw .2cqw rgba(0,0,0,.4)}
#opts{position:absolute;left:32cqw;width:36cqw;top:33.5cqw;z-index:4;display:grid;grid-template-columns:1fr 1fr;gap:1.4cqw}
.opt{position:relative;min-height:max(48px,8.2cqw);border:max(2px,.35cqw) solid #f07a1a;border-radius:1.6cqw;cursor:pointer;
  background:linear-gradient(180deg,#fffaf2,#ffd9b0);box-shadow:0 .6cqw 0 #a8480a,0 1cqw 1.6cqw rgba(0,0,0,.4);
  font-size:max(12px,1.9cqw);font-weight:800;color:var(--p1);padding:0 .6cqw 0 3cqw;white-space:nowrap;
  transition:transform .15s,box-shadow .15s,background .2s;display:flex;align-items:center;justify-content:center}
.opt.long{font-size:max(11px,1.62cqw)}
.opt .k{position:absolute;left:.6cqw;top:50%;transform:translateY(-50%);width:max(18px,1.9cqw);aspect-ratio:1;border-radius:50%;background:#f07a1a;color:#fff;font-size:max(10px,1.3cqw);display:grid;place-items:center}
.opt:hover:not(:disabled){transform:translateY(-.4cqw);box-shadow:0 1cqw 0 #a8480a,0 0 2cqw rgba(255,179,71,.95),0 1.4cqw 1.8cqw rgba(0,0,0,.4)}
.opt:active:not(:disabled){transform:translateY(.2cqw)}
.opt:disabled{cursor:default}
.opt.ok{background:linear-gradient(180deg,#b8ffcb,#37d67a);border-color:#12803f;box-shadow:0 .6cqw 0 #0c5e2c}
.opt.ok::after{content:"✔";position:absolute;right:.8cqw;top:50%;transform:translateY(-50%);color:#0c5e2c;font-size:max(14px,2.2cqw)}
.opt.bad{background:linear-gradient(180deg,#ffc2c2,#ff5a5a);border-color:#a31212;box-shadow:0 .6cqw 0 #7a0c0c;animation:shake .45s}
.opt.dis{opacity:.85}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-1cqw)}40%{transform:translateX(1cqw)}60%{transform:translateX(-.7cqw)}80%{transform:translateX(.7cqw)}}
#msg{position:absolute;left:50%;top:11cqw;transform:translateX(-50%);z-index:9;padding:.5cqw 2.4cqw;border-radius:99px;color:#fff;
  font-size:max(13px,2.1cqw);opacity:0;transition:opacity .2s;white-space:nowrap;text-shadow:0 .2cqw 0 rgba(0,0,0,.4)}
#msg.ok{background:#1fa85a;opacity:1}
#msg.bad{background:#d8353a;opacity:1}

/* ---------- Efectos ---------- */
.flycoin,.bcoin{position:absolute;z-index:9;pointer-events:none;width:max(20px,3cqw);height:max(20px,3cqw)}
.bcoin{width:max(14px,2.2cqw);height:max(14px,2.2cqw)}
.flycoin svg,.bcoin svg{width:100%;height:100%;display:block}
#slash{position:absolute;z-index:8;pointer-events:none;width:24cqw;height:14cqw;left:50%;top:38%;margin:-7cqw 0 0 -12cqw;opacity:0}
#slash svg{width:100%;height:100%;overflow:visible}
.plus{position:absolute;z-index:9;pointer-events:none;font-size:max(15px,2.6cqw);color:#ffc928;text-shadow:0 .25cqw 0 #5a3a00,0 0 1cqw rgba(255,201,40,.8)}

/* ---------- Selección de robot ---------- */
#sel{position:absolute;left:24cqw;width:52cqw;top:7cqw;z-index:5;border-radius:2.4cqw;padding:5cqw 2.4cqw 2.4cqw;text-align:center;
  background:linear-gradient(180deg,#f8fcff,#ffe3c4);border:max(3px,.45cqw) solid #fff;
  box-shadow:0 0 0 max(3px,.5cqw) #f07a1a,0 1cqw 3cqw rgba(0,0,0,.5)}
.pill{background:linear-gradient(180deg,#8a55ea,#4a1fa0);color:#fff;border-radius:99px;padding:.6cqw 3.2cqw;font-size:max(15px,2.5cqw);
  box-shadow:0 .4cqw 0 #2b1456,inset 0 .2cqw 0 rgba(255,255,255,.35);text-shadow:0 .2cqw 0 rgba(0,0,0,.35);display:inline-block;white-space:nowrap}
#sel .pill{position:absolute;left:50%;top:0;transform:translate(-50%,-50%)}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1.2cqw 1.4cqw;margin-bottom:2cqw}
#grid .hex{--w:100%;min-width:max(48px,0px)}
#grid .hex svg{width:86%;height:86%}
.btn{border:0;border-radius:99px;cursor:pointer;min-height:48px;padding:1cqw 6cqw;color:#fff;font-size:max(17px,2.8cqw);letter-spacing:.06em;
  background:linear-gradient(90deg,#f07a1a,#e03a2a);box-shadow:0 .5cqw 0 #a8480a,0 1cqw 2cqw rgba(0,0,0,.35),inset 0 .2cqw 0 rgba(255,255,255,.35);
  text-shadow:0 .2cqw 0 rgba(0,0,0,.3);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.12);transform:translateY(-.3cqw)}
.btn:active{transform:translateY(.3cqw)}

/* ---------- Modales ---------- */
.overlay{position:absolute;inset:0;z-index:20;display:none;place-items:center;background:rgba(14,6,40,.62)}
.overlay.on{display:grid}
.modal{position:relative;width:62cqw;border-radius:2.4cqw;padding:5cqw 3cqw 2.6cqw;text-align:center;
  background:linear-gradient(180deg,#f8fcff,#ffe3c4);border:max(3px,.45cqw) solid #fff;box-shadow:0 0 0 max(3px,.5cqw) #f07a1a,0 1cqw 3cqw rgba(0,0,0,.55)}
.modal .pill{position:absolute;left:50%;top:0;transform:translate(-50%,-50%)}
.modal p{margin:.6cqw 0;font-size:max(14px,2.3cqw);line-height:1.3;color:var(--ink)}
.ej{margin:1.4cqw auto 1.8cqw;padding:1.2cqw 2cqw;border-radius:1.6cqw;background:#fff;border:.35cqw dashed #5b2bb5;display:inline-block}
.ej b{color:#5b2bb5}
#dim{position:absolute;inset:0;z-index:12;background:rgba(10,4,30,.74);opacity:0;pointer-events:none;transition:opacity .6s}
#dim.on{opacity:1}
#fin{z-index:15;background:transparent}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqw;margin:1.4cqw 0 2cqw}
.mini{display:flex;flex-direction:column;align-items:center;gap:.8cqw}
.mini .hex{--w:72%}
.mini .hex svg{width:80%;height:80%}
.mini span{font-size:max(12px,1.9cqw);line-height:1.15;color:var(--ink)}
.mini b{display:block;font-size:max(16px,3cqw);color:var(--p2)}
#cuenta{position:absolute;inset:0;z-index:11;display:none;place-items:center;pointer-events:none}
#cuenta.on{display:grid}
#cuenta span{font-size:24cqw;color:#fff;text-shadow:0 1cqw 0 #5b2bb5,0 0 4cqw rgba(255,179,71,.9);animation:cnt .9s ease-out both}
@keyframes cnt{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(.9);opacity:.9}}
.rays{animation:spin 12s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Modos de pantalla ---------- */
.mode-select :is(#hudA,#hudB,#clock,#speed,#card,#opts,#enemy,#msg){display:none}
.mode-title :is(#hudA,#hudB,#clock,#speed,#card,#opts,#enemy,#msg,#sel,#player){display:none}
#title{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;padding-top:7cqw;text-align:center}
.mode-title #title{display:flex}
#title h1{margin:0;font-size:max(40px,14cqw);line-height:1;letter-spacing:.06em;font-weight:800;color:#8ff7ff;
  text-shadow:0 0 .8cqw #ffb347,0 0 2.6cqw #f07a1a,0 .9cqw 0 #a8480a,0 1.4cqw 2cqw rgba(0,0,0,.5);animation:neon 3s ease-in-out infinite}
@keyframes neon{50%{filter:brightness(1.25)}}
#title .sub{margin:.8cqw 0 2.6cqw;font-size:max(16px,3.6cqw);color:#fff;letter-spacing:.14em;text-transform:lowercase;text-shadow:0 0 1.2cqw #ff4fd8,0 .3cqw 0 #5b2bb5}
#desfile{position:absolute;left:0;right:0;bottom:6.5cqw;height:15cqw;overflow:hidden;pointer-events:none}
#pista{position:absolute;left:0;bottom:0;display:flex;gap:5cqw;animation:marcha 26s linear infinite}
#pista .mr{display:block;width:10cqw}
#pista .mr svg{display:block;width:100%;height:auto;animation:salto .55s ease-in-out infinite alternate}
#pista .mr:nth-child(2n) svg{animation-delay:.2s}#pista .mr:nth-child(3n) svg{animation-delay:.38s}
@keyframes marcha{from{transform:translateX(100cqw)}to{transform:translateX(-100%)}}
@keyframes salto{to{transform:translateY(-8%) rotate(2deg)}}
.mode-game #sel{display:none}

/* ---------- Celular en vertical: escenario más alto para que los botones sean grandes ---------- */
@media (max-width:700px) and (orientation:portrait){
  :root{--W:min(100vw - 16px,(100dvh - 52px)*.6)}
  #stage{aspect-ratio:3/5;background:#2b1456}
  #scene{height:100%;top:-18%}
  #hudA{left:2cqw;top:2cqw}
  #hudA .hex{--w:max(46px,13cqw)}
  .gear{width:max(26px,8cqw);height:max(26px,8cqw)}
  #hudB{left:2cqw;right:2cqw;top:17cqw;gap:2cqw}
  #hudB .pan{flex:1}
  #hudB .pan .hex{--w:max(46px,13cqw)}
  .hexw{height:12cqw;min-width:0;flex:1}
  .hexw small{font-size:max(10px,3cqw)}
  .hexw b{font-size:max(13px,4.6cqw)}
  #hudR{right:2cqw;top:2cqw;gap:2cqw}
  #hudR .hex{--w:max(56px,13cqw)}
  #clock{left:50%;top:75cqw;width:max(52px,15cqw);margin-left:max(-26px,-7.5cqw)}
  #speed{--w:max(58px,15cqw);right:2cqw;bottom:2cqw}
  #speed b{font-size:max(15px,5cqw)}
  .actor{width:32cqw;bottom:61cqw}
  #player{left:1cqw}
  #enemy{right:1cqw}
  #enemy .pos{--advd:9cqw}
  .mode-select #player{left:0;bottom:6cqw;width:40cqw}
  #title{padding-top:26cqw}#title .sub{font-size:max(15px,5.4cqw)}#title h1{font-size:max(40px,19cqw)}
  #desfile{bottom:58cqw;height:42cqw}#pista .mr{width:26cqw}
  #card{left:6cqw;width:88cqw;top:32cqw;padding:2.5cqw 2cqw}
  #card small{font-size:max(12px,3.4cqw)}
  #qnum{font-size:max(40px,18cqw)}
  .riv{width:2.4cqw;height:2.4cqw}
  #opts{left:3cqw;width:94cqw;top:105cqw;gap:3cqw}
  .opt{min-height:max(48px,21cqw);font-size:max(13px,4.6cqw);border-radius:3.4cqw;padding:0 1.5cqw 0 6cqw}
  .opt.long{font-size:max(11px,3.9cqw)}
  .opt .k{left:1.6cqw;width:max(20px,5cqw);font-size:max(11px,3cqw)}
  #msg{top:28cqw;font-size:max(13px,4.4cqw);padding:1cqw 5cqw}
  #sel{left:3cqw;width:94cqw;top:22cqw;padding:10cqw 4cqw 5cqw}
  #sel .pill,.modal .pill{font-size:max(15px,5.2cqw);padding:1.4cqw 6cqw}
  #grid{gap:3cqw 2.4cqw;margin-bottom:5cqw}
  .btn{font-size:max(17px,6cqw);padding:2cqw 12cqw}
  .modal{width:92cqw;padding:9cqw 5cqw 5cqw}
  .modal p{font-size:max(14px,4.4cqw)}
  .cards{gap:2cqw}
  .mini span{font-size:max(11px,3.6cqw)}
  .mini b{font-size:max(15px,5.4cqw)}
  .flycoin{width:max(22px,7cqw);height:max(22px,7cqw)}
  .bcoin{width:max(16px,5cqw);height:max(16px,5cqw)}
  #slash{width:50cqw;height:28cqw;margin:-14cqw 0 0 -25cqw;top:50%}
  .plus{font-size:max(16px,5.4cqw)}
}
@media (prefers-reduced-motion:reduce){
  .actor svg,.rb-eyes,.rays,#clock.warn text,#title h1{animation:none!important}
  #pista{animation:none;left:8cqw}#pista .mr svg{animation:none}
  #dim{transition:none}
}
.paused *{animation-play-state:paused!important}

/* ---------- Problemas verbales ---------- */
#card{left:28cqw;width:44cqw;top:12.5cqw;padding:1.6cqw 2cqw}
#qnum{margin:0;font-size:max(13px,2.05cqw);line-height:1.28;letter-spacing:0;text-shadow:none;font-weight:800;color:var(--ink);text-wrap:balance}

<script>
'use strict';
/* =====================================================================
   ROBOTS: FORMA EXPANDIDA
   Estructura: 1 config · 2 estado · 3 motor de preguntas · 4 arte (robots y ciudad)
               5 render/HUD · 6 animaciones · 7 audio · 8 flujo de partida · 9 eventos
   ===================================================================== */

/* ============================ 1. CONFIG ============================ */
const CFG = {
  TOTAL: 30,            // preguntas por partida
  VIDAS: 3,
  SEG: 30,              // segundos por pregunta (no cambia con la velocidad)
  ULTIMOS: 5,           // últimos segundos: alerta roja
  BASE: 4, FACTOR: 0.45, // puntos = BASE + floor(segundos_restantes * FACTOR)
  // f = factor de duración de animaciones · ritmo = qué tan rápido avanza el enemigo
  VEL: [{ x: 1, f: 1, ritmo: 1 }, { x: 2, f: 0.72, ritmo: 1.4 }, { x: 3, f: 0.5, ritmo: 1.9 }],
  K_REC: 'ali_record', K_MUDO: 'sc_mute'
};
const CANCEL = { cancelado: true };
const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } }
};

/* ============================ 2. ESTADO ============================ */
const S = {
  pantalla: 'title', robot: 0, vidas: CFG.VIDAS, punt: 0, idx: 0, resp: 0, vel: 0,
  usados: new Set(), pausas: new Set(), tRest: CFG.SEG, esperando: false, resolver: null,
  corrida: 0, enemigo: -1, anterior: -1, q: null, record: parseInt(store.get(CFG.K_REC) || '0', 10) || 0
};

/* ====================== 3. MOTOR DE PREGUNTAS (problemas hasta 20) ====================== */
const Motor = (() => {
  const NOMBRES = ['Oscar', 'Marta', 'Samuel', 'Valeria', 'Nicolás', 'Camila', 'Tomás', 'Luciana', 'Mateo', 'Sofía', 'Andrés', 'Paula', 'Emilio', 'Renata', 'Julián', 'Daniela', 'Bruno', 'Elena', 'Iván', 'Lucía'];
  const OBJETOS = [   // s: singular · p: plural · g: m/f
    { s: 'dulce', p: 'dulces', g: 'm' }, { s: 'crayón', p: 'crayones', g: 'm' }, { s: 'canica', p: 'canicas', g: 'f' }, { s: 'sticker', p: 'stickers', g: 'm' },
    { s: 'galleta', p: 'galletas', g: 'f' }, { s: 'globo', p: 'globos', g: 'm' }, { s: 'carta', p: 'cartas', g: 'f' }, { s: 'manzana', p: 'manzanas', g: 'f' },
    { s: 'concha', p: 'conchas', g: 'f' }, { s: 'lápiz', p: 'lápices', g: 'm' }, { s: 'flor', p: 'flores', g: 'f' }, { s: 'moneda', p: 'monedas', g: 'f' },
    { s: 'bloque', p: 'bloques', g: 'm' }, { s: 'pez', p: 'peces', g: 'm' }
  ];
  const elige = (a, azar) => a[Math.floor(azar() * a.length)];
  const mezclar = (a, azar) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(azar() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const unidad = (v, o) => `${v} ${v === 1 ? o.s : o.p}`;
  const cuantos = o => o.g === 'm' ? 'Cuántos' : 'Cuántas';

  /* crearPregunta({usados:Set, azar:fn}) -> {enunciado, opciones[4], ok, correcta} */
  function crearPregunta(config = {}) {
    const azar = config.azar || Math.random, usados = config.usados || new Set();
    for (let intento = 0; intento < 400; intento++) {
      const o = elige(OBJETOS, azar), N = mezclar(NOMBRES.slice(), azar), A = N[0], B = N[1], Q = cuantos(o);
      const resta = azar() < .55;
      let a, b, res, texto, distr;
      if (resta) {
        a = 6 + Math.floor(azar() * 15); b = 2 + Math.floor(azar() * (a - 3)); res = a - b;       // a de 6 a 20
        texto = [
          `${A} tenía ${a} ${o.p}. Le dio ${b} a ${B}. ¿${Q} ${o.p} le quedan a ${A}?`,
          `${A} tiene ${a} ${o.p} y le regala ${b} a ${B}. ¿${Q} ${o.p} tiene ahora ${A}?`,
          `Había ${a} ${o.p} en una caja. ${A} sacó ${b}. ¿${Q} ${o.p} quedaron en la caja?`
        ][Math.floor(azar() * 3)];
        distr = [a + b, res + 1, res - 1, a, b, res + 2, res - 2, res + 10];   // operación inversa, cerca, datos
      } else {
        a = 3 + Math.floor(azar() * 12); b = 2 + Math.floor(azar() * (20 - a - 1)); res = a + b;  // total hasta 20
        texto = [
          `${A} tenía ${a} ${o.p} y ${B} le regaló ${b} más. ¿${Q} ${o.p} tiene ${A} ahora?`,
          `En un cesto hay ${a} ${o.p}. ${A} pone ${b} más. ¿${Q} ${o.p} hay en el cesto?`,
          `${A} tiene ${a} ${o.p} y ${B} tiene ${b}. ¿${Q} ${o.p} tienen entre los dos?`
        ][Math.floor(azar() * 3)];
        distr = [Math.abs(a - b), res + 1, res - 1, a, b, res + 2, res - 2, res + 10];
      }
      if (b < 1 || res < 1 || res > 20 || usados.has(texto)) continue;
      const vistos = new Set([res]), elegidos = [];
      const prioridad = [distr[0], ...mezclar(distr.slice(1, 3), azar), ...mezclar(distr.slice(3), azar)];
      for (const v of prioridad) if (elegidos.length < 3 && v >= 0 && v <= 30 && !vistos.has(v)) { vistos.add(v); elegidos.push(v); }
      for (let v = 1; elegidos.length < 3 && v < 30; v++) if (!vistos.has(v)) { vistos.add(v); elegidos.push(v); }
      usados.add(texto);
      const opciones = mezclar([res, ...elegidos].map(v => unidad(v, o)), azar), correcta = unidad(res, o);
      return { enunciado: texto, opciones, ok: opciones.indexOf(correcta), correcta, resultado: res };
    }
    throw new Error('Sin preguntas nuevas');
  }
  return { crearPregunta };
})();
/* ============== 4. ARTE: ALIENS (todo SVG inline) ============== */
const ROBOTS = [   // personajes (se mantiene el nombre de la lista por el motor común)
  { n: 'Brote', c1: '#8EE07A', c2: '#C9F5B8', ac: '#1F5B2A', forma: 'redonda', ojos: 'dos', ant: 'dos', boca: 'sonrisa', brazos: 2, lunares: 0 },
  { n: 'Nebu', c1: '#B58CFF', c2: '#E2D0FF', ac: '#3B1E7A', forma: 'alta', ojos: 'uno', ant: 'una', boca: 'o', brazos: 2, lunares: 1 },
  { n: 'Gelu', c1: '#6FD0FF', c2: '#C5EEFF', ac: '#15507A', forma: 'ancha', ojos: 'tres', ant: 'ninguna', boca: 'dientes', brazos: 4, lunares: 0 },
  { n: 'Pimpón', c1: '#FF9BC4', c2: '#FFD3E6', ac: '#7A1E50', forma: 'gota', ojos: 'dos', ant: 'cuernos', boca: 'sonrisa', brazos: 2, lunares: 1 },
  { n: 'Zuko', c1: '#FFE066', c2: '#FFF3B0', ac: '#7A5A00', forma: 'cuadrada', ojos: 'uno', ant: 'dos', boca: 'colmillos', brazos: 2, lunares: 0 },
  { n: 'Mira', c1: '#3FD6C0', c2: '#B5F5EA', ac: '#0D5A4E', forma: 'redonda', ojos: 'tres', ant: 'espiral', boca: 'o', brazos: 4, lunares: 1 },
  { n: 'Rubo', c1: '#FFA24D', c2: '#FFD2A6', ac: '#7A3A00', forma: 'ancha', ojos: 'dos', ant: 'cuernos', boca: 'colmillos', brazos: 2, lunares: 0 },
  { n: 'Lima', c1: '#C8F060', c2: '#EAFBB0', ac: '#41570D', forma: 'alta', ojos: 'dos', ant: 'hojas', boca: 'sonrisa', brazos: 4, lunares: 1 },
  { n: 'Coral', c1: '#FF7A7A', c2: '#FFC2C2', ac: '#7A1A1A', forma: 'gota', ojos: 'uno', ant: 'ninguna', boca: 'dientes', brazos: 2, lunares: 0 },
  { n: 'Lilo', c1: '#D7B8FF', c2: '#F0E4FF', ac: '#4A2A7A', forma: 'cuadrada', ojos: 'tres', ant: 'una', boca: 'sonrisa', brazos: 2, lunares: 1 }
];
const COLUMNAS = 5, NOMBRE_PERSONAJE = 'Alien';
const CABEZAS = {   // figura, parte alta, altura de los ojos y de la boca
  redonda: { d: '<ellipse cx="60" cy="32" rx="30" ry="27"/>', top: 5, ey: 29, my: 45 },
  alta: { d: '<ellipse cx="60" cy="26" rx="24" ry="32"/>', top: -6, ey: 23, my: 44 },
  ancha: { d: '<ellipse cx="60" cy="36" rx="35" ry="24"/>', top: 12, ey: 33, my: 47 },
  gota: { d: '<path d="M60 -4C85 18 92 46 60 60C28 46 35 18 60 -4Z"/>', top: -4, ey: 33, my: 50 },
  cuadrada: { d: '<rect x="32" y="6" width="56" height="52" rx="17"/>', top: 6, ey: 29, my: 46 }
};
function robotSVG(i, icono) {
  const r = ROBOTS[i], h = CABEZAS[r.forma], A = r.ac, C = r.c1, L = r.c2, ey = h.ey, top = h.top;
  const lim = (x1, y1, x2, y2, w) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${A}" stroke-width="${w + 5}" stroke-linecap="round"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${C}" stroke-width="${w}" stroke-linecap="round"/>`;
  let ant = '';
  if (r.ant === 'dos') ant = `<path d="M48 ${top + 3} Q42 ${top - 10} 34 ${top - 12}M72 ${top + 3} Q78 ${top - 10} 86 ${top - 12}" stroke="${A}" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="33" cy="${top - 13}" r="4.5" fill="${L}" stroke="${A}" stroke-width="2.4"/><circle cx="87" cy="${top - 13}" r="4.5" fill="${L}" stroke="${A}" stroke-width="2.4"/>`;
  else if (r.ant === 'una') ant = `<path d="M60 ${top + 1} V${top - 11}" stroke="${A}" stroke-width="3"/><circle cx="60" cy="${top - 14}" r="5" fill="${L}" stroke="${A}" stroke-width="2.4"/>`;
  else if (r.ant === 'cuernos') ant = `<path d="M42 ${top + 9} L36 ${top - 8} L53 ${top + 3}ZM78 ${top + 9} L84 ${top - 8} L67 ${top + 3}Z" fill="${L}" stroke="${A}" stroke-width="2.6" stroke-linejoin="round"/>`;
  else if (r.ant === 'hojas') ant = `<path d="M60 ${top + 2} V${top - 6}" stroke="${A}" stroke-width="3"/><path d="M60 ${top - 6} q-16 -2 -18 -14 q14 -2 18 14z M60 ${top - 6} q16 -2 18 -14 q-14 -2 -18 14z" fill="#8EE07A" stroke="${A}" stroke-width="2.4" stroke-linejoin="round"/>`;
  else if (r.ant === 'espiral') ant = `<path d="M60 ${top + 1} V${top - 6} c-12 0 -12 -12 0 -12 c8 0 8 8 2 8" stroke="${A}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  const blanco = (cx, cy, rx, ry, rp) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#fff" stroke="${A}" stroke-width="2.4"/><circle cx="${cx}" cy="${cy + 1}" r="${rp}" fill="${A}"/><circle cx="${cx + rp * .35}" cy="${cy - rp * .3}" r="${rp * .32}" fill="#fff"/>`;

    ctx = new AC(); master = ctx.createGain(); master.gain.value = mudo ? 0 : .7; master.connect(ctx.destination);
    mus = ctx.createGain(); mus.gain.value = .55; mus.connect(master);
    if (!mudo) iniciaMusica();
  }
  function tono(f, t, d, tipo = 'sine', v = .2, f2 = null, dest = master) {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = tipo; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + d + .03);
  }
  function ruido(t, d, v = .25) {
    const n = Math.floor(ctx.sampleRate * d), b = ctx.createBuffer(1, n, ctx.sampleRate), x = b.getChannelData(0);
    for (let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = b; f.type = 'bandpass'; f.frequency.value = 900;
    g.gain.value = v; s.connect(f); f.connect(g); g.connect(master); s.start(t);
  }
  function sfx(n) {
    if (!ctx || mudo || ctx.state !== 'running') return; const t = ctx.currentTime;
    switch (n) {
      case 'clic': tono(660, t, .08, 'triangle', .18, 880); break;
      case 'acierto': [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tono(f, t + i * .07, .18, 'triangle', .2)); break;
      case 'error': tono(190, t, .32, 'sawtooth', .16, 90); tono(140, t + .02, .32, 'square', .08, 70); break;
      case 'tic': tono(1250, t, .04, 'sine', .12); break;
      case 'vida': tono(440, t, .14, 'triangle', .2, 330); tono(330, t + .13, .14, 'triangle', .2, 247); tono(220, t + .26, .3, 'triangle', .22, 147); break;
      case 'moneda': tono(1318.5, t, .09, 'square', .09); tono(1760, t + .07, .22, 'square', .09); break;
      case 'golpe': ruido(t, .18, .35); tono(120, t, .16, 'sine', .3, 50); break;
      case 'victoria': [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5].forEach((f, i) => tono(f, t + i * .13, .3, 'triangle', .22)); break;
      case 'derrota': [392, 349.23, 329.63, 261.63].forEach((f, i) => tono(f, t + i * .2, .38, 'triangle', .2)); break;

  }

    if (!ctx || mudo) return;
    while (prox < ctx.currentTime + .25) {

      const a = ACORDES[Math.floor(paso / 8) % 4], i = paso % 8;
      if (i === 0) a.forEach(f => tono(f, prox, NEG * 8, 'triangle', .045, null, mus));
      if (i % 4 === 0) tono(a[0] / 2, prox, NEG * 3, 'sine', .08, null, mus);
      tono(a[[0, 1, 2, 1, 2, 1, 0, 1][i]] * 2, prox, NEG * 1.6, 'sine', .04, null, mus);

  }
  function iniciaMusica() { if (timer || !ctx) return; prox = ctx.currentTime + .1; timer = setInterval(agenda, 60); }

})();
function pintaMudo() {
  const m = Snd.esMudo(); $('btnSonido').setAttribute('aria-pressed', m);
  $('btnSonido').setAttribute('aria-label', m ? 'Sonido desactivado. Toca para activar' : 'Sonido activado. Toca para silenciar');
}

/* ============================ 8. FLUJO DE PARTIDA ============================ */
function pausar(motivo) {
  const antes = S.pausas.size; S.pausas.add(motivo);
  if (!antes) { vivas.forEach(a => { try { a.pause(); } catch (e) { /* ya terminó */ } }); $('stage').classList.add('paused'); }
  if (motivo !== 'ayuda' && S.pantalla === 'juego') { $('ovPausa').classList.add('on'); $('btnContinuar').focus(); }
}
function reanudar(motivo) {
  S.pausas.delete(motivo);
  if (motivo !== 'ayuda') $('ovPausa').classList.remove('on');
  if (!S.pausas.size) { vivas.forEach(a => { try { a.play(); } catch (e) { /* ya terminó */ } }); $('stage').classList.remove('paused'); Snd.reanuda(); }
}
function elegir(i) {
  if (!S.esperando || S.pausas.size || !S.resolver) return;
  const f = S.resolver; S.resolver = null; f({ i, t: S.tRest });
}
function ponVel() {
  const x = CFG.VEL[S.vel].x; $('vel').textContent = x + 'X'; $('speed').setAttribute('aria-label', `Velocidad ${x}X. Toca para cambiarla`);
}
async function cuentaAtras() {
  const c = $('cuenta'); c.classList.add('on');
  for (const n of ['3', '2', '1']) { const s = $('cnum'); s.textContent = n; s.style.animation = 'none'; void s.offsetWidth; s.style.animation = ''; Snd.sfx('tic'); await esperar(800); }
  c.classList.remove('on');
}
function elegirEnemigo() {
  const pool = ROBOTS.map((_, i) => i).filter(i => i !== S.robot && i !== S.anterior);
  S.enemigo = pool[Math.floor(Math.random() * pool.length)]; S.anterior = S.enemigo;
  const e = $('enemy'); e.querySelector('.flip').innerHTML = robotSVG(S.enemigo);
}
async function pregunta() {
  const q = Motor.crearPregunta({ usados: S.usados }); S.q = q;
  pintaPregunta(q); setPreg(); aplicaComp(Math.floor(Math.random() * 100) % COMPS.length === compAct ? (compAct + 1) % COMPS.length : Math.floor(Math.random() * COMPS.length));
  elegirEnemigo();
  const E = $('enemy'), card = $('card'), opts = $('opts'), pf = $('player').querySelector('.fx'), ef = E.querySelector('.fx');
  [card, opts, ef, pf, $('slash')].forEach(limpia);
  E.style.setProperty('--adv', 0); E.classList.remove('fuera');
  S.tRest = CFG.SEG; S.esperando = false; pintaReloj();
  opts.querySelectorAll('.opt').forEach(b => b.disabled = true);
  await Promise.all([
    anima(card, [{ opacity: 0, transform: 'scale(.82)' }, { opacity: 1, transform: 'scale(1)' }], { duration: D(420), easing: 'cubic-bezier(.2,.9,.3,1.2)' }),
    anima(opts, [{ opacity: 0, transform: 'translateY(4%)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: D(420) }),
    anima(ef, RM ? [{ opacity: 0 }, { opacity: 1 }] : [{ transform: 'translateX(70cqw)', opacity: 1 }, { transform: 'translateX(0)', opacity: 1 }], { duration: D(560), easing: 'ease-out' })]);
  opts.querySelectorAll('.opt').forEach(b => b.disabled = false);
  S.esperando = true; S.tic = CFG.SEG;
  const r = await new Promise(res => { S.resolver = res; S.alTiempo = () => res({ i: null, t: 0 }); });
  S.esperando = false; S.resolver = null; pintaReloj();
  const botones = [...opts.querySelectorAll('.opt')]; botones.forEach(b => { b.disabled = true; b.classList.add('dis'); });
  const ok = r.i === q.ok;
  if (r.i !== null) S.resp++;
  botones[q.ok].classList.remove('dis'); botones[q.ok].classList.add('ok');
  if (ok) {
    const pts = CFG.BASE + Math.floor(r.t * CFG.FACTOR), antes = S.punt; S.punt += pts;
    await secAcierto(botones[q.ok], pts, antes);
  } else {
    if (r.i !== null) { botones[r.i].classList.remove('dis'); botones[r.i].classList.add('bad'); }
    Snd.sfx('error');
    mensaje(r.i === null ? '¡Se acabó el tiempo!' : 'Era ' + q.correcta, 'bad');
    await esperar(D(650));
    await secFallo();
  }
}
async function partida() {
  const mi = S.corrida;
  try {
    await cuentaAtras();
    for (S.idx = 1; S.idx <= CFG.TOTAL && S.vidas > 0; S.idx++) await pregunta();
    S.idx = Math.min(S.idx, CFG.TOTAL);
    await esperar(S.vidas > 0 ? 300 : 700);
    fin();
  } catch (e) { if (e !== CANCEL) throw e; }
  return mi;
}
function fin() {
  S.pantalla = 'fin'; S.esperando = false;
  const nuevo = S.punt > S.record; if (nuevo) { S.record = S.punt; store.set(CFG.K_REC, String(S.record)); }
  $('fPunt').textContent = 'Puntaje: ' + S.punt;
  $('fRec').textContent = 'Récord: ' + S.record + (nuevo && S.punt > 0 ? ' ¡Nuevo!' : '');
  $('fPreg').textContent = S.resp + ' preguntas de ' + CFG.TOTAL;
  $('dim').classList.add('on'); $('fin').classList.add('on');
  Snd.sfx(S.vidas > 0 ? 'victoria' : 'derrota');
  setTimeout(() => $('btnOtra').focus(), 50);
}
function nuevaPartida() {
  S.corrida++; vivas.forEach(a => a.cancel()); vivas.clear();
  document.querySelectorAll('.flycoin,.bcoin,.plus').forEach(e => e.remove());
  Object.assign(S, { vidas: CFG.VIDAS, punt: 0, idx: 1, resp: 0, vel: 0, esperando: false, resolver: null, anterior: -1, pantalla: 'juego' });
  S.usados = new Set(); S.pausas.clear(); $('stage').classList.remove('paused');
  ['ovPausa', 'ovAyuda', 'fin'].forEach(id => $(id).classList.remove('on')); $('dim').classList.remove('on');
  setVidas(); setPunt(0); setPreg(); ponVel(); pintaReloj(); $('msg').className = '';
  $('card').style.opacity = 0; $('opts').style.opacity = 0; $('opts').innerHTML = '';
  [$('player').querySelector('.fx'), $('enemy').querySelector('.fx'), $('card'), $('opts'), $('world'), $('flash')].forEach(limpia);
  $('enemy').classList.add('fuera');
  $('stage').className = 'mode-game';
  partida();
}
function irASeleccion() {
  Snd.sfx('clic'); S.pantalla = 'select'; $('stage').className = 'mode-select';
  setTimeout(() => { const b = document.querySelector('.rob[aria-checked="true"]'); if (b) b.focus(); }, 30);
}
function volverASeleccion() {
  S.corrida++; vivas.forEach(a => a.cancel()); vivas.clear(); S.pantalla = 'select'; S.esperando = false;
  S.pausas.clear(); $('stage').classList.remove('paused');
  document.querySelectorAll('.flycoin,.bcoin,.plus').forEach(e => e.remove());
  $('fin').classList.remove('on'); $('dim').classList.remove('on'); $('ovPausa').classList.remove('on');
  [$('player').querySelector('.fx'), $('world')].forEach(limpia);
  $('stage').className = 'mode-select'; aplicaComp(0);
  setTimeout(() => { const b = document.querySelector('.rob[aria-checked="true"]'); if (b) b.focus(); }, 30);
}

/* Bucle principal: reloj, tic y avance del enemigo (solo corre cuando se espera respuesta) */
let ultT = performance.now();
function bucle(t) {
  const dt = Math.min(100, t - ultT) / 1000; ultT = t;
  if (S.esperando && !S.pausas.size) {
    const antes = S.tRest; S.tRest = Math.max(0, S.tRest - dt);
    const rap = S.tRest <= CFG.ULTIMOS, u = rap ? 2 : 1;
    if (Math.floor(S.tRest * u) !== Math.floor(antes * u) && S.tRest > 0) Snd.sfx('tic');
    pintaReloj();
    const adv = Math.min(1, ((CFG.SEG - S.tRest) / CFG.SEG) * CFG.VEL[S.vel].ritmo);
    $('enemy').style.setProperty('--adv', adv.toFixed(4));
    if (S.tRest <= 0 && S.alTiempo) { const f = S.alTiempo; S.alTiempo = null; S.resolver = null; f(); }
  }
  requestAnimationFrame(bucle);
}

/* ============================ 9. EVENTOS ============================ */
function abreAyuda() {
  Snd.sfx('clic'); pausar('ayuda'); $('ovAyuda').classList.add('on'); S.foco = document.activeElement; $('btnCerrarAyuda').focus();
}
function cierraAyuda() {
  Snd.sfx('clic'); $('ovAyuda').classList.remove('on'); reanudar('ayuda'); if (S.foco && S.foco.focus) S.foco.focus();
}
function iniciaEventos() {
  const primero = () => { Snd.init(); window.removeEventListener('pointerdown', primero, true); window.removeEventListener('keydown', primero, true); };
  window.addEventListener('pointerdown', primero, true); window.addEventListener('keydown', primero, true);
  $('grid').addEventListener('click', e => { const b = e.target.closest('.rob'); if (!b) return; S.robot = +b.dataset.i; ponRobotElegido(); Snd.sfx('clic'); });
  $('grid').addEventListener('keydown', e => {
    const d = { ArrowRight: 1, ArrowDown: COLUMNAS, ArrowLeft: -1, ArrowUp: -COLUMNAS }[e.key]; if (!d) return;
    e.preventDefault(); const n = S.robot + d; if (n < 0 || n >= ROBOTS.length) return; S.robot = n; ponRobotElegido(); document.querySelectorAll('.rob')[n].focus(); Snd.sfx('clic');
  });
  $('btnEmpezar').addEventListener('click', irASeleccion);
  $('btnJugar').addEventListener('click', () => { Snd.sfx('clic'); nuevaPartida(); });
  $('btnOtra').addEventListener('click', () => { Snd.sfx('clic'); volverASeleccion(); });
  $('btnAyuda').addEventListener('click', () => { Snd.sfx('clic'); if (S.pantalla === 'juego') pausar('manual'); });
  $('btnCerrarAyuda').addEventListener('click', cierraAyuda);
  $('btnContinuar').addEventListener('click', () => { Snd.sfx('clic'); reanudar('manual'); reanudar('foco'); });
  $('btnSonido').addEventListener('click', () => { Snd.setMudo(!Snd.esMudo()); Snd.sfx('clic'); });
  $('speed').addEventListener('click', () => { S.vel = (S.vel + 1) % 3; ponVel(); Snd.sfx('clic'); });
  $('opts').addEventListener('click', e => { const b = e.target.closest('.opt'); if (b && !b.disabled) elegir(+b.dataset.i); });
  window.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'escape' && $('ovAyuda').classList.contains('on')) { cierraAyuda(); return; }
    if ($('ovAyuda').classList.contains('on')) return;
    if (k === 'm') { Snd.setMudo(!Snd.esMudo()); return; }
    // Enter: del título pasa a la selección y de la selección empieza la partida
    if (e.key === 'Enter' && !e.repeat && !e.target.closest('#btnAyuda,#btnSonido,#speed,#btnOtra,#btnContinuar')) {
      if (S.pantalla === 'title') { e.preventDefault(); irASeleccion(); return; }
      if (S.pantalla === 'select') { e.preventDefault(); Snd.sfx('clic'); nuevaPartida(); return; }
    }
    if (S.pantalla !== 'juego') return;
    if (k === 'p') { if (S.pausas.has('manual')) { reanudar('manual'); reanudar('foco'); } else pausar('manual'); return; }
    if (['1', '2', '3', '4'].includes(k)) elegir(+k - 1);
  });
  // Pausa automática si la pestaña pierde el foco
  const sinFoco = () => { if (S.pantalla === 'juego' && !S.pausas.has('foco')) { pausar('foco'); Snd.suspende(); } };
  document.addEventListener('visibilitychange', () => { if (document.hidden) sinFoco(); else Snd.reanuda(); });
  window.addEventListener('blur', sinFoco);
  // Parallax suave con el puntero (solo sin movimiento reducido)
  if (!RM) $('stage').addEventListener('pointermove', e => {
    const r = $('stage').getBoundingClientRect(); px = ((e.clientX - r.left) / r.width - .5) * -2; aplicaComp(compAct);
  });
}

/* ============================ ARRANQUE ============================ */
(function iniciar() {
  $('scene').innerHTML = ciudadSVG();
  $('pista').innerHTML = ROBOTS.map((_, i) => `<span class="mr">${robotSVG(i)}</span>`).join('');
  iniciaHUD(); pintaRobots(); pintaMudo(); aplicaComp(0); setVidas(); setPunt(0); ponVel(); pintaReloj();
  iniciaEventos(); requestAnimationFrame(bucle);
  window.__rfe = { S, Motor, CFG };   // gancho de pruebas (solo lectura de estado)
})();
</script>
