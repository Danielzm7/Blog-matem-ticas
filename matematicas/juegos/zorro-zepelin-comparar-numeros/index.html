<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#12082e;color:var(--ink);

button{font:inherit;color:inherit}
#wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:6px}
.volver{align-self:center;color:#cfe3fb;text-decoration:none;font-size:15px;min-height:28px;display:inline-flex;align-items:center;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.08)}

#stage{position:relative;width:var(--W);aspect-ratio:16/10;container-type:inline-size;overflow:hidden;

#scene{position:absolute;left:0;top:0;width:100%;height:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:max(3px,.4cqw) solid #fff;outline-offset:max(2px,.3cqw)}

.hex{--c1:#2a7de1;--c2:#4fc3ff;position:relative;display:block;width:var(--w,7cqw);aspect-ratio:1/.866;

.hex>i,.hex>i>i,.hex>i>i>i{position:absolute;display:block;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.hex>i{inset:0;background:linear-gradient(160deg,var(--c2),var(--c1))}
.hex>i>i{inset:7%;background:#fff}
.hex>i>i>i{inset:7%;background:linear-gradient(180deg,#f6faff,#c9defa);display:grid;place-items:center;overflow:hidden}
.hex svg{width:78%;height:78%;display:block}
button.hex{cursor:pointer;transition:transform .15s,filter .15s}
button.hex:hover{transform:translateY(-.3cqw) scale(1.05);filter:drop-shadow(0 0 .9cqw rgba(255,255,255,.9))}

.hexw{--c1:#2a7de1;--c2:#4fc3ff;position:relative;display:block;height:6.4cqw;min-width:14.5cqw;
  filter:drop-shadow(0 0 .55cqw rgba(79,195,255,.65))}
.hexw>i,.hexw>i>i,.hexw>i>i>i{position:absolute;display:block;clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%)}
.hexw>i{inset:0;background:linear-gradient(160deg,var(--c2),var(--c1))}
.hexw>i>i{inset:7%;background:#fff}
.hexw>i>i>i{inset:7%;background:linear-gradient(180deg,#f6faff,#c9defa);display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.05;padding:0 .6cqw}
.hexw small{font-size:max(10px,1.3cqw);color:#4a5a8c;letter-spacing:.02em;font-weight:700}
.hexw b{font-size:max(13px,1.95cqw);color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}


/* ---------- Modales ---------- */
.overlay{position:absolute;inset:0;z-index:20;display:none;place-items:center;background:rgba(14,6,40,.62)}
.overlay.on{display:grid}
.modal{position:relative;width:62cqw;border-radius:2.4cqw;padding:5cqw 3cqw 2.6cqw;text-align:center;
  background:linear-gradient(180deg,#f8fcff,#c9e0fb);border:max(3px,.45cqw) solid #fff;box-shadow:0 0 0 max(3px,.5cqw) #2a7de1,0 1cqw 3cqw rgba(0,0,0,.55)}
.modal .pill{position:absolute;left:50%;top:0;transform:translate(-50%,-50%)}
.modal p{margin:.6cqw 0;font-size:max(14px,2.3cqw);line-height:1.3;color:var(--ink)}
.ej{margin:1.4cqw auto 1.8cqw;padding:1.2cqw 2cqw;border-radius:1.6cqw;background:#fff;border:.35cqw dashed #5b2bb5;display:inline-block}
.ej b{color:#5b2bb5}
#dim{position:absolute;inset:0;z-index:12;background:rgba(10,4,30,.74);opacity:0;pointer-events:none;transition:opacity .6s}
#dim.on{opacity:1}
#fin{z-index:15;background:transparent}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqw;margin:1.4cqw 0 2cqw}
.mini{display:flex;flex-direction:column;align-items:center;gap:.8cqw}
.mini .hex{--w:72%}
.mini .hex svg{width:80%;height:80%}
.mini span{font-size:max(12px,1.9cqw);line-height:1.15;color:var(--ink)}
.mini b{display:block;font-size:max(16px,3cqw);color:var(--p2)}
#cuenta{position:absolute;inset:0;z-index:11;display:none;place-items:center;pointer-events:none}
#cuenta.on{display:grid}
#cuenta span{font-size:24cqw;color:#fff;text-shadow:0 1cqw 0 #5b2bb5,0 0 4cqw rgba(79,195,255,.9);animation:cnt .9s ease-out both}
@keyframes cnt{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(.9);opacity:.9}}
.rays{animation:spin 12s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}


.pill{background:linear-gradient(180deg,#8a55ea,#4a1fa0);color:#fff;border-radius:99px;padding:.6cqw 3.2cqw;font-size:max(15px,2.5cqw);
  box-shadow:0 .4cqw 0 #2b1456,inset 0 .2cqw 0 rgba(255,255,255,.35);text-shadow:0 .2cqw 0 rgba(0,0,0,.35);display:inline-block;white-space:nowrap}
.btn{border:0;border-radius:99px;cursor:pointer;min-height:48px;padding:1cqw 6cqw;color:#fff;font-size:max(17px,2.8cqw);letter-spacing:.06em;

  text-shadow:0 .2cqw 0 rgba(0,0,0,.3);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.12);transform:translateY(-.3cqw)}
.btn:active{transform:translateY(.3cqw)}

#btnInicio{position:absolute;right:2cqw;bottom:2cqw;z-index:6;font-size:max(14px,2.2cqw);padding:1cqw 3cqw;min-height:48px}

  #par{top:44cqw;flex-direction:column;gap:3cqw}.num,#par[data-l="2"] .num,#par[data-l="3"] .num{font-size:13cqw}#par[data-l="3"] .num{font-size:11.5cqw}#caja{width:22cqw;height:20cqw;font-size:15cqw}

}

<script>
'use strict';
const CANCEL = { cancelado: true };
const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } }
};
const mezclar = (a, azar = Math.random) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(azar() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ent = (azar, lo, hi) => lo + Math.floor(azar() * (hi - lo + 1));
const elige = (a, azar = Math.random) => a[Math.floor(azar() * a.length)];
/* ============================================================

/* ====================== 1. CONFIG ====================== */
const CFG = {

  PAREJAS_POR_ESTRELLA: 1,   // No confirmado en la ficha: cuántas parejas hacen falta para apagar una estrella
  P_IGUAL: .18, P_CERCA: .4, // probabilidad de pareja igual y de pareja de números muy parecidos
  TOL: 70,               // px de imán alrededor de la caja

/* Espera que se detiene mientras el juego está en pausa y se cancela al reiniciar */

const Snd = (() => {
  let ctx = null, master = null, mus = null, mudo = store.get(CFG.K_MUDO) === '1', timer = null, paso = 0, prox = 0;
  const ACORDES = [[220, 261.63, 329.63], [174.61, 220, 261.63], [261.63, 329.63, 392], [196, 246.94, 293.66]]; // La m, Fa, Do, Sol

      case 'error': tono(190, t, .32, 'sawtooth', .16, 90); tono(140, t + .02, .32, 'square', .08, 70); break;

      case 'victoria': [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5].forEach((f, i) => tono(f, t + i * .13, .3, 'triangle', .22)); break;

/* ARRASTRE común: pointer events (ratón y táctil), imán al hueco libre más cercano y alternativa de tocar la pieza y luego el hueco */
const Arrastre = (() => {
  let cfg = null, act = null, sel = null;
  const activo = () => S.pantalla === 'juego' && !S.fin && !S.pausas.size;
  function huecoCerca(p) {
    const r = p.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2; let mejor = null, d0 = 1e9, afin = null, d1 = 1e9;
    cfg.huecos().forEach(h => {
      if (h.classList.contains('lleno')) return; const q = h.getBoundingClientRect();
      const dx = Math.max(q.left - cx, 0, cx - q.right), dy = Math.max(q.top - cy, 0, cy - q.bottom), c = Math.hypot(cx - (q.left + q.width / 2), cy - (q.top + q.height / 2));
      if (Math.hypot(dx, dy) <= cfg.tol) { if (c < d0) { d0 = c; mejor = h; } if (cfg.afin && cfg.afin(p, h) && c < d1) { d1 = c; afin = h; } }
    });
    return afin || mejor;   // si hay un hueco de la misma clase al alcance, tiene prioridad
  }
  function vuelve(p) { p.classList.remove('arrastra'); p.style.transition = RM ? 'none' : 'translate .25s ease-out'; p.style.translate = '0 0'; setTimeout(() => { p.style.transition = ''; p.style.translate = ''; }, 280); }
  function intenta(p, h) { const ok = cfg.suelta(p, h); if (ok) { p.style.translate = ''; p.style.transition = ''; p.classList.remove('arrastra', 'sel'); sel = null; } else vuelve(p); return ok; }
  function limpiaSel() { document.querySelectorAll('.pz.sel').forEach(x => x.classList.remove('sel')); sel = null; }
  function iniciar(c) {
    cfg = c; const raiz = c.raiz;
    raiz.addEventListener('pointerdown', e => {
      const p = e.target.closest('.pz'); if (!p || p.disabled || !activo() || e.button > 0) return;
      act = { p, id: e.pointerId, x0: e.clientX, y0: e.clientY, mov: false }; try { p.setPointerCapture(e.pointerId); } catch (_) { }
    });
    raiz.addEventListener('pointermove', e => {
      if (!act || act.id !== e.pointerId) return; const dx = e.clientX - act.x0, dy = e.clientY - act.y0;
      if (!act.mov && Math.hypot(dx, dy) > 7) { act.mov = true; act.p.classList.add('arrastra'); act.p.style.transition = 'none'; }
      if (act.mov) act.p.style.translate = dx + 'px ' + dy + 'px';
    });
    const fin = e => {
      if (!act || act.id !== e.pointerId) return; const a = act; act = null; const p = a.p;
      if (e.type === 'pointercancel') return vuelve(p);
      if (!a.mov) { const ya = sel === p; limpiaSel(); if (!ya) { sel = p; p.classList.add('sel'); Snd.sfx('clic'); } return; }
      const h = huecoCerca(p); if (!h) return vuelve(p); intenta(p, h);
    };
    raiz.addEventListener('pointerup', fin); raiz.addEventListener('pointercancel', fin);
    raiz.addEventListener('click', e => { const p = e.target.closest('.pz'); if (p && e.detail === 0 && !p.disabled && activo()) { const ya = sel === p; limpiaSel(); if (!ya) { sel = p; p.classList.add('sel'); Snd.sfx('clic'); } } });
    c.zonaHuecos.addEventListener('click', e => { const h = e.target.closest('.hu'); if (h && sel && activo() && !h.classList.contains('lleno')) intenta(sel, h); });
    c.zonaHuecos.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.hu') && sel && activo()) { e.preventDefault(); const h = e.target.closest('.hu'); if (!h.classList.contains('lleno')) intenta(sel, h); } });
  }
  return { iniciar, limpiaSel, vuelve };
})();

/* ====================== 3. MOTOR ====================== */
const Motor = {
  simbolo(a, b) { return a < b ? '<' : a > b ? '>' : '='; },
  /* crearPareja({max, lens, usados}) -> {a, b, ok}: sin repetir parejas en la partida */
  crearPareja({ max, lens, usados = new Set(), azar = Math.random }) {
    const ent = (lo, hi) => lo + Math.floor(azar() * (hi - lo + 1));
    const deLargo = L => ent(Math.pow(10, L - 1), Math.min(max, Math.pow(10, L) - 1));
    for (let i = 0; i < 200; i++) {
      const r = azar(); let a, b;
      if (azar() < .05) { a = max; b = ent(max - Math.max(2, Math.floor(max / 10)), max); }
      else if (r < CFG.P_IGUAL) { a = b = deLargo(elige(lens, azar)); }
      else if (r < CFG.P_IGUAL + CFG.P_CERCA) {   // números parecidos: comparten casi todas las cifras
        a = deLargo(elige(lens, azar)); const paso = Math.max(1, Math.pow(10, String(a).length - 1) / (azar() < .5 ? 1 : 10));
        b = a + (azar() < .5 ? -1 : 1) * ent(1, 9) * paso; b = Math.max(0, Math.min(max, Math.round(b)));
      } else { a = deLargo(elige(lens, azar)); b = deLargo(elige(lens, azar)); }
      if (azar() < .5) [a, b] = [b, a];
      const k = a + '|' + b; if (usados.has(k)) continue; usados.add(k);
      return { a, b, ok: Motor.simbolo(a, b) };
    }
    return { a: 1, b: 2, ok: '<' };
  },
  pct(ac, it) { return it ? Math.round(100 * ac / it) : 0; }
};

/* suelta(pieza, hueco) -> true si el símbolo es el correcto; si no, la pieza vuelve a la bandeja */
function suelta(p, h) {

  Snd.sfx('acierto'); pintaPuntaje(); pintaEstrellas(); mensaje('¡Muy bien!', 'ok'); $('zorro').classList.add('salta'); setTimeout(() => $('zorro').classList.remove('salta'), 700);
  const c = S.corrida;
  esperar(CFG.PAUSA).then(() => { if (c !== S.corrida) return; if (S.hechas >= CFG.ESTRELLAS * CFG.PAREJAS_POR_ESTRELLA) termina(); else nuevaPareja(); }).catch(e => { if (e !== CANCEL) throw e; });
  return true;
}
function termina() {
  S.fin = true; const pc = Motor.pct(S.aciertos, S.intentos), k = CFG.K_REC + CFG.NIVELES[S.nivel].id, mej = parseInt(store.get(k) || '0', 10) || 0, nuevo = pc > mej;
  if (nuevo) store.set(k, String(pc));
  mostrarFin('¡Aterrizaje perfecto!', 'Puntaje: ' + pc + '%', 'Mejor: ' + Math.max(mej, pc) + '%' + (nuevo ? ' ¡Nuevo!' : ''), S.aciertos + ' aciertos en ' + S.intentos + ' intentos', pc >= 60);
}
function nuevaPartida(n) {
  S.corrida++; S.pausas.clear(); S.fin = false; S.nivel = n; S.aciertos = 0; S.intentos = 0; S.hechas = 0; S.usados = new Set();
  $('fin').classList.remove('on'); $('ovPausa').classList.remove('on'); $('stage').classList.remove('paused'); $('msg').style.opacity = 0;
  irA('juego'); pintaEstrellas(); pintaPuntaje(); nuevaPareja();
}
function aTitulo() { S.corrida++; S.fin = false; irA('titulo'); $('fin').classList.remove('on'); setTimeout(() => { const b = document.querySelector('.nivbtn'); if (b) b.focus(); }, 30); }

/* ====================== 7. EVENTOS ====================== */
(function iniciar() {
  $('scene').innerHTML = cieloSVG(); $('zorro').innerHTML = zorroSVG(); $('zepT').innerHTML = zepelinSVG(true); pintaMudo();
  $('niv').innerHTML = CFG.NIVELES.map((n, i) => `<button class="btn nivbtn" type="button" data-n="${i}">${n.nombre}</button>`).join('');
  $('niv').addEventListener('click', e => { const b = e.target.closest('.nivbtn'); if (b) { Snd.sfx('clic'); nuevaPartida(+b.dataset.n); } });
  Arrastre.iniciar({ raiz: $('bandeja'), zonaHuecos: $('par'), huecos: () => [$('caja')], tol: CFG.TOL, suelta });
  $('btnOtra').addEventListener('click', () => { Snd.sfx('clic'); aTitulo(); });
  $('btnInicio').addEventListener('click', () => { Snd.sfx('clic'); aTitulo(); });
  iniciaComun((e, k) => {
    if (S.pantalla === 'titulo' && /^[1-3]$/.test(k)) { Snd.sfx('clic'); nuevaPartida(+k - 1); }
    else if (S.pantalla === 'juego' && ['<', '>', '=', ',', '.'].includes(k)) { const s = k === ',' ? '<' : k === '.' ? '>' : k; const p = document.querySelector('#bandeja .pz[data-s="' + s + '"]'); if (p) suelta(p, $('caja')); }
  });
  window.__zor = { S, CFG, Motor, suelta };   // gancho de pruebas
})();
</script>
