<head>

<title>Taller del castor: arma el barco</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#12082e;color:var(--ink);
  font-family:'Fredoka','Nunito','Baloo 2','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;font-weight:700}
button{font:inherit;color:inherit}
#wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:6px}
.volver{align-self:center;color:#cfe3fb;text-decoration:none;font-size:15px;min-height:28px;display:inline-flex;align-items:center;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.08)}
.volver:hover{background:rgba(255,255,255,.18);color:#fff}
#stage{position:relative;width:var(--W);aspect-ratio:16/10;container-type:inline-size;overflow:hidden;
  border-radius:calc(var(--W)*.022);background:#2b1456;isolation:isolate;
  box-shadow:0 calc(var(--W)*.015) calc(var(--W)*.05) rgba(0,0,0,.55);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#world{position:absolute;inset:0}
#scene{position:absolute;left:0;top:0;width:100%;height:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:max(3px,.4cqw) solid #fff;outline-offset:max(2px,.3cqw)}

/* ---------- Marcos hexagonales con borde doble ---------- */
.hex{--c1:#2a7de1;--c2:#4fc3ff;position:relative;display:block;width:var(--w,7cqw);aspect-ratio:1/.866;
  filter:drop-shadow(0 0 .55cqw rgba(79,195,255,.65));border:0;background:none;padding:0;margin:0}
.hex>i,.hex>i>i,.hex>i>i>i{position:absolute;display:block;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.hex>i{inset:0;background:linear-gradient(160deg,var(--c2),var(--c1))}
.hex>i>i{inset:7%;background:#fff}
.hex>i>i>i{inset:7%;background:linear-gradient(180deg,#f6faff,#c9defa);display:grid;place-items:center;overflow:hidden}
.hex svg{width:78%;height:78%;display:block}
button.hex{cursor:pointer;transition:transform .15s,filter .15s}
button.hex:hover{transform:translateY(-.3cqw) scale(1.05);filter:drop-shadow(0 0 .9cqw rgba(255,255,255,.9))}
button.hex:active{transform:scale(.96)}
.hexw{--c1:#2a7de1;--c2:#4fc3ff;position:relative;display:block;height:6.4cqw;min-width:14.5cqw;
  filter:drop-shadow(0 0 .55cqw rgba(79,195,255,.65))}
.hexw>i,.hexw>i>i,.hexw>i>i>i{position:absolute;display:block;clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%)}
.hexw>i{inset:0;background:linear-gradient(160deg,var(--c2),var(--c1))}
.hexw>i>i{inset:7%;background:#fff}
.hexw>i>i>i{inset:7%;background:linear-gradient(180deg,#f6faff,#c9defa);display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.05;padding:0 .6cqw}
.hexw small{font-size:max(10px,1.3cqw);color:#4a5a8c;letter-spacing:.02em;font-weight:700}
.hexw b{font-size:max(13px,1.95cqw);color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}


/* ---------- Modales ---------- */
.overlay{position:absolute;inset:0;z-index:20;display:none;place-items:center;background:rgba(14,6,40,.62)}
.overlay.on{display:grid}
.modal{position:relative;width:62cqw;border-radius:2.4cqw;padding:5cqw 3cqw 2.6cqw;text-align:center;
  background:linear-gradient(180deg,#f8fcff,#c9e0fb);border:max(3px,.45cqw) solid #fff;box-shadow:0 0 0 max(3px,.5cqw) #2a7de1,0 1cqw 3cqw rgba(0,0,0,.55)}
.modal .pill{position:absolute;left:50%;top:0;transform:translate(-50%,-50%)}
.modal p{margin:.6cqw 0;font-size:max(14px,2.3cqw);line-height:1.3;color:var(--ink)}
.ej{margin:1.4cqw auto 1.8cqw;padding:1.2cqw 2cqw;border-radius:1.6cqw;background:#fff;border:.35cqw dashed #5b2bb5;display:inline-block}
.ej b{color:#5b2bb5}
#dim{position:absolute;inset:0;z-index:12;background:rgba(10,4,30,.74);opacity:0;pointer-events:none;transition:opacity .6s}
#dim.on{opacity:1}
#fin{z-index:15;background:transparent}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqw;margin:1.4cqw 0 2cqw}
.mini{display:flex;flex-direction:column;align-items:center;gap:.8cqw}
.mini .hex{--w:72%}
.mini .hex svg{width:80%;height:80%}
.mini span{font-size:max(12px,1.9cqw);line-height:1.15;color:var(--ink)}
.mini b{display:block;font-size:max(16px,3cqw);color:var(--p2)}
#cuenta{position:absolute;inset:0;z-index:11;display:none;place-items:center;pointer-events:none}
#cuenta.on{display:grid}
#cuenta span{font-size:24cqw;color:#fff;text-shadow:0 1cqw 0 #5b2bb5,0 0 4cqw rgba(79,195,255,.9);animation:cnt .9s ease-out both}
@keyframes cnt{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(.9);opacity:.9}}
.rays{animation:spin 12s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}


.pill{background:linear-gradient(180deg,#8a55ea,#4a1fa0);color:#fff;border-radius:99px;padding:.6cqw 3.2cqw;font-size:max(15px,2.5cqw);
  box-shadow:0 .4cqw 0 #2b1456,inset 0 .2cqw 0 rgba(255,255,255,.35);text-shadow:0 .2cqw 0 rgba(0,0,0,.35);display:inline-block;white-space:nowrap}
.btn{border:0;border-radius:99px;cursor:pointer;min-height:48px;padding:1cqw 6cqw;color:#fff;font-size:max(17px,2.8cqw);letter-spacing:.06em;
  background:linear-gradient(90deg,#2a7de1,#7a3be0);box-shadow:0 .5cqw 0 #1b2f84,0 1cqw 2cqw rgba(0,0,0,.35),inset 0 .2cqw 0 rgba(255,255,255,.35);
  text-shadow:0 .2cqw 0 rgba(0,0,0,.3);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.12);transform:translateY(-.3cqw)}
.btn:active{transform:translateY(.3cqw)}


#stage{background:#0b1a3a}
:root{--W:min(100vw - 16px,(100dvh - 52px)*1.6)}
#scene{position:absolute;left:0;top:0;width:100%;height:100%}
.volver{align-self:center;color:#cfe3fb;text-decoration:none;font-size:15px;min-height:28px;display:inline-flex;align-items:center;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.08)}

#wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:6px}
:focus-visible{outline:max(3px,.4cqw) solid #fff;outline-offset:max(2px,.3cqw)}
.tw{animation:tw 3.2s ease-in-out infinite}@keyframes tw{50%{opacity:.25}}
#hudR{position:absolute;right:2cqw;top:2cqw;display:flex;align-items:center;gap:1.4cqw;z-index:8}
#hudR .hex{--w:max(56px,7cqw)}#hudR .hex svg{width:62%;height:62%}
#mudoX{opacity:1}#btnSonido[aria-pressed=false] #mudoX{opacity:0}

#msg{position:absolute;left:0;right:0;top:34%;text-align:center;z-index:9;font-size:max(26px,6cqw);color:#fff;text-shadow:0 .5cqw 0 rgba(0,0,0,.45),0 0 2cqw rgba(0,0,0,.5);pointer-events:none;opacity:0}
#msg.ok{color:#9dff6b}#msg.bad{color:#ff9a9a}
.cards{display:grid;gap:1cqw;margin:1.4cqw 0 2.4cqw}
.mini{display:flex;align-items:center;gap:1.4cqw;background:#fff;border-radius:99px;padding:.5cqw 2cqw .5cqw .6cqw;color:#1d1a4d;font-size:max(14px,2.3cqw);box-shadow:0 .3cqw 0 rgba(0,0,0,.12)}
.mini .hex{--w:max(46px,6.2cqw);flex:none}.mini span:last-child{flex:1;text-align:left;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.mode-titulo :is(#prog,#barco,#panel,#fb,#castor,#btnInicio,#btnPausa){display:none}
.mode-juego #titulo{display:none}
.hex,.hexw{--c1:#0E8AC8;--c2:#FFC928;filter:drop-shadow(0 0 .55cqw rgba(255,255,255,.5))}.pz{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}.pz.arrastra{cursor:grabbing;z-index:40;filter:drop-shadow(0 1cqw 1cqw rgba(0,0,0,.4))}.pz.sel{outline:max(3px,.4cqw) solid #FFE066;outline-offset:.4cqw;border-radius:1.4cqw}.pz.puesta{cursor:default}
.hu.no{animation:nop .4s}@keyframes nop{25%{translate:-.8cqw 0}75%{translate:.8cqw 0}}.pz:focus-visible,.hu:focus-visible,.btn:focus-visible{outline:3px solid #FFE066;outline-offset:2px}
.btn{background:linear-gradient(90deg,#0E8AC8,#F07A1A)}
#titulo{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;padding-top:22cqw;text-align:center}
#titulo h1{margin:0;font-size:6.8cqw;line-height:1;color:#fff;text-shadow:0 .6cqw 0 #0E8AC8,0 1.2cqw 0 #0A2E6A,0 2cqw 2cqw rgba(0,0,0,.35);padding:0 8cqw}

#castorT{width:9cqw}#castorT svg,#castor svg{width:100%;display:block;filter:drop-shadow(0 .6cqw .6cqw rgba(0,0,0,.3))}
#niv{display:grid;grid-template-columns:repeat(2,1fr);gap:2cqw;margin-top:2.4cqw;width:70%}#niv .btn{font-size:max(14px,2.6cqw);padding:1.4cqw .6cqw;min-height:52px;white-space:nowrap}
#prog{position:absolute;left:2cqw;top:2cqw;z-index:6;color:#fff;background:#0A2E6Add;border:max(2px,.3cqw) solid #FFE9A8;border-radius:1.4cqw;padding:.3cqw 1.8cqw;font-size:max(18px,3cqw)}
#barco{position:absolute;left:4cqw;top:13cqw;width:60cqw;height:46cqw;z-index:4}
.hu{position:absolute;display:block}.hu svg,.hu .pz{width:100%;height:100%;display:block;padding:0;border:0;background:none}.hu.lleno svg{filter:none}
#panel{position:absolute;left:65cqw;right:3.5cqw;top:15cqw;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);gap:1.4cqw;padding:1.4cqw;background:#B07A44;border-radius:2cqw;border:max(3px,.5cqw) solid #7A4A1E}
.cel{display:flex;flex-direction:column;align-items:center;gap:.3cqw;color:#fff;font-size:max(12px,1.9cqw)}.cel.vacia span{visibility:hidden}.cel .pz{width:8cqw;height:7.4cqw;padding:0;border:0;background:none}.cel .pz[data-s=rectangulo]{height:4.4cqw;margin:1.5cqw 0}.pz svg{width:100%;height:100%;display:block}
#fb{position:absolute;left:4cqw;right:4cqw;top:2.6cqw;z-index:6;text-align:center;font-size:max(14px,2.6cqw);color:#fff;text-shadow:0 .2cqw 0 #0A2E6A;min-height:3cqw}#fb.ok{color:#9dff6b}#fb.mal{color:#FFD36B}
#castor{position:absolute;right:3cqw;bottom:1cqw;width:9cqw;z-index:4}
#btnInicio{position:absolute;left:3cqw;bottom:1.5cqw;z-index:6;font-size:max(14px,2.2cqw);padding:1cqw 3cqw;min-height:48px}
@media (max-width:700px) and (orientation:portrait){
  :root{--W:min(100vw - 16px,(100dvh - 52px)*.6)}
  #stage{aspect-ratio:3/5}
  #titulo{padding-top:34cqw}#titulo h1{font-size:11cqw;padding:0 3cqw}#titulo .sub{font-size:max(14px,4.4cqw)}#castorT{width:26cqw}
  #niv{grid-template-columns:1fr;width:76%;gap:3cqw;margin-top:5cqw}#niv .btn{font-size:max(15px,4.6cqw);padding:2.6cqw 1cqw}
  #prog{top:16cqw;font-size:max(16px,5cqw)}#fb{top:25cqw;font-size:max(14px,4.2cqw)}#barco{left:3cqw;top:36cqw;width:94cqw;height:70cqw}
  #panel{left:3cqw;right:3cqw;top:110cqw;grid-template-columns:repeat(4,1fr);gap:1.6cqw;padding:2cqw}.cel{font-size:max(11px,3cqw)}.cel .pz{width:12cqw;height:11cqw}.cel .pz[data-s=rectangulo]{height:6.4cqw;margin:2.3cqw 0;width:15cqw}
  #castor{left:4cqw;right:auto;bottom:2cqw;width:15cqw}#btnInicio{left:auto;right:4cqw;bottom:4cqw;font-size:max(14px,4cqw);padding:2cqw 5cqw}
}

<script>
'use strict';
const CANCEL = { cancelado: true };
const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } }
};
const mezclar = (a, azar = Math.random) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(azar() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ent = (azar, lo, hi) => lo + Math.floor(azar() * (hi - lo + 1));
const elige = (a, azar = Math.random) => a[Math.floor(azar() * a.length)];
/* ============================================================
   TALLER DEL CASTOR: arrastra cada pieza al hueco punteado y arma el barco
   Estructura: 1 config · 2 estado · 3 motor · 4 arte · 5 render · 6 flujo · 7 eventos
   ============================================================ */
/* ====================== 1. CONFIG ====================== */
const CFG = {
  TOL: 36,   // No confirmado en la ficha: cantidad de piezas y pantalla final; aquí 3 o 7 piezas y el error devuelve la pieza al panel
  NIVELES: [
    { id: 'b3', nombre: 'Barquito (3 piezas)', partes: [   // x, y, ancho y alto en % del taller
      { id: 'casco', s: 'rectangulo', x: 12, y: 66, w: 58, h: 13 }, { id: 'mastil', s: 'rectangulo', x: 38, y: 22, w: 5, h: 44 }, { id: 'vela', s: 'triangulo', x: 44, y: 24, w: 26, h: 40 }] },
    { id: 'b7', nombre: 'Barco grande (7 piezas)', partes: [
      { id: 'casco', s: 'rectangulo', x: 10, y: 62, w: 62, h: 13 }, { id: 'cabina', s: 'cuadrado', x: 14, y: 44, w: 16, h: 18 }, { id: 'mastil', s: 'rectangulo', x: 42, y: 20, w: 4, h: 42 },
      { id: 'vela', s: 'triangulo', x: 48, y: 22, w: 24, h: 38 }, { id: 'bandera', s: 'triangulo', x: 33, y: 8, w: 9, h: 10 }, { id: 'sal1', s: 'circulo', x: 22, y: 77, w: 9, h: 13 }, { id: 'sal2', s: 'circulo', x: 52, y: 77, w: 9, h: 13 }] }
  ],
  VEL: [{ x: 1, f: 1, ritmo: 1 }], K_REC: 'bar_menos_', K_MUDO: 'sc_mute'
};
/* ====================== 2. ESTADO ====================== */
const S = { pantalla: 'titulo', corrida: 0, pausas: new Set(), vel: 0, fin: false, nivel: 0, errores: 0, puestas: 0, total: 0 };

const vivas = new Set();
const D = ms => RM ? ms * 0.3 : ms * CFG.VEL[S.vel].f;     // duración según velocidad visual
function limpia(el) { el.getAnimations().forEach(a => a.cancel()); }
function anima(el, kf, op = {}) {
  const c = S.corrida;
  const a = el.animate(kf, Object.assign({ fill: 'forwards', easing: 'ease-out' }, op));
  vivas.add(a); if (S.pausas.size) a.pause();
  return a.finished.then(() => 0, () => 0).then(() => { vivas.delete(a); if (c !== S.corrida) throw CANCEL; });
}
/* Espera que se detiene mientras el juego está en pausa y se cancela al reiniciar */
function esperar(ms) {
  const c = S.corrida;
  return new Promise((res, rej) => {
    let acum = 0, ult = performance.now();
    (function f(t) {
      if (c !== S.corrida) return rej(CANCEL);
      const dt = Math.min(100, t - ult); ult = t; if (!S.pausas.size) acum += dt;
      if (acum >= ms) res(); else requestAnimationFrame(f);
    })(ult);
  });
}

/* ============================ 7. AUDIO (Web Audio, sin archivos) ============================ */
const Snd = (() => {
  let ctx = null, master = null, mus = null, mudo = store.get(CFG.K_MUDO) === '1', timer = null, paso = 0, prox = 0;
  const ACORDES = [[220, 261.63, 329.63], [174.61, 220, 261.63], [261.63, 329.63, 392], [196, 246.94, 293.66]]; // La m, Fa, Do, Sol
  const NEG = 60 / 92 / 2;                                         // corchea a 92 bpm
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC(); master = ctx.createGain(); master.gain.value = mudo ? 0 : .7; master.connect(ctx.destination);
    mus = ctx.createGain(); mus.gain.value = .55; mus.connect(master);
    if (!mudo) iniciaMusica();
  }
  function tono(f, t, d, tipo = 'sine', v = .2, f2 = null, dest = master) {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = tipo; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + d + .03);
  }
  function ruido(t, d, v = .25) {
    const n = Math.floor(ctx.sampleRate * d), b = ctx.createBuffer(1, n, ctx.sampleRate), x = b.getChannelData(0);
    for (let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = b; f.type = 'bandpass'; f.frequency.value = 900;
    g.gain.value = v; s.connect(f); f.connect(g); g.connect(master); s.start(t);
  }
  function sfx(n) {
    if (!ctx || mudo || ctx.state !== 'running') return; const t = ctx.currentTime;
    switch (n) {
      case 'clic': tono(660, t, .08, 'triangle', .18, 880); break;
      case 'acierto': [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tono(f, t + i * .07, .18, 'triangle', .2)); break;
      case 'error': tono(190, t, .32, 'sawtooth', .16, 90); tono(140, t + .02, .32, 'square', .08, 70); break;
      case 'tic': tono(1250, t, .04, 'sine', .12); break;
      case 'vida': tono(440, t, .14, 'triangle', .2, 330); tono(330, t + .13, .14, 'triangle', .2, 247); tono(220, t + .26, .3, 'triangle', .22, 147); break;
      case 'moneda': tono(1318.5, t, .09, 'square', .09); tono(1760, t + .07, .22, 'square', .09); break;
      case 'golpe': ruido(t, .18, .35); tono(120, t, .16, 'sine', .3, 50); break;
      case 'victoria': [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5].forEach((f, i) => tono(f, t + i * .13, .3, 'triangle', .22)); break;
      case 'derrota': [392, 349.23, 329.63, 261.63].forEach((f, i) => tono(f, t + i * .2, .38, 'triangle', .2)); break;
    }
  }
  function agenda() {
    if (!ctx || mudo) return;
    while (prox < ctx.currentTime + .25) {
      if (prox < ctx.currentTime) prox = ctx.currentTime + .05;
      const a = ACORDES[Math.floor(paso / 8) % 4], i = paso % 8;
      if (i === 0) a.forEach(f => tono(f, prox, NEG * 8, 'triangle', .045, null, mus));
      if (i % 4 === 0) tono(a[0] / 2, prox, NEG * 3, 'sine', .08, null, mus);
      tono(a[[0, 1, 2, 1, 2, 1, 0, 1][i]] * 2, prox, NEG * 1.6, 'sine', .04, null, mus);

  function iniciaMusica() { if (timer || !ctx) return; prox = ctx.currentTime + .1; timer = setInterval(agenda, 60); }
  function paraMusica() { clearInterval(timer); timer = null; }
  function setMudo(m) {
    mudo = m; store.set(CFG.K_MUDO, m ? '1' : '0');
    if (ctx) { master.gain.setTargetAtTime(m ? 0 : .7, ctx.currentTime, .03); if (m) paraMusica(); else iniciaMusica(); }

})();
function pintaMudo() {
  const m = Snd.esMudo(); $('btnSonido').setAttribute('aria-pressed', m);
  $('btnSonido').setAttribute('aria-label', m ? 'Sonido desactivado. Toca para activar' : 'Sonido activado. Toca para silenciar');
}


/* ====================== COMÚN: pausa, sonido, voz ====================== */
function pausar(m) {
  if (S.pantalla !== 'juego' || S.fin) return;
  S.pausas.add(m); $('stage').classList.add('paused'); $('ovPausa').classList.add('on');
  vivas.forEach(a => { try { a.pause(); } catch (e) { /* ya terminó */ } }); setTimeout(() => $('btnContinuar').focus(), 30);
}
function reanudar() {
  S.pausas.clear(); $('ovPausa').classList.remove('on'); $('stage').classList.remove('paused');
  vivas.forEach(a => { try { a.play(); } catch (e) { /* ya terminó */ } }); Snd.reanuda();
}
function irA(p) { S.pantalla = p; $('stage').className = 'mode-' + p; }
function pintaMudo() {
  const m = Snd.esMudo(); $('btnSonido').setAttribute('aria-pressed', m);
  $('btnSonido').setAttribute('aria-label', m ? 'Sonido desactivado. Toca para activar' : 'Sonido activado. Toca para silenciar');
  if (m && 'speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch (e) { /* sin voz */ } }
}
function decir(t) {   // voz en español con la síntesis del navegador (si existe y no está en silencio)
  if (Snd.esMudo() || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'es-ES'; u.rate = .9; speechSynthesis.speak(u); } catch (e) { /* sin voz */ }
}
function mostrarFin(titulo, a, b, c, victoria) {
  $('tFin').textContent = titulo; $('fA').textContent = a; $('fB').textContent = b; $('fC').textContent = c;
  $('fin').classList.add('on'); Snd.sfx(victoria ? 'victoria' : 'derrota'); setTimeout(() => $('btnOtra').focus(), 50);
}
function iniciaComun(alTecla) {
  const primero = () => { Snd.init(); window.removeEventListener('pointerdown', primero, true); window.removeEventListener('keydown', primero, true); };
  window.addEventListener('pointerdown', primero, true); window.addEventListener('keydown', primero, true);
  $('btnSonido').addEventListener('click', () => { Snd.setMudo(!Snd.esMudo()); Snd.sfx('clic'); });
  $('btnContinuar').addEventListener('click', () => { Snd.sfx('clic'); reanudar(); });
  const bp = $('btnPausa'); if (bp) bp.addEventListener('click', () => { Snd.sfx('clic'); if (S.pantalla === 'juego') (S.pausas.size ? reanudar() : pausar('manual')); });
  window.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'm') { Snd.setMudo(!Snd.esMudo()); return; }
    if (S.pantalla === 'juego' && k === 'p') { if (S.pausas.size) reanudar(); else pausar('manual'); return; }
    if (alTecla) alTecla(e, k);
  });
  const sinFoco = () => { if (S.pantalla === 'juego' && !S.pausas.size && !S.fin) { pausar('foco'); Snd.suspende(); } };
  document.addEventListener('visibilitychange', () => { if (document.hidden) sinFoco(); else Snd.reanuda(); });
  window.addEventListener('blur', sinFoco);
}


/* ARRASTRE común: pointer events (ratón y táctil), imán al hueco libre más cercano y alternativa de tocar la pieza y luego el hueco */
const Arrastre = (() => {
  let cfg = null, act = null, sel = null;
  const activo = () => S.pantalla === 'juego' && !S.fin && !S.pausas.size;
  function huecoCerca(p) {
    const r = p.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2; let mejor = null, d0 = 1e9, afin = null, d1 = 1e9;
    cfg.huecos().forEach(h => {
      if (h.classList.contains('lleno')) return; const q = h.getBoundingClientRect();
      const dx = Math.max(q.left - cx, 0, cx - q.right), dy = Math.max(q.top - cy, 0, cy - q.bottom), c = Math.hypot(cx - (q.left + q.width / 2), cy - (q.top + q.height / 2));
      if (Math.hypot(dx, dy) <= cfg.tol) { if (c < d0) { d0 = c; mejor = h; } if (cfg.afin && cfg.afin(p, h) && c < d1) { d1 = c; afin = h; } }
    });
    return afin || mejor;   // si hay un hueco de la misma clase al alcance, tiene prioridad
  }
  function vuelve(p) { p.classList.remove('arrastra'); p.style.transition = RM ? 'none' : 'translate .25s ease-out'; p.style.translate = '0 0'; setTimeout(() => { p.style.transition = ''; p.style.translate = ''; }, 280); }
  function intenta(p, h) { const ok = cfg.suelta(p, h); if (ok) { p.style.translate = ''; p.style.transition = ''; p.classList.remove('arrastra', 'sel'); sel = null; } else vuelve(p); return ok; }
  function limpiaSel() { document.querySelectorAll('.pz.sel').forEach(x => x.classList.remove('sel')); sel = null; }
  function iniciar(c) {
    cfg = c; const raiz = c.raiz;
    raiz.addEventListener('pointerdown', e => {
      const p = e.target.closest('.pz'); if (!p || p.disabled || !activo() || e.button > 0) return;
      act = { p, id: e.pointerId, x0: e.clientX, y0: e.clientY, mov: false }; try { p.setPointerCapture(e.pointerId); } catch (_) { }
    });
    raiz.addEventListener('pointermove', e => {
      if (!act || act.id !== e.pointerId) return; const dx = e.clientX - act.x0, dy = e.clientY - act.y0;
      if (!act.mov && Math.hypot(dx, dy) > 7) { act.mov = true; act.p.classList.add('arrastra'); act.p.style.transition = 'none'; }
      if (act.mov) act.p.style.translate = dx + 'px ' + dy + 'px';
    });
    const fin = e => {
      if (!act || act.id !== e.pointerId) return; const a = act; act = null; const p = a.p;
      if (e.type === 'pointercancel') return vuelve(p);

      const h = huecoCerca(p); if (!h) return vuelve(p); intenta(p, h);
    };
    raiz.addEventListener('pointerup', fin); raiz.addEventListener('pointercancel', fin);
    raiz.addEventListener('click', e => { const p = e.target.closest('.pz'); if (p && e.detail === 0 && !p.disabled && activo()) { const ya = sel === p; limpiaSel(); if (!ya) { sel = p; p.classList.add('sel'); Snd.sfx('clic'); } } });
    c.zonaHuecos.addEventListener('click', e => { const h = e.target.closest('.hu'); if (h && sel && activo() && !h.classList.contains('lleno')) intenta(sel, h); });
    c.zonaHuecos.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.hu') && sel && activo()) { e.preventDefault(); const h = e.target.closest('.hu'); if (!h.classList.contains('lleno')) intenta(sel, h); } });
  }
  return { iniciar, limpiaSel, vuelve };
})();

/* ====================== 3. MOTOR ====================== */
const FORMAS = {
  rectangulo: { n: 'rectángulo', d: 'M3 3H97V97H3z', c: '#35B86A' }, triangulo: { n: 'triángulo', d: 'M50 4L97 96H3z', c: '#E8503A' }, circulo: { n: 'círculo', d: 'M50 4a46 46 0 1 0 .01 0z', c: '#2A9DF4' }, cuadrado: { n: 'cuadrado', d: 'M4 4H96V96H4z', c: '#F59A1B' }
};
const Motor = {
  /* crearTaller({nivel, azar}) -> {partes[], piezas:[formas mezcladas]}: una pieza por hueco; las del mismo tipo son intercambiables */
  crearTaller({ nivel = 0, azar = Math.random } = {}) { const partes = CFG.NIVELES[nivel].partes; return { partes, piezas: mezclar(partes.map(p => p.s), azar) }; },
  /* encaja(pieza, hueco) -> true si la forma coincide */
  encaja(forma, hueco) { return forma === hueco; }
};

/* ====================== 4. ARTE ====================== */
function tallerSVG() {
  let h = ''; for (let i = 0; i < 9; i++) h += `<path d="M0 ${620 + i * 6}Q${200 + i * 20} ${590 + i * 8} 400 ${620 + i * 6}T800 ${620 + i * 6}T1200 ${620 + i * 6}T1600 ${620 + i * 6}" fill="none" stroke="#fff" stroke-width="3" opacity=".25"/>`;
  return `<defs><linearGradient id="tfo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE9C8"/><stop offset="1" stop-color="#FFD9A0"/></linearGradient></defs><rect width="1600" height="1000" fill="url(#tfo)"/>
  <rect y="0" width="1600" height="190" fill="#C98F55"/><g stroke="#7A4A1E" stroke-width="5" opacity=".6"><path d="M0 64H1600M0 128H1600"/></g>
  <g stroke="#202D4A" stroke-width="5" stroke-linejoin="round"><path d="M200 40l40 60h-80z" fill="#9AA6B8"/><rect x="190" y="100" width="20" height="60" fill="#8A5A2E"/><rect x="1260" y="40" width="30" height="110" fill="#9AA6B8"/><circle cx="1275" cy="40" r="26" fill="#E8503A"/></g>
  <rect y="600" width="1600" height="400" fill="#59B9E9"/><path d="M0 600H1600" stroke="#202D4A" stroke-width="6"/>${h}`;
}
function castorSVG(feliz) {
  return `<svg viewBox="0 0 130 140" aria-hidden="true"><g stroke="#1A0F2A" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">
   <path d="M86 118q36-2 32 26q-26 6-40-10z" fill="#5A3A1E"/><path d="M92 124l14 8M98 118l10 10" stroke-width="2" opacity=".5" fill="none"/><path d="M30 134q0-40 34-40t34 40z" fill="#9A6A3A"/><path d="M44 134q0-20 20-20t20 20z" fill="#F4D9A8" stroke="none"/>
   <circle cx="34" cy="38" r="11" fill="#9A6A3A"/><circle cx="94" cy="38" r="11" fill="#9A6A3A"/><ellipse cx="64" cy="62" rx="36" ry="32" fill="#9A6A3A"/><ellipse cx="64" cy="72" rx="22" ry="16" fill="#F4D9A8" stroke="none"/>
   ${feliz ? '<path d="M46 54q6-8 12 0M70 54q6-8 12 0" fill="none"/>' : '<circle cx="52" cy="54" r="4" fill="#1A0F2A" stroke="none"/><circle cx="76" cy="54" r="4" fill="#1A0F2A" stroke="none"/>'}<ellipse cx="64" cy="66" rx="6" ry="4" fill="#1A0F2A" stroke="none"/>
   <rect x="56" y="74" width="7" height="12" rx="2" fill="#fff"/><rect x="65" y="74" width="7" height="12" rx="2" fill="#fff"/>
   <path d="M38 34q26-26 52 0z" fill="#FFC928"/><rect x="34" y="32" width="60" height="7" rx="3" fill="#E0A020"/></g></svg>`;
}
function figSVG(id, hueco) { const F = FORMAS[id]; return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path vector-effect="non-scaling-stroke" d="${F.d}" ${hueco ? 'fill="#ffffff55" stroke="#202D4A" stroke-width="4" stroke-dasharray="7 6"' : `fill="${F.c}" stroke="#202D4A" stroke-width="4"`} stroke-linejoin="round"/></svg>`; }

/* ====================== 5. RENDER ====================== */
function pintaTaller() {
  const t = S.t;
  $('barco').innerHTML = t.partes.map(p => `<div class="hu" data-s="${p.s}" data-p="${p.id}" role="button" tabindex="0" aria-label="Hueco para un ${FORMAS[p.s].n}" style="left:${p.x}%;top:${p.y}%;width:${p.w}%;height:${p.h}%">${figSVG(p.s, true)}</div>`).join('');
  $('panel').innerHTML = t.piezas.map(s => `<div class="cel"><button type="button" class="pz" data-s="${s}" aria-label="Pieza: ${FORMAS[s].n}">${figSVG(s, false)}</button><span>${FORMAS[s].n}</span></div>`).join('');
  $('prog').textContent = S.puestas + '/' + S.total; $('fb').textContent = ''; $('fb').className = ''; $('castor').innerHTML = castorSVG(false);
}

/* ====================== 6. FLUJO ====================== */
function suelta(p, h) {
  if (!Motor.encaja(p.dataset.s, h.dataset.s)) { S.errores++; Snd.sfx('error'); $('fb').className = 'mal'; $('fb').textContent = 'Buen intento: ese hueco es de un ' + FORMAS[h.dataset.s].n + '.'; h.classList.add('no'); setTimeout(() => h.classList.remove('no'), 450); return false; }
  const cel = p.closest('.cel'); if (cel) cel.classList.add('vacia'); h.replaceChildren(p); h.classList.add('lleno'); p.disabled = true; p.classList.add('puesta'); p.style.width = '100%'; p.style.height = '100%'; Snd.sfx('acierto'); S.puestas++; $('prog').textContent = S.puestas + '/' + S.total;
  $('fb').className = 'ok'; $('fb').textContent = '¡Bien! Un ' + FORMAS[h.dataset.s].n + ' en su lugar.'; $('castor').innerHTML = castorSVG(true); decir(FORMAS[h.dataset.s].n);
  if (S.puestas >= S.total) { const c = S.corrida; esperar(1200).then(() => { if (c === S.corrida) termina(); }).catch(e => { if (e !== CANCEL) throw e; }); }
  return true;
}
function termina() {
  S.fin = true; const k = CFG.K_REC + CFG.NIVELES[S.nivel].id, raw = store.get(k), mej = raw === null || raw === undefined ? null : parseInt(raw, 10), nuevo = mej === null || S.errores < mej; if (nuevo) store.set(k, String(S.errores));
  const m = nuevo ? S.errores : mej; mostrarFin('¡Barco terminado!', 'Errores: ' + S.errores, 'Mejor: ' + m + (m === 1 ? ' error' : ' errores') + (nuevo ? ' ¡Nuevo!' : ''), CFG.NIVELES[S.nivel].nombre, true);
}
function nuevaPartida(i) {
  S.nivel = i; S.corrida++; S.pausas.clear(); S.fin = false; S.errores = 0; S.puestas = 0; S.t = Motor.crearTaller({ nivel: i }); S.total = S.t.partes.length;
  $('fin').classList.remove('on'); $('ovPausa').classList.remove('on'); $('stage').classList.remove('paused'); irA('juego'); pintaTaller();
}
function aTitulo() { S.corrida++; S.fin = false; irA('titulo'); $('fin').classList.remove('on'); setTimeout(() => { const b = document.querySelector('.nivbtn'); if (b) b.focus(); }, 30); }

/* ====================== 7. EVENTOS ====================== */
(function iniciar() {
  $('scene').innerHTML = tallerSVG(); $('castorT').innerHTML = castorSVG(true); pintaMudo();
  $('niv').innerHTML = CFG.NIVELES.map((v, i) => `<button class="btn nivbtn" type="button" data-n="${i}">${v.nombre}</button>`).join('');
  $('niv').addEventListener('click', e => { const b = e.target.closest('.nivbtn'); if (b) { Snd.sfx('clic'); nuevaPartida(+b.dataset.n); } });
  Arrastre.iniciar({ raiz: $('panel'), zonaHuecos: $('barco'), huecos: () => [...document.querySelectorAll('#barco .hu')], tol: CFG.TOL, afin: (p, h) => p.dataset.s === h.dataset.s, suelta });
  $('btnOtra').addEventListener('click', () => { Snd.sfx('clic'); aTitulo(); }); $('btnInicio').addEventListener('click', () => { Snd.sfx('clic'); aTitulo(); });
  iniciaComun(() => { });
  window.__bar = { S, CFG, Motor, suelta };   // gancho de pruebas
})();
</script>
