<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Conchas en desorden: arrastra cada concha con el resultado hasta su operación de la tabla. Para niños de 7 a 9 años.">
<title>Conchas en desorden: tablas de multiplicar</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#12082e;color:var(--ink);
  font-family:'Fredoka','Nunito','Baloo 2','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;font-weight:700}
button{font:inherit;color:inherit}
#wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:6px}
.volver{align-self:center;color:#cfe3fb;text-decoration:none;font-size:15px;min-height:28px;display:inline-flex;align-items:center;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.08)}
.volver:hover{background:rgba(255,255,255,.18);color:#fff}
#stage{position:relative;width:var(--W);aspect-ratio:16/10;container-type:inline-size;overflow:hidden;
  border-radius:calc(var(--W)*.022);background:#2b1456;isolation:isolate;
  box-shadow:0 calc(var(--W)*.015) calc(var(--W)*.05) rgba(0,0,0,.55);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#world{position:absolute;inset:0}
#scene{position:absolute;left:0;top:0;width:100%;height:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:max(3px,.4cqw) solid #fff;outline-offset:max(2px,.3cqw)}

/* ---------- Marcos hexagonales con borde doble ---------- */
.hex{--c1:#2a7de1;--c2:#4fc3ff;position:relative;display:block;width:var(--w,7cqw);aspect-ratio:1/.866;
  filter:drop-shadow(0 0 .55cqw rgba(79,195,255,.65));border:0;background:none;padding:0;margin:0}
.hex>i,.hex>i>i,.hex>i>i>i{position:absolute;display:block;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.hex>i{inset:0;background:linear-gradient(160deg,var(--c2),var(--c1))}
.hex>i>i{inset:7%;background:#fff}
.hex>i>i>i{inset:7%;background:linear-gradient(180deg,#f6faff,#c9defa);display:grid;place-items:center;overflow:hidden}
.hex svg{width:78%;height:78%;display:block}
button.hex{cursor:pointer;transition:transform .15s,filter .15s}
button.hex:hover{transform:translateY(-.3cqw) scale(1.05);filter:drop-shadow(0 0 .9cqw rgba(255,255,255,.9))}
button.hex:active{transform:scale(.96)}
.hexw{--c1:#2a7de1;--c2:#4fc3ff;position:relative;display:block;height:6.4cqw;min-width:14.5cqw;
  filter:drop-shadow(0 0 .55cqw rgba(79,195,255,.65))}
.hexw>i,.hexw>i>i,.hexw>i>i>i{position:absolute;display:block;clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%)}
.hexw>i{inset:0;background:linear-gradient(160deg,var(--c2),var(--c1))}
.hexw>i>i{inset:7%;background:#fff}
.hexw>i>i>i{inset:7%;background:linear-gradient(180deg,#f6faff,#c9defa);display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.05;padding:0 .6cqw}
.hexw small{font-size:max(10px,1.3cqw);color:#4a5a8c;letter-spacing:.02em;font-weight:700}
.hexw b{font-size:max(13px,1.95cqw);color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}


/* ---------- Modales ---------- */
.overlay{position:absolute;inset:0;z-index:20;display:none;place-items:center;background:rgba(14,6,40,.62)}
.overlay.on{display:grid}
.modal{position:relative;width:62cqw;border-radius:2.4cqw;padding:5cqw 3cqw 2.6cqw;text-align:center;
  background:linear-gradient(180deg,#f8fcff,#c9e0fb);border:max(3px,.45cqw) solid #fff;box-shadow:0 0 0 max(3px,.5cqw) #2a7de1,0 1cqw 3cqw rgba(0,0,0,.55)}
.modal .pill{position:absolute;left:50%;top:0;transform:translate(-50%,-50%)}
.modal p{margin:.6cqw 0;font-size:max(14px,2.3cqw);line-height:1.3;color:var(--ink)}
.ej{margin:1.4cqw auto 1.8cqw;padding:1.2cqw 2cqw;border-radius:1.6cqw;background:#fff;border:.35cqw dashed #5b2bb5;display:inline-block}
.ej b{color:#5b2bb5}
#dim{position:absolute;inset:0;z-index:12;background:rgba(10,4,30,.74);opacity:0;pointer-events:none;transition:opacity .6s}
#dim.on{opacity:1}
#fin{z-index:15;background:transparent}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqw;margin:1.4cqw 0 2cqw}
.mini{display:flex;flex-direction:column;align-items:center;gap:.8cqw}
.mini .hex{--w:72%}
.mini .hex svg{width:80%;height:80%}
.mini span{font-size:max(12px,1.9cqw);line-height:1.15;color:var(--ink)}
.mini b{display:block;font-size:max(16px,3cqw);color:var(--p2)}
#cuenta{position:absolute;inset:0;z-index:11;display:none;place-items:center;pointer-events:none}
#cuenta.on{display:grid}
#cuenta span{font-size:24cqw;color:#fff;text-shadow:0 1cqw 0 #5b2bb5,0 0 4cqw rgba(79,195,255,.9);animation:cnt .9s ease-out both}
@keyframes cnt{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(.9);opacity:.9}}
.rays{animation:spin 12s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}


.pill{background:linear-gradient(180deg,#8a55ea,#4a1fa0);color:#fff;border-radius:99px;padding:.6cqw 3.2cqw;font-size:max(15px,2.5cqw);
  box-shadow:0 .4cqw 0 #2b1456,inset 0 .2cqw 0 rgba(255,255,255,.35);text-shadow:0 .2cqw 0 rgba(0,0,0,.35);display:inline-block;white-space:nowrap}
.btn{border:0;border-radius:99px;cursor:pointer;min-height:48px;padding:1cqw 6cqw;color:#fff;font-size:max(17px,2.8cqw);letter-spacing:.06em;
  background:linear-gradient(90deg,#2a7de1,#7a3be0);box-shadow:0 .5cqw 0 #1b2f84,0 1cqw 2cqw rgba(0,0,0,.35),inset 0 .2cqw 0 rgba(255,255,255,.35);
  text-shadow:0 .2cqw 0 rgba(0,0,0,.3);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.12);transform:translateY(-.3cqw)}
.btn:active{transform:translateY(.3cqw)}


#stage{background:#0b1a3a}
:root{--W:min(100vw - 16px,(100dvh - 52px)*1.6)}
#scene{position:absolute;left:0;top:0;width:100%;height:100%}
.volver{align-self:center;color:#cfe3fb;text-decoration:none;font-size:15px;min-height:28px;display:inline-flex;align-items:center;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.08)}
.volver:hover{background:rgba(255,255,255,.18);color:#fff}
#wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:6px}
:focus-visible{outline:max(3px,.4cqw) solid #fff;outline-offset:max(2px,.3cqw)}
.tw{animation:tw 3.2s ease-in-out infinite}@keyframes tw{50%{opacity:.25}}
#hudR{position:absolute;right:2cqw;top:2cqw;display:flex;align-items:center;gap:1.4cqw;z-index:8}
#hudR .hex{--w:max(56px,7cqw)}#hudR .hex svg{width:62%;height:62%}
#mudoX{opacity:1}#btnSonido[aria-pressed=false] #mudoX{opacity:0}
.paused *{animation-play-state:paused!important}
#msg{position:absolute;left:0;right:0;top:34%;text-align:center;z-index:9;font-size:max(26px,6cqw);color:#fff;text-shadow:0 .5cqw 0 rgba(0,0,0,.45),0 0 2cqw rgba(0,0,0,.5);pointer-events:none;opacity:0}
#msg.ok{color:#9dff6b}#msg.bad{color:#ff9a9a}
.cards{display:grid;gap:1cqw;margin:1.4cqw 0 2.4cqw}
.mini{display:flex;align-items:center;gap:1.4cqw;background:#fff;border-radius:99px;padding:.5cqw 2cqw .5cqw .6cqw;color:#1d1a4d;font-size:max(14px,2.3cqw);box-shadow:0 .3cqw 0 rgba(0,0,0,.12)}
.mini .hex{--w:max(46px,6.2cqw);flex:none}.mini span:last-child{flex:1;text-align:left;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.mode-titulo :is(#prog,#fb,#slots,#shells,#buzo,#btnInicio,#btnPausa){display:none}
.mode-juego #titulo{display:none}
.hex,.hexw{--c1:#0E8AC8;--c2:#FFC928;filter:drop-shadow(0 0 .55cqw rgba(255,255,255,.5))}
.btn{background:linear-gradient(90deg,#F07A1A,#E0409A)}
#titulo{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;padding-top:3cqw;text-align:center}
#titulo h1{margin:0;font-size:5.6cqw;line-height:1;color:#FFF3B0;letter-spacing:.02em;text-shadow:0 .6cqw 0 #0E5FA8,0 1.2cqw 0 #0A2E6A,0 2cqw 2cqw rgba(0,0,0,.35)}
#titulo .sub{margin:.8cqw 0 .6cqw;font-size:max(14px,2.8cqw);color:#fff}
#buzoT{width:9cqw}#buzoT svg,#buzo svg{width:100%;display:block;filter:drop-shadow(0 .6cqw .6cqw rgba(0,0,0,.35))}
#niv{display:grid;grid-template-columns:repeat(5,1fr);gap:1.4cqw;margin-top:1.4cqw;width:90%}#niv .btn{font-size:max(13px,2.1cqw);padding:1cqw .4cqw;min-height:48px;white-space:nowrap}
#prog{position:absolute;left:2cqw;top:2cqw;z-index:6;color:#fff;background:#0A2E6Add;border:max(2px,.3cqw) solid #FFF3B0;border-radius:1.4cqw;padding:.3cqw 1.8cqw;font-size:max(18px,3cqw)}
#fb{position:absolute;left:14cqw;right:14cqw;top:2.6cqw;z-index:6;text-align:center;font-size:max(16px,2.8cqw);color:#fff;text-shadow:0 .3cqw 0 #0A2E6A;min-height:3cqw}#fb.ok{color:#9dff6b}#fb.mal{color:#FFD36B}
#slots{position:absolute;left:19cqw;right:3cqw;top:11cqw;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);gap:1.6cqw}
.slot{display:flex;flex-direction:column;align-items:center;gap:.4cqw;background:#ffffff26;border:max(2px,.3cqw) solid #ffffff80;border-radius:1.6cqw;padding:.8cqw .4cqw 1cqw;cursor:pointer}
.slot .et{color:#fff;font-size:max(14px,2.7cqw);text-shadow:0 .25cqw 0 #0A2E6A;white-space:nowrap}
.hueco{width:var(--sh);height:var(--sh);border-radius:50%;border:max(2px,.3cqw) dashed #fff;display:grid;place-items:center;background:#0A2E6A55}.lleno .hueco{border-style:solid;border-color:#9dff6b;background:#0A2E6A22}
.slot:focus-visible,.shell:focus-visible{outline:3px solid #FFF3B0;outline-offset:2px}.slot.no{animation:nop .4s}@keyframes nop{25%{translate:-.8cqw 0}75%{translate:.8cqw 0}}
.slot.lleno{background:#38c06a40;border-color:#9dff6b}
#shells{position:absolute;left:3cqw;right:3cqw;top:46cqw;z-index:8;display:flex;justify-content:center;gap:1.2cqw;--sh:8cqw}
#stage{--sh:8cqw}
.shell{position:relative;width:var(--sh);height:var(--sh);padding:0;border:0;background:none;cursor:grab;touch-action:none;display:grid;place-items:center;user-select:none;-webkit-user-select:none;flex:none}
.shell svg{position:absolute;inset:0;width:100%;height:100%;display:block;filter:drop-shadow(0 .4cqw .3cqw rgba(0,0,0,.35))}.shell b{position:relative;color:#2A1A4A;font-size:calc(var(--sh)*.34);line-height:1;margin-top:12%}
.shell.arrastra{cursor:grabbing;z-index:30;filter:drop-shadow(0 1cqw 1cqw rgba(0,0,0,.4))}.shell.sel{outline:max(3px,.4cqw) solid #FFF3B0;outline-offset:.3cqw;border-radius:1.4cqw}
.shell.puesta{cursor:default;position:relative}
#buzo{position:absolute;left:2.5cqw;top:14cqw;width:13cqw;z-index:4;animation:flota 3s ease-in-out infinite alternate}@keyframes flota{to{translate:0 1.4cqw}}@media (prefers-reduced-motion:reduce){#buzo{animation:none}}
#btnInicio{position:absolute;right:2cqw;bottom:1.5cqw;z-index:6;font-size:max(14px,2.2cqw);padding:1cqw 3cqw;min-height:48px}
@media (max-width:700px) and (orientation:portrait){
  :root{--W:min(100vw - 16px,(100dvh - 52px)*.6)}
  #stage{aspect-ratio:3/5;--sh:12.6cqw}
  #titulo{padding-top:8cqw}#titulo h1{font-size:11.5cqw;padding:0 3cqw}#titulo .sub{font-size:max(14px,4.4cqw)}#buzoT{width:24cqw}
  #niv{grid-template-columns:repeat(2,1fr);gap:3cqw;width:88%;margin-top:4cqw}#niv .btn{font-size:max(15px,4.4cqw);padding:2.2cqw 1cqw}
  #prog{top:16cqw;font-size:max(16px,5cqw)}#fb{left:4cqw;right:4cqw;top:26cqw;font-size:max(14px,4.2cqw)}
  #slots{left:4cqw;right:4cqw;top:34cqw;grid-template-columns:repeat(2,1fr);gap:1.4cqw 2cqw}
  .slot{flex-direction:row;justify-content:space-between;padding:.5cqw 3cqw .5cqw 4cqw}.slot .et{font-size:max(16px,5.4cqw)}
  #shells{left:14cqw;right:14cqw;top:116cqw;flex-wrap:wrap;gap:1.6cqw 2cqw;--sh:12.6cqw}
  #buzo{left:4cqw;top:auto;bottom:3cqw;width:14cqw}#btnInicio{bottom:6cqw;right:4cqw;font-size:max(14px,4cqw);padding:2cqw 5cqw}
}
</style>
</head>
<body>
<div id="wrap">
<a class="volver" href="/matematicas/#juegos">← Volver a Matemáticas</a>
<div id="stage" class="mode-titulo">
  <div id="world">
    <svg id="scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    <section id="titulo" aria-label="Título"><h1>CONCHAS EN DESORDEN</h1><p class="sub">pon cada resultado en su lugar</p><div id="buzoT" aria-hidden="true"></div><div id="niv" role="group" aria-label="Elige una tabla"></div></section>
    <div id="prog" role="status" aria-label="Conchas colocadas"></div><div id="fb" role="status" aria-live="assertive"></div>
    <div id="slots" role="group" aria-label="Operaciones"></div><div id="shells" role="group" aria-label="Conchas con resultados"></div>
    <div id="buzo" aria-hidden="true"></div><button class="btn" id="btnInicio" type="button">Inicio</button>
    <div id="hudR"><button class="hex" id="btnPausa" type="button" aria-label="Pausa"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="16" y="14" width="12" height="36" rx="4" fill="#5b2bb5"/><rect x="36" y="14" width="12" height="36" rx="4" fill="#5b2bb5"/></svg></i></i></i></button><button class="hex" id="btnSonido" type="button" aria-label="Sonido" aria-pressed="false"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M10 25h10l14-11v36L20 39H10z" fill="#2a7de1"/><path d="M41 23c5 5 5 13 0 18M47 16c9 9 9 23 0 32" stroke="#2a7de1" stroke-width="4" fill="none" stroke-linecap="round"/><path id="mudoX" d="M14 50 52 12" stroke="#e02020" stroke-width="6" stroke-linecap="round"/></svg></i></i></i></button></div>
    <div id="msg" role="status" aria-live="assertive"></div>
  </div>
  <div class="overlay" id="ovPausa">

      <p>El juego está en pausa.</p>
      <button class="btn" id="btnContinuar" type="button">Continuar</button>
    </div>
  </div>
  
  <div class="overlay" id="fin">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tFin">
      <span class="pill" id="tFin">Fin del juego</span>
      <div id="finExtra"></div>
      <div class="cards"><div class="mini"><span class="hex"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#ico-monedas"/></svg></i></i></i></span><span id="fA">Aciertos</span></div><div class="mini"><span class="hex"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#ico-cofre"/></svg></i></i></i></span><span id="fB">Récord</span></div><div class="mini"><span class="hex"><i><i><i><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#ico-libro"/></svg></i></i></i></span><span id="fC">Preguntas</span></div></div>
      <button class="btn" id="btnOtra" type="button">Jugar de nuevo</button>
    </div>
  </div>
</div>
</div>

  <defs>

<script>
'use strict';
const CANCEL = { cancelado: true };
const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } }
};
const mezclar = (a, azar = Math.random) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(azar() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ent = (azar, lo, hi) => lo + Math.floor(azar() * (hi - lo + 1));
const elige = (a, azar = Math.random) => a[Math.floor(azar() * a.length)];
/* ============================================================
   CONCHAS EN DESORDEN: arrastra cada concha con el resultado hasta su operación de la tabla
   Estructura: 1 config · 2 estado · 3 motor · 4 arte · 5 render · 6 flujo · 7 eventos
   ============================================================ */
/* ====================== 1. CONFIG ====================== */
const CFG = {
  CONCHAS: 10, UMBRAL_TOQUE: 7,   // píxeles de movimiento a partir de los cuales un toque cuenta como arrastre
  // No confirmado en la ficha: efecto de acierto/error. Aquí el acierto fija la concha con sonido y el error la devuelve y suma un fallo
  VEL: [{ x: 1, f: 1, ritmo: 1 }], K_REC: 'con_menos_fallos_', K_MUDO: 'sc_mute'
};
/* ====================== 2. ESTADO ====================== */
const S = { pantalla: 'titulo', corrida: 0, pausas: new Set(), vel: 0, fin: false, tabla: 2, colocadas: 0, fallos: 0, sel: null, tablero: null, arr: null };

const vivas = new Set();
const D = ms => RM ? ms * 0.3 : ms * CFG.VEL[S.vel].f;     // duración según velocidad visual
function limpia(el) { el.getAnimations().forEach(a => a.cancel()); }
function anima(el, kf, op = {}) {
  const c = S.corrida;
  const a = el.animate(kf, Object.assign({ fill: 'forwards', easing: 'ease-out' }, op));
  vivas.add(a); if (S.pausas.size) a.pause();
  return a.finished.then(() => 0, () => 0).then(() => { vivas.delete(a); if (c !== S.corrida) throw CANCEL; });
}
/* Espera que se detiene mientras el juego está en pausa y se cancela al reiniciar */
function esperar(ms) {
  const c = S.corrida;
  return new Promise((res, rej) => {
    let acum = 0, ult = performance.now();
    (function f(t) {
      if (c !== S.corrida) return rej(CANCEL);
      const dt = Math.min(100, t - ult); ult = t; if (!S.pausas.size) acum += dt;
      if (acum >= ms) res(); else requestAnimationFrame(f);
    })(ult);
  });
}

/* ============================ 7. AUDIO (Web Audio, sin archivos) ============================ */
const Snd = (() => {
  let ctx = null, master = null, mus = null, mudo = store.get(CFG.K_MUDO) === '1', timer = null, paso = 0, prox = 0;
  const ACORDES = [[220, 261.63, 329.63], [174.61, 220, 261.63], [261.63, 329.63, 392], [196, 246.94, 293.66]]; // La m, Fa, Do, Sol
  const NEG = 60 / 92 / 2;                                         // corchea a 92 bpm
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC(); master = ctx.createGain(); master.gain.value = mudo ? 0 : .7; master.connect(ctx.destination);
    mus = ctx.createGain(); mus.gain.value = .55; mus.connect(master);
    if (!mudo) iniciaMusica();
  }
  function tono(f, t, d, tipo = 'sine', v = .2, f2 = null, dest = master) {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = tipo; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + d + .03);
  }
  function ruido(t, d, v = .25) {
    const n = Math.floor(ctx.sampleRate * d), b = ctx.createBuffer(1, n, ctx.sampleRate), x = b.getChannelData(0);
    for (let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = b; f.type = 'bandpass'; f.frequency.value = 900;
    g.gain.value = v; s.connect(f); f.connect(g); g.connect(master); s.start(t);
  }
  function sfx(n) {
    if (!ctx || mudo || ctx.state !== 'running') return; const t = ctx.currentTime;
    switch (n) {
      case 'clic': tono(660, t, .08, 'triangle', .18, 880); break;
      case 'acierto': [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tono(f, t + i * .07, .18, 'triangle', .2)); break;
      case 'error': tono(190, t, .32, 'sawtooth', .16, 90); tono(140, t + .02, .32, 'square', .08, 70); break;
      case 'tic': tono(1250, t, .04, 'sine', .12); break;
      case 'vida': tono(440, t, .14, 'triangle', .2, 330); tono(330, t + .13, .14, 'triangle', .2, 247); tono(220, t + .26, .3, 'triangle', .22, 147); break;
      case 'moneda': tono(1318.5, t, .09, 'square', .09); tono(1760, t + .07, .22, 'square', .09); break;
      case 'golpe': ruido(t, .18, .35); tono(120, t, .16, 'sine', .3, 50); break;
      case 'victoria': [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5].forEach((f, i) => tono(f, t + i * .13, .3, 'triangle', .22)); break;
      case 'derrota': [392, 349.23, 329.63, 261.63].forEach((f, i) => tono(f, t + i * .2, .38, 'triangle', .2)); break;
    }
  }
  function agenda() {
    if (!ctx || mudo) return;
    while (prox < ctx.currentTime + .25) {
      if (prox < ctx.currentTime) prox = ctx.currentTime + .05;
      const a = ACORDES[Math.floor(paso / 8) % 4], i = paso % 8;
      if (i === 0) a.forEach(f => tono(f, prox, NEG * 8, 'triangle', .045, null, mus));
      if (i % 4 === 0) tono(a[0] / 2, prox, NEG * 3, 'sine', .08, null, mus);
      tono(a[[0, 1, 2, 1, 2, 1, 0, 1][i]] * 2, prox, NEG * 1.6, 'sine', .04, null, mus);
      prox += NEG; paso++;
    }
  }
  function iniciaMusica() { if (timer || !ctx) return; prox = ctx.currentTime + .1; timer = setInterval(agenda, 60); }
  function paraMusica() { clearInterval(timer); timer = null; }
  function setMudo(m) {
    mudo = m; store.set(CFG.K_MUDO, m ? '1' : '0');
    if (ctx) { master.gain.setTargetAtTime(m ? 0 : .7, ctx.currentTime, .03); if (m) paraMusica(); else iniciaMusica(); }
    pintaMudo();
  }
  return { init, sfx, setMudo, esMudo: () => mudo, suspende: () => ctx && ctx.suspend(), reanuda: () => ctx && ctx.resume() };
})();
function pintaMudo() {
  const m = Snd.esMudo(); $('btnSonido').setAttribute('aria-pressed', m);
  $('btnSonido').setAttribute('aria-label', m ? 'Sonido desactivado. Toca para activar' : 'Sonido activado. Toca para silenciar');
}


/* ====================== COMÚN: pausa, sonido, voz ====================== */
function pausar(m) {
  if (S.pantalla !== 'juego' || S.fin) return;
  S.pausas.add(m); $('stage').classList.add('paused'); $('ovPausa').classList.add('on');
  vivas.forEach(a => { try { a.pause(); } catch (e) { /* ya terminó */ } }); setTimeout(() => $('btnContinuar').focus(), 30);
}
function reanudar() {
  S.pausas.clear(); $('ovPausa').classList.remove('on'); $('stage').classList.remove('paused');
  vivas.forEach(a => { try { a.play(); } catch (e) { /* ya terminó */ } }); Snd.reanuda();
}
function irA(p) { S.pantalla = p; $('stage').className = 'mode-' + p; }
function pintaMudo() {
  const m = Snd.esMudo(); $('btnSonido').setAttribute('aria-pressed', m);
  $('btnSonido').setAttribute('aria-label', m ? 'Sonido desactivado. Toca para activar' : 'Sonido activado. Toca para silenciar');
  if (m && 'speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch (e) { /* sin voz */ } }
}
function decir(t) {   // voz en español con la síntesis del navegador (si existe y no está en silencio)
  if (Snd.esMudo() || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'es-ES'; u.rate = .9; speechSynthesis.speak(u); } catch (e) { /* sin voz */ }
}
function mostrarFin(titulo, a, b, c, victoria) {
  $('tFin').textContent = titulo; $('fA').textContent = a; $('fB').textContent = b; $('fC').textContent = c;
  $('fin').classList.add('on'); Snd.sfx(victoria ? 'victoria' : 'derrota'); setTimeout(() => $('btnOtra').focus(), 50);
}
function iniciaComun(alTecla) {
  const primero = () => { Snd.init(); window.removeEventListener('pointerdown', primero, true); window.removeEventListener('keydown', primero, true); };
  window.addEventListener('pointerdown', primero, true); window.addEventListener('keydown', primero, true);
  $('btnSonido').addEventListener('click', () => { Snd.setMudo(!Snd.esMudo()); Snd.sfx('clic'); });
  $('btnContinuar').addEventListener('click', () => { Snd.sfx('clic'); reanudar(); });
  const bp = $('btnPausa'); if (bp) bp.addEventListener('click', () => { Snd.sfx('clic'); if (S.pantalla === 'juego') (S.pausas.size ? reanudar() : pausar('manual')); });
  window.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'm') { Snd.setMudo(!Snd.esMudo()); return; }
    if (S.pantalla === 'juego' && k === 'p') { if (S.pausas.size) reanudar(); else pausar('manual'); return; }
    if (alTecla) alTecla(e, k);
  });
  const sinFoco = () => { if (S.pantalla === 'juego' && !S.pausas.size && !S.fin) { pausar('foco'); Snd.suspende(); } };
  document.addEventListener('visibilitychange', () => { if (document.hidden) sinFoco(); else Snd.reanuda(); });
  window.addEventListener('blur', sinFoco);
}


/* ====================== 3. MOTOR ====================== */
const Motor = {
  /* crearTablero({tabla, azar}) -> {ops:[{k,res,texto}], conchas:[res mezclados]}; las conchas nunca quedan en el orden de la tabla */
  crearTablero({ tabla = 2, azar = Math.random } = {}) {
    const ops = Array.from({ length: CFG.CONCHAS }, (_, i) => ({ k: i + 1, res: tabla * (i + 1), texto: `${tabla} × ${i + 1}` }));
    let c, t = 0; do { c = mezclar(ops.map(o => o.res), azar); t++; } while (t < 50 && c.every((v, i) => v === ops[i].res));
    return { ops, conchas: c };
  },
  /* verifica(op, valor) -> true si la concha con ese resultado pertenece a la operación */
  verifica(op, valor) { return op.res === valor; }
};

/* ====================== 4. ARTE ====================== */
function marSVG() {
  let b = ''; for (let i = 0; i < 26; i++) b += `<circle cx="${(i * 131 + 40) % 1600}" cy="${(i * 89 + 60) % 820}" r="${5 + (i % 4) * 4}" fill="none" stroke="#fff" stroke-width="3" opacity=".35"/>`;
  let al = ''; for (let i = 0; i < 9; i++) al += `<path d="M${90 + i * 190} 900q-30-70 0-140t0-140" fill="none" stroke="#1FB57A" stroke-width="16" stroke-linecap="round" opacity=".75"/>`;
  return `<defs><linearGradient id="mar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2AB7D9"/><stop offset=".7" stop-color="#0E5FA8"/><stop offset="1" stop-color="#0A2E6A"/></linearGradient></defs>
  <rect width="1600" height="1000" fill="url(#mar)"/><path d="M0 0H1600V60Q1400 100 1200 60T800 60T400 60T0 60z" fill="#fff" opacity=".18"/>${b}${al}
  <path d="M0 900Q400 840 800 890T1600 870V1000H0z" fill="#E8C98A"/><path d="M0 940Q500 900 900 940T1600 930V1000H0z" fill="#D2AE6A"/>`;
}
function concha(n, c) {   // concha en abanico con el número
  return `<svg viewBox="0 0 100 92" aria-hidden="true" focusable="false"><path d="M8 80Q0 28 50 6Q100 28 92 80Q50 96 8 80z" fill="var(--sc)" stroke="#2A1A4A" stroke-width="4" stroke-linejoin="round"/>
  <path d="M50 84L22 30M50 84L38 16M50 84L62 16M50 84L78 30" stroke="#2A1A4A" stroke-width="3" opacity=".35" fill="none"/><rect x="36" y="82" width="28" height="9" rx="4" fill="#2A1A4A"/>
  <ellipse cx="50" cy="56" rx="26" ry="17" fill="#fff" opacity=".92"/></svg><b>${n}</b>`;
}
function buzoSVG() {   // buzo propio: traje naranja, casco redondo, tanque
  return `<svg viewBox="0 0 120 150" aria-hidden="true"><g stroke="#1A0F2A" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">
   <rect x="14" y="58" width="22" height="56" rx="9" fill="#6B7A8F"/><path d="M34 74q-22 4-26 30" fill="none" stroke="#F07A1A" stroke-width="12"/><path d="M34 74q-22 4-26 30" fill="none" stroke-width="3.4" opacity="0"/>
   <path d="M34 66h56q8 0 8 10v44H30V76q0-10 4-10z" fill="#F07A1A"/><path d="M40 120l-6 22h22l2-22zM78 120l2 22h22l-6-22z" fill="#E0409A"/>
   <path d="M92 76q22 6 22 28" fill="none" stroke="#F07A1A" stroke-width="12"/><circle cx="62" cy="42" r="32" fill="#FFC928"/><circle cx="62" cy="42" r="23" fill="#8FE4F5"/>
   <path d="M48 36q6-10 18-8" fill="none" stroke="#fff" stroke-width="5" opacity=".8"/><circle cx="56" cy="46" r="3" fill="#1A0F2A" stroke="none"/><circle cx="72" cy="46" r="3" fill="#1A0F2A" stroke="none"/><path d="M56 54q8 6 16 0" fill="none"/>
   <rect x="52" y="76" width="20" height="8" rx="4" fill="#FFC928"/></g></svg>`;
}

/* ====================== 5. RENDER ====================== */
const COLORES = ['#FF7AB8', '#FFB347', '#B28AF0', '#6FD6C8', '#F4E27A'];
function pintaTablero() {
  const t = S.tablero;
  $('slots').innerHTML = t.ops.map(o => `<div class="slot" data-k="${o.k}" role="button" tabindex="0" aria-label="Hueco de ${o.texto}"><span class="et">${o.texto}</span><span class="hueco"></span></div>`).join('');
  $('shells').innerHTML = t.conchas.map((v, i) => `<button type="button" class="shell" data-v="${v}" style="--sc:${COLORES[i % 5]}" aria-label="Concha ${v}">${concha(v)}</button>`).join('');
  $('prog').textContent = '0/' + CFG.CONCHAS; $('fb').textContent = ''; $('fb').className = '';
}
function pintaProg() { $('prog').textContent = S.colocadas + '/' + CFG.CONCHAS; }

/* ====================== 6. FLUJO ====================== */
function soltar(shell, slot) {   // intenta poner la concha en el hueco; true si fue correcto
  const op = S.tablero.ops[+slot.dataset.k - 1], v = +shell.dataset.v;
  if (slot.classList.contains('lleno')) return false;
  if (Motor.verifica(op, v)) {
    slot.querySelector('.hueco').appendChild(shell); shell.style.translate = ''; shell.style.transition = ''; shell.classList.remove('sel', 'arrastra'); shell.classList.add('puesta'); shell.disabled = true;
    slot.classList.add('lleno'); slot.removeAttribute('tabindex'); slot.setAttribute('aria-label', op.texto + ' = ' + v); S.colocadas++; S.sel = null; Snd.sfx('acierto'); pintaProg();
    if (!RM) shell.animate([{ scale: 1.35 }, { scale: 1 }], { duration: 300, easing: 'ease-out' });
    $('fb').className = 'ok'; $('fb').textContent = '¡Bien! ' + op.texto + ' = ' + v;
    if (S.colocadas >= CFG.CONCHAS) { const c = S.corrida; setTimeout(() => { if (c === S.corrida && !S.fin) termina(); }, 700); }
    return true;
  }
  S.fallos++; Snd.sfx('error'); $('fb').className = 'mal'; $('fb').textContent = 'Buen intento. ' + v + ' no es ' + op.texto;
  slot.classList.add('no'); setTimeout(() => slot.classList.remove('no'), 450); return false;
}
function vuelve(shell) {
  shell.classList.remove('arrastra'); shell.style.transition = RM ? 'none' : 'translate .25s ease-out'; shell.style.translate = '0 0';
  setTimeout(() => { shell.style.transition = ''; shell.style.translate = ''; }, 280);
}
function slotEn(x, y) {   // hueco libre más cercano al punto, con tolerancia
  let mejor = null, d0 = 1e9; for (const s of document.querySelectorAll('.slot')) { const r = s.getBoundingClientRect(); const dx = Math.max(r.left - x, 0, x - r.right), dy = Math.max(r.top - y, 0, y - r.bottom), d = Math.hypot(dx, dy); if (d < d0) { d0 = d; mejor = s; } }
  return d0 <= 14 ? mejor : null;
}
function seleccionar(shell) {
  document.querySelectorAll('.shell.sel').forEach(s => s.classList.remove('sel')); if (S.sel === shell) { S.sel = null; return; }
  S.sel = shell; shell.classList.add('sel'); Snd.sfx('clic');
}
function termina() {
  S.fin = true; const k = CFG.K_REC + S.tabla, raw = store.get(k), mej = raw === null || raw === undefined ? null : parseInt(raw, 10), nuevo = mej === null || S.fallos < mej; if (nuevo) store.set(k, String(S.fallos));
  mostrarFin(S.fallos === 0 ? '¡Sin un solo fallo!' : '¡Todo en su lugar!', 'Fallos: ' + S.fallos, 'Mejor: ' + (nuevo ? S.fallos : mej) + ((nuevo ? S.fallos : mej) === 1 ? ' fallo' : ' fallos') + (nuevo ? ' ¡Nuevo!' : ''), 'Tabla del ' + S.tabla, true);
}
function nuevaPartida(t) {
  S.tabla = t; S.corrida++; S.pausas.clear(); S.fin = false; S.colocadas = 0; S.fallos = 0; S.sel = null; S.arr = null; S.tablero = Motor.crearTablero({ tabla: t });
  $('fin').classList.remove('on'); $('ovPausa').classList.remove('on'); $('stage').classList.remove('paused'); irA('juego'); pintaTablero();
}
function aTitulo() { S.corrida++; S.fin = false; irA('titulo'); $('fin').classList.remove('on'); setTimeout(() => { const b = document.querySelector('.nivbtn'); if (b) b.focus(); }, 30); }

/* ====================== 7. EVENTOS ====================== */
(function iniciar() {
  $('scene').innerHTML = marSVG(); $('buzo').innerHTML = buzoSVG(); $('buzoT').innerHTML = buzoSVG(); pintaMudo();
  $('niv').innerHTML = Array.from({ length: 10 }, (_, i) => `<button class="btn nivbtn" type="button" data-n="${i + 1}">Tabla del ${i + 1}</button>`).join('');
  $('niv').addEventListener('click', e => { const b = e.target.closest('.nivbtn'); if (b) { Snd.sfx('clic'); nuevaPartida(+b.dataset.n); } });
  const sh = $('shells');
  sh.addEventListener('pointerdown', e => {
    const b = e.target.closest('.shell'); if (!b || b.disabled || S.pausas.size || S.fin || e.button > 0) return;
    S.arr = { b, id: e.pointerId, x0: e.clientX, y0: e.clientY, mov: false }; try { b.setPointerCapture(e.pointerId); } catch (_) { }
  });
  sh.addEventListener('pointermove', e => {
    const a = S.arr; if (!a || a.id !== e.pointerId) return; const dx = e.clientX - a.x0, dy = e.clientY - a.y0;
    if (!a.mov && Math.hypot(dx, dy) > CFG.UMBRAL_TOQUE) { a.mov = true; a.b.classList.add('arrastra'); a.b.style.transition = 'none'; }
    if (a.mov) a.b.style.translate = dx + 'px ' + dy + 'px';
  });
  const fin = e => {
    const a = S.arr; if (!a || a.id !== e.pointerId) return; S.arr = null; const b = a.b;
    if (e.type === 'pointercancel') { vuelve(b); return; }
    if (!a.mov) { seleccionar(b); return; }
    const r = b.getBoundingClientRect(), s = slotEn(r.left + r.width / 2, r.top + r.height / 2);
    if (s && s.classList.contains('lleno')) { vuelve(b); return; }
    if (!s || !soltar(b, s)) vuelve(b);
  };
  sh.addEventListener('pointerup', fin); sh.addEventListener('pointercancel', fin);
  sh.addEventListener('click', e => { const b = e.target.closest('.shell'); if (b && e.detail === 0 && !b.disabled) seleccionar(b); });   // teclado: Enter/Espacio
  const alSlot = s => { if (!s || s.classList.contains('lleno') || !S.sel || S.pausas.size || S.fin) return; soltar(S.sel, s); };
  $('slots').addEventListener('click', e => alSlot(e.target.closest('.slot')));
  $('slots').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); alSlot(e.target.closest('.slot')); } });
  $('btnOtra').addEventListener('click', () => { Snd.sfx('clic'); aTitulo(); }); $('btnInicio').addEventListener('click', () => { Snd.sfx('clic'); aTitulo(); });
  iniciaComun(() => { });
  window.__con = { S, CFG, Motor, soltar };   // gancho de pruebas
})();
